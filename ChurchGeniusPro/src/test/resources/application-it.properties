# ── Integration-test profile (Testcontainers PostgreSQL) ──
# The datasource is supplied at runtime by @ServiceConnection on the Postgres
# container, so no URL is set here. These overrides neutralize external services
# and keep schema management identical to production (ddl-auto=update).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.generate_statistics=true
spring.session.store-type=none

# app.base-url is only defined by the local/trial/prod profiles (production-readiness
# audit 2026-10-07, Phase 4.2 — no default profile). Several services inject it
# without a fallback (AppUserService, EmailService, ServiceClientService,
# ReminderSchedulerService), so the full-context test needs a value here.
app.base-url=http://localhost:8080

# Neutralize external integrations so the context boots offline.
spring.mail.host=localhost
spring.mail.port=3025
openai.api.key=
twilio.account-sid=
twilio.auth-token=

management.endpoints.web.exposure.include=health,info,metrics,prometheus
