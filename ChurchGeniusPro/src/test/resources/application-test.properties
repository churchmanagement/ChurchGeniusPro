# ── Fast test profile (H2, PostgreSQL-compatibility mode) ──
# Used by lightweight @SpringBootTest runs that don't need a real Postgres.
# DB-layer / integration tests use Testcontainers Postgres instead (see *IT classes).
spring.datasource.url=jdbc:h2:mem:cgp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Surface slow/N+1 queries during tests (DB query analysis hook).
spring.jpa.properties.hibernate.generate_statistics=true

# Store HTTP sessions in memory for tests (prod uses spring-session-jdbc).
spring.session.store-type=none

# Neutralize external integrations so the context boots offline.
spring.mail.host=localhost
spring.mail.port=3025
openai.api.key=
twilio.account-sid=
twilio.auth-token=

# Expose actuator health/metrics for performance monitoring checks.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
