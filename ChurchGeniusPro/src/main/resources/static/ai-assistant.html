<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
  <link rel="stylesheet" href="/shell.css" />
  <title>AI Assistant — Church Genius Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #333; }
    .sidebar { background: #673147 !important; }
    .nav-item-btn { color: rgba(255,255,255,.82) !important; }
    .nav-sub-btn  { color: rgba(255,255,255,.7)  !important; }
    .brand-name, .user-name { color: #fff !important; }

    /* The page is one chat window: header · scrolling transcript · composer. */
    .page-content { display: flex; flex-direction: column; overflow: hidden !important; padding: 16px 24px 14px !important; }
    .chat-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-shrink: 0; }
    .page-title    { font-size: 20px; font-weight: 700; color: #673147; }
    .page-subtitle { font-size: 12.5px; color: #999; margin-top: 2px; }
    .chat-clear { font-size: 12px; color: #8a6c7b; border: 1px solid #e0d3da; background: #fff; border-radius: 8px; padding: 6px 11px; white-space: nowrap; }
    .chat-clear:hover { background: #673147; color: #fff; border-color: #673147; }

    .chat-shell { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; border: 1px solid #e8e2e6; border-radius: 16px; box-shadow: 0 2px 14px rgba(103,49,71,.08); overflow: hidden; }
    .chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; background: linear-gradient(#fbf8fa, #fff 120px); }
    .msg { display: flex; gap: 10px; max-width: 82%; animation: msgIn .18s ease-out; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; margin-top: 18px; }
    .msg.assistant .avatar { background: #f3e8ee; }
    .msg.user .avatar { background: #e8eaf6; }
    .msg-body { min-width: 0; }
    .msg-meta { font-size: 11px; color: #9a8f95; margin: 0 4px 3px; display: flex; gap: 8px; }
    .msg.user .msg-meta { justify-content: flex-end; }
    .bubble { border-radius: 16px; padding: 11px 15px; font-size: 14px; line-height: 1.6; word-wrap: break-word; overflow-wrap: anywhere; }
    .msg.user .bubble { background: #673147; color: #fff; border-bottom-right-radius: 5px; white-space: pre-wrap; }
    .msg.assistant .bubble { background: #f6f1f4; color: #2b2b36; border-bottom-left-radius: 5px; border: 1px solid #eee3e9; }
    .msg.assistant .bubble.denied { background: #ffebee; color: #b71c1c; border-color: #f5c6cb; }
    .msg.assistant .bubble.notice { background: #fff8e1; color: #7c4a12; border-color: #ffe4a3; }
    .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 4px 0 8px 20px; } .bubble li { margin: 2px 0; }
    .bubble .ai-answer { font-size: 14px; color: inherit; line-height: 1.6; }
    .bubble .ai-results-hdr, .bubble .ai-results-close { display: none; }
    .bubble .aa-suggest { background: #fff; }
    .bubble .aa-more { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e9dde4; font-size: 12px; color: #888; }
    .bubble .aa-more a { color: #673147; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .chip { border: 1.5px solid #d8c9d1; border-radius: 18px; padding: 5px 12px; font-size: 12.5px; color: #673147; background: #fff; }
    .chip:hover { background: #673147; color: #fff; border-color: #673147; }
    .typing .bubble { display: inline-flex; gap: 5px; align-items: center; padding: 13px 16px; }
    .typing .dot { width: 7px; height: 7px; border-radius: 50%; background: #a98a99; animation: blink 1.2s infinite; }
    .typing .dot:nth-child(2) { animation-delay: .2s; } .typing .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

    /* Composer — same hooks as the Home bar (.ai-search-wrap / .ai-search-bar / #aiSearchInput)
       so the shared ai-assistant.js attaches its Type / Voice / Converse / Guide / Help controls here. */
    .composer { flex-shrink: 0; border-top: 1px solid #eee3e9; padding: 10px 14px 10px; background: #fff; }
    .ai-search-wrap { padding: 0; }
    .ai-search-bar { display: flex; align-items: flex-end; gap: 10px; background: #fff; border: 2px solid #d9cdd4; border-radius: 14px; padding: 8px 12px; transition: border-color .2s, box-shadow .2s; }
    .ai-search-bar:focus-within { border-color: #673147; box-shadow: 0 0 0 4px rgba(103,49,71,.1); }
    .ai-search-icon { font-size: 18px; flex-shrink: 0; align-self: center; }
    .ai-search-input { flex: 1 1 180px; border: none; outline: none; font-size: 14.5px; color: #1e2139; background: transparent; min-width: 120px; resize: none; line-height: 1.45; max-height: 150px; padding: 7px 0; font-family: inherit; }
    .ai-search-btn { background: #673147; color: #fff; border-radius: 9px; padding: 0 18px; height: 36px; font-size: 13px; font-weight: 700; white-space: nowrap; align-self: center; }
    .ai-search-btn:hover { background: #4f2538; }
    .ai-search-btn:disabled { opacity: .6; cursor: default; }
    .ai-search-bar .aa-controls { align-self: center; }
    .composer-note { font-size: 11px; color: #aaa; margin-top: 5px; }
    #aiResultsWrap { display: none !important; }

    @media (max-width: 640px) {
      .page-content { padding: 8px 8px 8px !important; }
      .chat-head { margin-bottom: 6px; } .page-subtitle { display: none; }
      .chat-shell { border-radius: 12px; }
      .chat-log { padding: 12px 10px 6px; gap: 10px; }
      .msg { max-width: 92%; }
      .avatar { width: 28px; height: 28px; font-size: 14px; margin-top: 16px; }
      .bubble { font-size: 13.5px; padding: 9px 12px; }
      .composer { padding: 8px; }
      .composer-note { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <header id="topbar" class="topbar"></header>
    <main class="page-content">

      <div class="chat-head">
        <div>
          <div class="page-title">✨ AI Assistant</div>
          <div class="page-subtitle">Ask about your church data, find a page, or get help with a task — by typing, speaking, or in conversation</div>
        </div>
        <button type="button" class="chat-clear" id="chatClear" title="Start a new conversation">🗑 Clear conversation</button>
      </div>

      <div class="chat-shell">
        <div class="chat-log" id="chatLog" role="log" aria-live="polite" aria-label="Conversation with the AI Assistant"></div>

        <div class="composer">
          <!-- ── Composer (hosted by ai-assistant.js: it adds the mode buttons, hint and Guide here) ── -->
          <div class="ai-search-wrap">
            <div class="ai-search-bar">
              <span class="ai-search-icon">✨</span>
              <textarea id="aiSearchInput" class="ai-search-input" rows="1"
                        placeholder="Type your question… (Enter to send, Shift+Enter for a new line)"
                        autocomplete="off" aria-label="Your question"></textarea>
              <button class="ai-search-btn" id="aiSearchBtn" type="button">Send</button>
            </div>
            <div id="aiResultsWrap" style="display:none;"></div>
          </div>
          <div class="composer-note">Enter sends · Shift+Enter adds a line · 🎤 Voice and 🗣 Converse work here too</div>
        </div>
      </div>

    </main>
    <footer id="app-footer" class="app-footer"></footer>
  </div>
</div>

<script>
window.CGP_PAGE = { activePage: 'more/ai-assistant', openSection: 'more', pageTitle: 'AI Assistant' };
// NOTE: no placeholder window.runAiSearch here. The shared engine captures any
// pre-existing runAiSearch as the page's "data lookup" and delegates plain
// questions to it; on this page that used to be an empty stub, so those
// questions produced no answer. With nothing to capture, every question goes
// through the assistant's own data / LLM / help flow.

/* ══════════════════ Chat transcript adapter for the shared assistant engine ══════════════════
   ai-assistant.js (loaded by shell.js) calls these hooks instead of writing a results panel:
     question(text, mode)  — once per turn, for Type, Voice and Converse alike
     answer(card, a, q)    — the finished answer card element
     busy(on)              — reply in flight → typing indicator
     notice(text)          — a toast (voice errors, pop-up blocked)
   Everything shown comes through those hooks, so a turn is added exactly once. */
(function () {
  var STORE_KEY = 'aa.chat';          // sessionStorage: this tab only, gone when the tab closes
  var MAX_MSGS  = 60;                 // keep the transcript bounded
  var MAX_HTML  = 20000;              // and each stored bubble
  var EXAMPLES  = ['Who are our volunteers?', 'What was the income for March?', 'Whose birthday is this week?', 'How do I add a family?', 'Open the attendance page'];
  var log = document.getElementById('chatLog');
  var input = document.getElementById('aiSearchInput');
  var sendBtn = document.getElementById('aiSearchBtn');
  var messages = [];                  // { role:'user'|'assistant', html, ts, kind }
  var typingEl = null, user = null;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function timeOf(ts) { try { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } }

  /* Plain answer text → paragraphs, line breaks and bullet / numbered lists. Escaped first:
     nothing the server returns is ever interpreted as HTML. */
  function formatAnswer(text) {
    var LIST = /^\s*([-•*]|\d+[.)])\s+/;
    var blocks = String(text || '').replace(/\r\n?/g, '\n').trim().split(/\n{2,}/);
    return blocks.map(function (block) {
      // A block may mix plain lines and list lines ("To add a family:" followed by "1. …"):
      // consecutive list lines become one list, the rest a paragraph with line breaks.
      var out = '', para = [], list = null, ordered = false;
      function flushPara() { if (para.length) { out += '<p>' + para.map(esc).join('<br>') + '</p>'; para = []; } }
      function flushList() { if (list) { out += '<' + (ordered ? 'ol' : 'ul') + '>' + list.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</' + (ordered ? 'ol' : 'ul') + '>'; list = null; } }
      block.split('\n').forEach(function (l) {
        if (LIST.test(l)) { if (!list) { flushPara(); list = []; ordered = /^\s*\d+[.)]\s+/.test(l); } list.push(l.replace(LIST, '')); }
        else { flushList(); para.push(l); }
      });
      flushList(); flushPara();
      return out;
    }).join('');
  }

  function scrollToEnd() { try { log.scrollTop = log.scrollHeight; } catch (e) {} }

  function bubbleEl(m) {
    var el = document.createElement('div'); el.className = 'msg ' + m.role;
    el.innerHTML = '<div class="avatar">' + (m.role === 'user' ? '🙂' : '✨') + '</div>'
      + '<div class="msg-body"><div class="msg-meta"><span>' + (m.role === 'user' ? 'You' : 'AI Assistant') + '</span><span>' + esc(timeOf(m.ts)) + '</span></div>'
      + '<div class="bubble' + (m.kind ? ' ' + esc(m.kind) : '') + '"></div></div>';
    var b = el.querySelector('.bubble');
    if (m.role === 'user') b.textContent = m.text; else b.innerHTML = m.html;   // assistant html is our own markup built from escaped text
    return el;
  }

  function push(m) {
    messages.push(m);
    if (messages.length > MAX_MSGS) messages = messages.slice(-MAX_MSGS);
    if (typingEl && typingEl.parentNode) log.insertBefore(bubbleEl(m), typingEl); else log.appendChild(bubbleEl(m));
    save(); scrollToEnd();
  }

  /* ── persistence (sessionStorage; discarded if a different user signs in) ── */
  function save() {
    try {
      var slim = messages.map(function (m) { return { role: m.role, text: m.text, html: m.html && m.html.length > MAX_HTML ? m.html.slice(0, MAX_HTML) : m.html, ts: m.ts, kind: m.kind }; });
      sessionStorage.setItem(STORE_KEY, JSON.stringify({ user: user, messages: slim }));
    } catch (e) {}
  }
  function load() {
    try {
      var d = JSON.parse(sessionStorage.getItem(STORE_KEY) || 'null');
      if (!d || !Array.isArray(d.messages)) return [];
      if (d.user && user && d.user !== user) { sessionStorage.removeItem(STORE_KEY); return []; }
      return d.messages;
    } catch (e) { return []; }
  }
  function clearAll() {
    messages = []; try { sessionStorage.removeItem(STORE_KEY); } catch (e) {}
    log.innerHTML = ''; typingEl = null; welcome(); input.focus();
  }

  function welcome() {
    var el = document.createElement('div'); el.className = 'msg assistant'; el.id = 'chatWelcome';
    el.innerHTML = '<div class="avatar">✨</div><div class="msg-body"><div class="msg-meta"><span>AI Assistant</span></div>'
      + '<div class="bubble"><p>Hi! I can answer questions from your church records (only what your role is allowed to see), find a page for you, or walk you through a task.</p>'
      + '<p style="margin-bottom:0;">Try one of these, or type your own question:</p><div class="chips" id="chatChips">'
      + EXAMPLES.map(function (x) { return '<button type="button" class="chip">' + esc(x) + '</button>'; }).join('') + '</div></div></div>';
    log.appendChild(el);
  }

  /* ── typing indicator ── */
  function showTyping(on) {
    if (on) {
      if (!typingEl) {
        typingEl = document.createElement('div'); typingEl.className = 'msg assistant typing'; typingEl.id = 'chatTyping';
        typingEl.setAttribute('aria-label', 'The assistant is typing');
        typingEl.innerHTML = '<div class="avatar">✨</div><div class="msg-body"><div class="msg-meta"><span>AI Assistant</span></div><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';
        log.appendChild(typingEl);
      }
      sendBtn.disabled = true; scrollToEnd();
    } else {
      if (typingEl && typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
      typingEl = null; sendBtn.disabled = false;
    }
  }

  /* ── the adapter the engine calls ── */
  window.CGP_ASSISTANT_UI = {
    question: function (text) {
      var w = document.getElementById('chatWelcome'); if (w) w.querySelector('.chips') && w.querySelector('.chips').remove();
      push({ role: 'user', text: String(text || ''), ts: Date.now() });
      showTyping(true);
    },
    answer: function (card, a) {
      showTyping(false);
      var kind = '';
      var ans = card && card.querySelector ? card.querySelector('.ai-answer') : null;
      var text = ans ? ans.textContent : (a && a.answer) || '';
      if ((ans && ans.classList.contains('ai-denied')) || (a && (a.intent === 'denied' || a.denied === true))) kind = 'denied';
      var html = formatAnswer(text);
      if (card && card.querySelectorAll) {
        // Page suggestions (Open / New tab) and the Help Center link come across as-is;
        // the engine's own listeners are dropped (cloned) — the transcript wires them once.
        card.querySelectorAll('.aa-suggest').forEach(function (sg) { sg.querySelectorAll('.aa-open').forEach(function (b) { b.parentNode.replaceChild(b.cloneNode(true), b); }); html += sg.outerHTML; });
        var more = card.querySelector('a[href="/helpCenter"]');
        if (more) html += '<div class="aa-more">Need more detail? <a href="/helpCenter">Open the full Help Center →</a></div>';
      }
      push({ role: 'assistant', html: html, ts: Date.now(), kind: kind });
    },
    busy: function (on) { showTyping(!!on); },
    notice: function (text) { showTyping(false); push({ role: 'assistant', html: '<p>' + esc(text) + '</p>', ts: Date.now(), kind: 'notice' }); }
  };

  /* ── sending ── */
  function send() {
    var q = (input.value || '').trim(); if (!q) { input.focus(); return; }
    var run = window.runAiSearch;
    if (typeof run !== 'function' || run.__aa !== true) { setTimeout(send, 150); return; }   // engine still loading
    run();                                   // the engine reads #aiSearchInput, clears it and calls question() once
    input.value = ''; autosize();
  }
  function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 150) + 'px'; }
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', autosize);
  sendBtn.addEventListener('click', send);
  document.getElementById('chatClear').addEventListener('click', clearAll);

  // One delegated handler for every Open / New tab button and example chip in the transcript.
  log.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (chip) { input.value = chip.textContent.trim(); autosize(); send(); return; }
    var b = e.target.closest('.aa-open');
    if (b && window.CGP_ASSISTANT && typeof window.CGP_ASSISTANT.open === 'function') {
      e.preventDefault();
      window.CGP_ASSISTANT.open(b.getAttribute('data-url'), b.getAttribute('data-label'), b.getAttribute('data-nt') === '1');
    }
  });

  /* ── boot: who is signed in (so another user's transcript is never shown), then restore ── */
  function boot() {
    var stored = load();
    if (stored.length) { messages = stored; stored.forEach(function (m) { log.appendChild(bubbleEl(m)); }); }
    else welcome();
    scrollToEnd(); input.focus();
  }
  fetch('/api/session', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (s) { user = s && (s.username || s.memberId || s.clientId) ? String(s.username || s.memberId || s.clientId) : null; })
    .catch(function () {}).then(boot);
})();
</script>
<script src="/shell.js"></script>
<script src="/session.js"></script>
</body>
</html>
