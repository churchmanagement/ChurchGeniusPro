<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
  <link rel="stylesheet" href="/shell.css" />
  <title>Genius Assistant — Church Genius Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #333; }
    .sidebar { background: #673147 !important; }
    .nav-item-btn { color: rgba(255,255,255,.82) !important; }
    .nav-sub-btn  { color: rgba(255,255,255,.7)  !important; }
    .brand-name, .user-name { color: #fff !important; }

    /* 2026-11-09: the full-page view of the Genius Assistant chat panel (ai-chat.js mounts it in #gaPageHost). */
    .page-content { display: flex; flex-direction: column; overflow: hidden !important; padding: 16px 24px 14px !important; }
    .chat-head { margin-bottom: 10px; flex-shrink: 0; }
    .page-title    { font-size: 20px; font-weight: 700; color: #673147; }
    .page-subtitle { font-size: 12.5px; color: #8a8090; margin-top: 2px; }
    #gaPageHost { flex: 1; min-height: 0; display: flex; flex-direction: column; max-width: 980px; width: 100%; margin: 0 auto; }
    #gaPageHost .ga-panel { flex: 1; min-height: 0; }
    /* The engine's own bar (Type / Voice / Converse buttons, hint, guide) stays on the page but out of sight:
       the panel's 🎤 and menu press those buttons. */
    .ai-search-wrap.ga-engine-bar { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
    @media (max-width: 640px) {
      .page-content { padding: 6px 6px 6px !important; }
      .chat-head { display: none; }
      #gaPageHost .ga-panel.ga-page { border-radius: 12px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <header id="topbar" class="topbar"></header>
    <main class="page-content">

      <div class="chat-head">
        <div class="page-title">✦ Genius Assistant</div>
        <div class="page-subtitle">Ask about your church data, find a page, or tell me what to create — type it or say it. Nothing is saved until you confirm.</div>
      </div>

      <div id="gaPageHost" aria-label="Genius Assistant conversation"></div>

      <!-- The assistant engine (ai-assistant.js) attaches its mode buttons, hint and guide to this bar. -->
      <div class="ai-search-wrap ga-engine-bar" aria-hidden="true">
        <div class="ai-search-bar">
          <input type="text" id="aiSearchInput" class="ai-search-input" autocomplete="off" tabindex="-1" aria-label="Assistant engine input" />
          <button class="ai-search-btn" id="aiSearchBtn" type="button" tabindex="-1">Submit</button>
        </div>
        <div id="aiResultsWrap" style="display:none;"></div>
      </div>

    </main>
    <footer id="app-footer" class="app-footer"></footer>
  </div>
</div>

<script>
window.CGP_PAGE = { activePage: 'more/ai-assistant', openSection: 'more', pageTitle: 'Genius Assistant' };
// No window.runAiSearch here: every question goes through the assistant's own data / action / help flow.
</script>
<script src="/shell.js"></script>
<script src="/session.js"></script>
</body>
</html>
