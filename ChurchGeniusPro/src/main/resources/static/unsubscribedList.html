<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
    <link rel="stylesheet" href="/shell.css" />
  <title>Unsubscribed List – Church Genius Pro</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f6fa;color:#333;}
    a{text-decoration:none;color:inherit;}button{cursor:pointer;font-family:inherit;border:none;background:none;}
    
    /* ── Sidebar ── */
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    /* ── Main ── */
    
    
    
    
    
    
    
    
    
    /* ── Header ── */
    .page-header{margin-bottom:20px;}
    .page-title{font-size:22px;font-weight:700;color:#1e2139;}
    .page-sub{font-size:13px;color:#888;margin-top:2px;}
    /* ── Feedback ── */
    .feedback{padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;}
    .feedback.success{display:block;background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;}
    .feedback.error{display:block;background:#ffebee;color:#c62828;border:1px solid #ef9a9a;}
    /* ── Card ── */
    .card{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden;margin-bottom:20px;}
    .card-header{padding:14px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px;background:#fafbfd;}
    .card-header h3{font-size:14px;font-weight:700;color:#1e2139;}
    .table-wrap{overflow-x:auto;}
    table.unsub-tbl{width:100%;border-collapse:collapse;font-size:13px;}
    table.unsub-tbl thead th{background:#f5f6fa;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888;padding:10px 14px;text-align:left;border-bottom:2px solid #e8eaf0;white-space:nowrap;}
    table.unsub-tbl tbody td{padding:11px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;}
    table.unsub-tbl tbody tr:last-child td{border-bottom:none;}
    .empty-row{text-align:center;color:#bbb;padding:32px!important;}
    .btn-resubscribe{padding:5px 12px;background:#fff;border:1px solid #e53935;color:#e53935;border-radius:6px;font-size:12px;font-weight:600;transition:background .15s,color .15s;}
    .btn-resubscribe:hover{background:#e53935;color:#fff;}
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#d0d0d0;border-radius:3px;}
    .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header id="topbar" class="topbar"></header>

    <main class="page-content">
      <div class="page-header">
        <div class="page-title">&#128683; Unsubscribed List</div>
        <div class="page-sub">Email addresses that have opted out of organization emails</div>
      </div>

      <div class="feedback" id="feedbackMsg"></div>

      <div class="card">
        <div class="card-header">
          <span>&#128203;</span>
          <h3>Unsubscribed Addresses</h3>
        </div>
        <div class="table-wrap">
          <table class="unsub-tbl">
            <thead>
              <tr>
                <th>#</th>
                <th>Email</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Unsubscribed On</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="unsubTableBody">
              <tr><td class="empty-row" colspan="6">Loading&#8230;</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <footer id="app-footer" class="app-footer"></footer>
  </div>
</div>

<script>
/* ════ NAVIGATION ════ */

/* ════ INIT ════ */
(async function init() {
  await loadList();
})();

/* ════ DATA ════ */
async function loadList() {
  try {
    const res = await fetch('/api/unsubscribe/list');
    if (!res.ok) { showFeedback('Could not load unsubscribed list.', 'error'); return; }
    const rows = await res.json();
    renderTable(rows);
  } catch { showFeedback('Network error loading list.', 'error'); }
}

function renderTable(rows) {
  window._unsubRows = rows;   // cache so CGP_applyPerms can re-render safely
  const tbody = document.getElementById('unsubTableBody');
  if (!rows || !rows.length) {
    tbody.innerHTML = '<tr><td class="empty-row" colspan="6">No unsubscribed addresses found.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function(r, i) {
    return '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td style="font-weight:600;">' + esc(r.email || '') + '</td>' +
      '<td>' + (r.firstName ? esc(r.firstName) : '\u2014') + '</td>' +
      '<td>' + (r.lastName  ? esc(r.lastName)  : '\u2014') + '</td>' +
      '<td>' + fmtDate(r.unsubscribedAt) + '</td>' +
      '<td>' + (window.CGP_PERMS && window.CGP_PERMS['admin.unsubscribed'] === false ? '' : '<button class="btn-resubscribe" onclick="resubscribe(' + r.id + ', this)">Re-subscribe</button>') + '</td>' +
      '</tr>';
  }).join('');
}

/* ════ RE-SUBSCRIBE ════ */
async function resubscribe(id, btn) {
  if (!confirm('Remove this address from the unsubscribed list? They will receive future emails again.')) return;
  btn.disabled = true; btn.textContent = 'Processing\u2026';
  try {
    const res  = await fetch('/api/unsubscribe/' + id, { method: 'DELETE' });
    const data = await res.json();
    if (res.ok) {
      showFeedback('Address successfully removed from unsubscribed list.', 'success');
      await loadList();
    } else {
      showFeedback((data.error || 'Could not re-subscribe.'), 'error');
      btn.disabled = false; btn.textContent = 'Re-subscribe';
    }
  } catch {
    showFeedback('Network error.', 'error');
    btn.disabled = false; btn.textContent = 'Re-subscribe';
  }
}

/* ════ HELPERS ════ */
function fmtDate(s) {
  if (!s) return '&#8212;';
  try {
    var d = new Date(s);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } catch (e) { return s; }
}
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function showFeedback(msg, type) {
  var el = document.getElementById('feedbackMsg');
  el.textContent = msg; el.className = 'feedback ' + type;
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (type === 'success') setTimeout(function() { el.className = 'feedback'; }, 7000);
}
</script>
<script>
window.CGP_PAGE = { activePage: 'admin/unsubscribed-list', pageTitle: '', openSection: 'admin' };
window.CGP_applyPerms = function() {
  // Re-render with the already-loaded data so permission-gated buttons (e.g.
  // Re-subscribe) reflect the resolved permissions — but only when data has
  // actually been fetched.  Calling renderTable() with no argument would clear
  // the table because rows would be undefined.
  if (typeof renderTable === 'function' && window._unsubRows !== undefined) {
    renderTable(window._unsubRows);
  }
};
</script>
<script src="/shell.js"></script>
<script src="/session.js"></script>
</body>
</html>
