<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Unsubscribe – Church Genius Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f6fa;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 48px 40px; max-width: 480px; width: 100%;
      text-align: center; margin: 20px;
    }
    .logo { font-size: 22px; font-weight: 700; color: #673147; margin-bottom: 28px; }
    h1 { font-size: 20px; color: #1a1a2e; margin-bottom: 12px; }
    p { font-size: 14px; color: #666; line-height: 1.7; margin-bottom: 20px; }
    .email-box {
      background: #f0f2ff; border-radius: 8px;
      padding: 12px 20px; font-size: 14px;
      color: #673147; font-weight: 600; margin-bottom: 28px;
      word-break: break-all;
    }
    .btn-unsub {
      background: #ef5350; color: #fff; border: none;
      padding: 13px 36px; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background .2s;
    }
    .btn-unsub:hover:not(:disabled) { background: #c62828; }
    .btn-unsub:disabled { background: #ccc; cursor: default; }
    .msg {
      margin-top: 20px; font-size: 14px;
      padding: 12px 16px; border-radius: 8px; display: none;
    }
    .msg.success { background: #e8f5e9; color: #2e7d32; }
    .msg.error   { background: #ffebee; color: #c62828; }
    .back { margin-top: 20px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">⛪ Church Genius Pro</div>
  <h1>Unsubscribe from Emails</h1>
  <p>You are about to opt out of future email communications from your church. The following address will be removed from the mailing list:</p>
  <div class="email-box" id="emailDisplay">Loading…</div>
  <button class="btn-unsub" id="btnUnsub" onclick="doUnsubscribe()">Confirm Unsubscribe</button>
  <div class="msg" id="msg"></div>
  <div class="back" id="backLink" style="display:none;">
    <a href="/" style="color:#673147;">← Return to home</a>
  </div>
</div>

<script>
  const params   = new URLSearchParams(window.location.search);
  const email    = (params.get('email')    || '').trim();
  const clientId = (params.get('clientId') || '').trim();

  document.getElementById('emailDisplay').textContent = email || '(email not provided)';

  if (!email || !clientId) {
    document.getElementById('emailDisplay').textContent = '(invalid link)';
    document.getElementById('btnUnsub').disabled = true;
    showMsg('This unsubscribe link is invalid or has expired. Please contact your church administrator.', 'error');
  }

  async function doUnsubscribe() {
    const btn = document.getElementById('btnUnsub');
    btn.disabled    = true;
    btn.textContent = 'Processing…';
    try {
      const res  = await fetch('/api/public/unsubscribe', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, clientId })
      });
      const data = await res.json();
      if (res.ok) {
        btn.style.display = 'none';
        showMsg(data.message || 'You have been unsubscribed.', 'success');
        document.getElementById('backLink').style.display = 'block';
      } else {
        showMsg(data.error || 'Something went wrong. Please try again.', 'error');
        btn.disabled    = false;
        btn.textContent = 'Confirm Unsubscribe';
      }
    } catch {
      showMsg('Network error. Please try again later.', 'error');
      btn.disabled    = false;
      btn.textContent = 'Confirm Unsubscribe';
    }
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent  = text;
    el.className    = 'msg ' + type;
    el.style.display = 'block';
  }
</script>
</body>
</html>
