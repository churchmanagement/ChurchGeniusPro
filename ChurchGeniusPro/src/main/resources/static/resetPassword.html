<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="stylesheet" href="/mobile.css" />
  <title>Reset Password — Church Genius Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #f5f6fa;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 40px 36px;
      width: 100%; max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      display: flex; flex-direction: column; align-items: center;
    }
    .logo-box { width: 200px; margin-bottom: 20px; }
    .logo-box img { width: 100%; height: auto; display: block; }
    h2 { font-size: 18px; font-weight: 700; color: #673147; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 24px; text-align: center; }
    .form { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 500; color: #555; }

    /* Password wrapper — positions the toggle button inside the input */
    .pwd-wrap {
      position: relative;
      display: flex; align-items: center;
    }
    .pwd-wrap input {
      width: 100%; padding: 12px 42px 12px 14px;
      border: 1.5px solid #e0e0e0; border-radius: 8px;
      font-size: 14px; color: #333; outline: none; transition: border-color .2s;
    }
    .pwd-wrap input:focus { border-color: #673147; }
    .toggle-eye {
      position: absolute; right: 12px;
      background: none; border: none; padding: 0;
      cursor: pointer; color: #aaa; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .toggle-eye:hover { color: #673147; }
    .toggle-eye svg { width: 18px; height: 18px; pointer-events: none; }

    .msg { font-size: 13px; text-align: center; padding: 8px 12px; border-radius: 6px; display: none; }
    .msg.error   { display: block; background: #ffebee; color: #c62828; }
    .msg.success { display: block; background: #e8f5e9; color: #2e7d32; }
    .btn-submit {
      width: 100%; padding: 13px; background: #3a5a9b; color: #fff;
      font-size: 15px; font-weight: 600; border: none; border-radius: 8px;
      cursor: pointer; transition: background .2s; font-family: inherit;
    }
    .btn-submit:hover:not(:disabled) { background: #3d1d2b; }
    .btn-submit:disabled { opacity: .7; cursor: not-allowed; }
    .back { margin-top: 16px; font-size: 13px; color: #3a7bd5; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    #tokenError { text-align: center; color: #c62828; font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-box"><img src="/logo.png" alt="Church Genius" onerror="this.style.display='none'" /></div>
    <h2>Reset Password</h2>
    <p class="sub">Enter your new password below.</p>

    <div id="tokenError" style="display:none;"></div>

    <form class="form" id="rpForm" novalidate>

      <div class="field">
        <label for="newPwd">New Password</label>
        <div class="pwd-wrap">
          <input id="newPwd" type="password" placeholder="Create a new password" autocomplete="new-password" />
          <button type="button" class="toggle-eye" aria-label="Show / hide password"
                  onclick="togglePwd('newPwd', this)">
            <!-- Eye icon (visible) -->
            <svg id="newPwd-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye-off icon (hidden, shown when password is visible) -->
            <svg id="newPwd-eye-on" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <ul class="pwd-reqs" id="pwdReqs" style="background:#f8f9fc;border:1px solid #e4e7f0;border-radius:8px;padding:9px 14px;font-size:12.5px;line-height:1.85;color:#777;margin-top:6px;">
          <div style="font-weight:700;color:#555;">Password must contain:</div>
          <li data-req="len" style="list-style:none;">At least 8 characters</li>
          <li data-req="lower" style="list-style:none;">A lowercase letter (a-z)</li>
          <li data-req="upper" style="list-style:none;">An uppercase letter (A-Z)</li>
          <li data-req="digit" style="list-style:none;">A number (0-9)</li>
          <li data-req="special" style="list-style:none;">A special character (e.g. !@#$%^&amp;*()_+-=)</li>
        </ul>
      </div>

      <div class="field">
        <label for="confirmPwd">Confirm Password</label>
        <div class="pwd-wrap">
          <input id="confirmPwd" type="password" placeholder="Re-enter new password" autocomplete="new-password" />
          <button type="button" class="toggle-eye" aria-label="Show / hide confirm password"
                  onclick="togglePwd('confirmPwd', this)">
            <svg id="confirmPwd-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="confirmPwd-eye-on" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="msg" id="rpMsg"></p>

      <button type="submit" class="btn-submit" id="rpBtn">Reset Password</button>
    </form>

    <a class="back" href="/login">← Back to Login</a>
  </div>

  <script>
    // ── Token validation on page load ─────────────────────────────────────────
    const token = new URLSearchParams(window.location.search).get('token') || '';

    (async function () {
      if (!token) { showTokenError('No reset token provided. Please request a new reset link.'); return; }
      try {
        const res  = await fetch('/api/reset-password/validate?token=' + encodeURIComponent(token));
        const data = await res.json();
        if (!data.valid) showTokenError(data.message || 'Invalid or expired reset link.');
      } catch (_) { /* allow form to show; server will re-validate on submit */ }
    })();

    function showTokenError(msg) {
      document.getElementById('tokenError').textContent = msg;
      document.getElementById('tokenError').style.display = '';
      document.getElementById('rpForm').style.display = 'none';
    }

    // ── Show / hide password toggle ───────────────────────────────────────────
    function togglePwd(inputId, btn) {
      var input  = document.getElementById(inputId);
      var eyeOff = document.getElementById(inputId + '-eye-off');
      var eyeOn  = document.getElementById(inputId + '-eye-on');

      if (input.type === 'password') {
        input.type     = 'text';
        eyeOff.style.display = 'none';
        eyeOn.style.display  = '';
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type     = 'password';
        eyeOff.style.display = '';
        eyeOn.style.display  = 'none';
        btn.setAttribute('aria-label', 'Show password');
      }
    }

    // ── Form submit ───────────────────────────────────────────────────────────
    const form = document.getElementById('rpForm');
    const msg  = document.getElementById('rpMsg');
    const btn  = document.getElementById('rpBtn');

    /* ── Password policy (mirrors server-side PasswordPolicy) ── */
    function pwdPolicyChecks(pw) {
      return { len: pw.length >= 8, lower: /[a-z]/.test(pw), upper: /[A-Z]/.test(pw),
               digit: /[0-9]/.test(pw), special: /[^A-Za-z0-9]/.test(pw) };
    }
    function pwdPolicyOk(pw) {
      const c = pwdPolicyChecks(pw);
      return c.len && c.lower && c.upper && c.digit && c.special;
    }
    document.getElementById('newPwd').addEventListener('input', function () {
      const checks = pwdPolicyChecks(this.value);
      document.querySelectorAll('#pwdReqs li').forEach(function (li) {
        const ok = !!checks[li.dataset.req];
        li.style.color = ok ? '#2e7d32' : '#777';
        li.textContent = (ok ? '✓ ' : '✕ ') + li.textContent.replace(/^[✓✕] /, '');
      });
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      msg.className = 'msg';

      const newPwd     = document.getElementById('newPwd').value;
      const confirmPwd = document.getElementById('confirmPwd').value;

      if (!newPwd || !pwdPolicyOk(newPwd)) {
        showMsg('error', 'Password does not meet all the requirements listed under the field.'); return;
      }
      if (newPwd !== confirmPwd) {
        showMsg('error', 'Passwords do not match.'); return;
      }

      btn.disabled = true; btn.textContent = 'Resetting…';
      try {
        const res  = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: newPwd })
        });
        const data = await res.json();
        if (!res.ok) {
          showMsg('error', data.error || 'Failed to reset password.');
        } else {
          showMsg('success', data.message + ' Redirecting to login…');
          form.reset();
          setTimeout(() => window.location.href = '/login', 2500);
        }
      } catch (_) {
        showMsg('error', 'Unable to connect. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Reset Password';
      }
    });

    function showMsg(type, text) {
      msg.className = 'msg ' + type;
      msg.textContent = text;
    }
  </script>
  <script src="/pwa.js" async></script>
</body>
</html>
