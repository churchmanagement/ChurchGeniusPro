<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="stylesheet" href="/mobile.css" />
  <title>Forgot Password — Church Genius Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #f5f6fa;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 40px 36px;
      width: 100%; max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      display: flex; flex-direction: column; align-items: center;
    }
    .logo-box { width: 200px; margin-bottom: 20px; }
    .logo-box img { width: 100%; height: auto; display: block; }
    h2 { font-size: 18px; font-weight: 700; color: #673147; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 24px; text-align: center; }
    .form { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 500; color: #555; }
    .field input {
      width: 100%; padding: 12px 14px; min-height: 44px;
      border: 1.5px solid #e0e0e0; border-radius: 8px;
      font-size: 16px; color: #333; outline: none; transition: border-color .2s;
    }
    .field input:focus { border-color: #673147; }
    .msg { font-size: 13px; text-align: center; min-height: 18px; padding: 8px 12px; border-radius: 6px; }
    .msg.error   { background: #ffebee; color: #c62828; }
    .msg.success { background: #e8f5e9; color: #2e7d32; }
    .btn-submit {
      width: 100%; padding: 13px; background: #673147; color: #fff;
      font-size: 15px; font-weight: 600; border: none; border-radius: 8px;
      cursor: pointer; transition: background .2s; font-family: inherit;
    }
    .btn-submit:hover:not(:disabled) { background: #4f2538; }
    .btn-submit:disabled { opacity: .7; cursor: not-allowed; }
    .back { margin-top: 16px; font-size: 13px; color: #673147; text-decoration: none; }
    .back:hover { text-decoration: underline; color: #4f2538; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-box"><img src="/logo.png" alt="Church Genius" onerror="this.style.display='none'" /></div>
    <h2>Forgot Password</h2>
    <p class="sub">Enter your username and the email address on your account.<br>
       We'll send a reset link valid for 10 minutes.</p>

    <form class="form" id="fpForm" novalidate>
      <div class="field">
        <label for="fpUsername">Username</label>
        <input id="fpUsername" type="text" placeholder="Enter your username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="fpEmail">Email</label>
        <input id="fpEmail" type="email" placeholder="Enter your email address" autocomplete="email" />
      </div>

      <p class="msg" id="fpMsg" style="display:none;"></p>

      <button type="submit" class="btn-submit" id="fpBtn">Send Reset Link</button>
    </form>

    <a class="back" href="/login">← Back to Login</a>
  </div>

  <script>
    const form = document.getElementById('fpForm');
    const msg  = document.getElementById('fpMsg');
    const btn  = document.getElementById('fpBtn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      msg.className = 'msg'; msg.style.display = 'none';

      const username = document.getElementById('fpUsername').value.trim();
      const email    = document.getElementById('fpEmail').value.trim();

      if (!username || !email) {
        showMsg('error', 'Please enter both your username and email address.');
        return;
      }

      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res  = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email })
        });
        const data = await res.json();
        if (!res.ok) {
          showMsg('error', data.error || 'Something went wrong. Please try again.');
        } else {
          showMsg('success', data.message);
          form.reset();
        }
      } catch (_) {
        showMsg('error', 'Unable to connect. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Send Reset Link';
      }
    });

    function showMsg(type, text) {
      msg.className = 'msg ' + type;
      msg.textContent = text;
      msg.style.display = '';
    }
  </script>
  <script src="/pwa.js" async></script>
</body>
</html>
