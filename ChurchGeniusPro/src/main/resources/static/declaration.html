<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
  <link rel="stylesheet" href="/shell.css" />
  <title>Church Genius Pro – Declaration</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: #f5f6fa; color: #333; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }

    /* ── Page header ── */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-title  { font-size: 22px; font-weight: 700; color: #673147; }
    .page-subtitle { font-size: 13px; color: #aaa; margin-top: 3px; }

    /* ── Feedback ── */
    .feedback { padding: 12px 20px; border-radius: 7px; font-size: 13px; font-weight: 500; margin-bottom: 18px; display: none; }
    .feedback.error   { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; display: block; }
    .feedback.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }

    /* ── Card ── */
    .card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      overflow: hidden; margin-bottom: 24px;
    }
    .card-header {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 22px; border-bottom: 1px solid #f0f2fb;
      background: #fafbfd;
    }
    .card-header h3 { font-size: 15px; font-weight: 700; color: #673147; }
    .card-body { padding: 24px 22px; }

    /* ── Form ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .form-grid.cols-1 { grid-template-columns: 1fr; }
    .span-2 { grid-column: span 2; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 13px; font-weight: 600; color: #673147; }
    .required-star { color: #e53935; margin-left: 2px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid #dde0ec; border-radius: 8px;
      font-size: 14px; font-family: inherit; color: #673147;
      background: #fff; outline: none; transition: border-color .15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #673147; }
    .field textarea { min-height: 120px; resize: vertical; }

    /* ── Declarations list table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 11px 16px;
      font-size: 11px; font-weight: 700; color: #888;
      text-transform: uppercase; letter-spacing: .5px;
      border-bottom: 2px solid #f0f0f0; white-space: nowrap;
      background: #fafbfd;
    }
    td { padding: 12px 16px; border-bottom: 1px solid #f5f5f5; color: #333; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbff; }
    .empty-row td { text-align: center; color: #bbb; padding: 44px 20px; }

    /* ── Status badge ── */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-active   { background: #e8f5e9; color: #2e7d32; }
    .badge-inactive { background: #f5f5f5; color: #888; }

    /* ── Action buttons ── */
    .actions { display: flex; gap: 6px; }
    .btn-icon {
      padding: 5px 7px; border-radius: 6px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .18s;
    }
    .btn-icon-edit   { border: 1.5px solid #673147; color: #673147; background: transparent; }
    .btn-icon-edit:hover   { background: #e8eaf6; }
    .btn-icon-delete { border: 1.5px solid #e53935; color: #e53935; background: transparent; }
    .btn-icon-delete:hover { background: #ffebee; }

    /* ── Action bar ── */
    .action-bar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; padding-top: 18px; border-top: 1px solid #f0f2fb; }
    .btn-clear { padding: 9px 20px; border-radius: 7px; font-size: 13px; font-weight: 600; color: #673147; border: 1.5px solid #673147; background: #fff; transition: background .18s; }
    .btn-clear:hover { background: #e8eaf6; }
    .btn-save  { padding: 9px 24px; border-radius: 7px; font-size: 13px; font-weight: 600; color: #fff; background: #673147; border: none; transition: background .18s; }
    .btn-save:hover { background: #4a5aae; }
    .btn-save:disabled { opacity: .65; cursor: not-allowed; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d0d4e8; border-radius: 4px; }

    @media (max-width: 700px) {
      .form-grid { grid-template-columns: 1fr; }
      .span-2 { grid-column: span 1; }
    }
  </style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header id="topbar" class="topbar"></header>

    <main class="page-content">

      <div class="page-header">
        <div>
          <div class="page-title">📜 Declaration</div>
          <div class="page-subtitle">Manage church declarations and statements of faith</div>
        </div>
      </div>

      <div class="feedback" id="feedbackMsg"></div>

      <!-- ── Add / Edit form ── -->
      <div class="card" id="formCard">
        <div class="card-header">
          <span style="font-size:18px;">📝</span>
          <h3 id="formTitle">Add Declaration</h3>
        </div>
        <div class="card-body">
          <div class="form-grid">
            <div class="field span-2">
              <label for="declTitle">Title <span class="required-star">*</span></label>
              <input type="text" id="declTitle" placeholder="e.g. Statement of Faith" maxlength="200" />
            </div>
            <div class="field">
              <label for="declCategory">Category</label>
              <select id="declCategory">
                <option value="">— Select Category —</option>
                <option value="Faith">Faith</option>
                <option value="Membership">Membership</option>
                <option value="Conduct">Conduct</option>
                <option value="Governance">Governance</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="declStatus">Status</label>
              <select id="declStatus">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <div class="field span-2">
              <label for="declContent">Content <span class="required-star">*</span></label>
              <textarea id="declContent" placeholder="Enter the full declaration text…"></textarea>
            </div>
            <div class="field span-2">
              <label for="declNote">Note</label>
              <input type="text" id="declNote" placeholder="Optional internal note…" maxlength="500" />
            </div>
          </div>
          <div class="action-bar">
            <button class="btn-clear" onclick="resetForm()">Clear</button>
            <button class="btn-save" id="saveBtn" onclick="saveDeclaration()">Save Declaration</button>
          </div>
        </div>
      </div>

      <!-- ── Declarations list ── -->
      <div class="card">
        <div class="card-header">
          <span style="font-size:18px;">📋</span>
          <h3>All Declarations</h3>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Category</th>
                <th>Status</th>
                <th>Note</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="declTableBody">
              <tr class="empty-row"><td colspan="6">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
    <footer id="app-footer" class="app-footer"></footer>
  </div>
</div>

<script>
  /* ── State ── */
  let declarations = [];
  let editingId    = null;

  /* ── Load ── */
  async function loadDeclarations() {
    try {
      const res = await fetch('/api/declarations');
      if (res.ok) declarations = await res.json();
    } catch (e) { console.error(e); }
    renderTable();
  }

  /* ── Render table ── */
  function renderTable() {
    const tbody = document.getElementById('declTableBody');
    if (!declarations.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="6">No declarations yet. Add one above.</td></tr>`;
      return;
    }
    tbody.innerHTML = declarations.map((d, i) => `
      <tr>
        <td style="color:#bbb;font-size:12px;">${i + 1}</td>
        <td style="font-weight:600;">${esc(d.title)}</td>
        <td>${esc(d.category || '')}</td>
        <td><span class="badge ${d.status === 'Active' ? 'badge-active' : 'badge-inactive'}">${esc(d.status || 'Active')}</span></td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(d.note || '')}">${esc(d.note || '')}</td>
        <td>
          <div class="actions">
            <button class="btn-icon btn-icon-edit" onclick="editDeclaration(${d.id})" title="Edit">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn-icon btn-icon-delete" onclick="deleteDeclaration(${d.id})" title="Delete">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </td>
      </tr>`).join('');
  }

  /* ── Save ── */
  async function saveDeclaration() {
    const title   = document.getElementById('declTitle').value.trim();
    const content = document.getElementById('declContent').value.trim();
    if (!title)   { showFeedback('Title is required.', 'error'); return; }
    if (!content) { showFeedback('Content is required.', 'error'); return; }

    const payload = {
      title,
      content,
      category: document.getElementById('declCategory').value,
      status:   document.getElementById('declStatus').value,
      note:     document.getElementById('declNote').value.trim()
    };

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';

    try {
      const url    = editingId ? `/api/declarations/${editingId}` : '/api/declarations';
      const method = editingId ? 'PUT' : 'POST';
      const res    = await fetch(url, {
        method, headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) { showFeedback(data.error || 'Failed to save declaration.', 'error'); return; }
      showFeedback(editingId ? 'Declaration updated.' : 'Declaration added.', 'success');
      resetForm();
      await loadDeclarations();
    } catch (e) {
      showFeedback('Network error. Please try again.', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Save Declaration';
    }
  }

  /* ── Edit ── */
  function editDeclaration(id) {
    const d = declarations.find(d => d.id === id);
    if (!d) return;
    editingId = id;
    document.getElementById('formTitle').textContent                = 'Edit Declaration';
    document.getElementById('saveBtn').textContent                  = 'Update Declaration';
    document.getElementById('declTitle').value                      = d.title    || '';
    document.getElementById('declContent').value                    = d.content  || '';
    document.getElementById('declCategory').value                   = d.category || '';
    document.getElementById('declStatus').value                     = d.status   || 'Active';
    document.getElementById('declNote').value                       = d.note     || '';
    document.getElementById('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ── Delete ── */
  async function deleteDeclaration(id) {
    const d = declarations.find(d => d.id === id);
    if (!confirm(`Delete "${d ? d.title : 'this declaration'}"? This cannot be undone.`)) return;
    try {
      const res = await fetch(`/api/declarations/${id}`, { method: 'DELETE' });
      if (res.ok) {
        declarations = declarations.filter(d => d.id !== id);
        renderTable();
        showFeedback('Declaration deleted.', 'success');
      } else {
        showFeedback('Failed to delete declaration.', 'error');
      }
    } catch (e) { showFeedback('Network error.', 'error'); }
  }

  /* ── Reset form ── */
  function resetForm() {
    editingId = null;
    document.getElementById('formTitle').textContent   = 'Add Declaration';
    document.getElementById('saveBtn').textContent     = 'Save Declaration';
    document.getElementById('declTitle').value         = '';
    document.getElementById('declContent').value       = '';
    document.getElementById('declCategory').value      = '';
    document.getElementById('declStatus').value        = 'Active';
    document.getElementById('declNote').value          = '';
  }

  /* ── Feedback ── */
  function showFeedback(msg, type) {
    const el = document.getElementById('feedbackMsg');
    el.textContent = msg; el.className = `feedback ${type}`;
    setTimeout(() => { if (el.textContent === msg) el.className = 'feedback'; }, 4000);
  }

  function esc(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadDeclarations();
</script>
<script>
window.CGP_PAGE = { activePage: 'admin/declaration', pageTitle: 'Declaration', openSection: 'admin' };
</script>
<script src="/shell.js"></script>
<script src="/session.js"></script>
</body>
</html>
