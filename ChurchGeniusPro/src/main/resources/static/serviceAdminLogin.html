<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
  <title>Church Genius Pro – Service Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-box { width: 200px; margin-bottom: 8px; }
    .logo-box img { width: 100%; height: auto; display: block; }

    .admin-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #fff;
      background: #3a5a9b;
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 28px;
    }

    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .field label {
      font-size: 13px;
      font-weight: 500;
      color: #555;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
      font-family: inherit;
    }

    .field input::placeholder { color: #bbb; }
    .field input:focus { border-color: #673147; }

    .error-msg {
      font-size: 13px;
      color: #e53935;
      text-align: center;
      min-height: 18px;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background-color: #3a5a9b;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      font-family: inherit;
    }

    .btn-login:hover:not(:disabled) { background-color: #3d1d2b; }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-box">
      <img src="/logo.png" alt="Church Genius Pro" onerror="this.style.display='none'" />
    </div>
    <span class="admin-badge">Service Admin</span>

    <form class="form" id="loginForm" novalidate>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" />
      </div>

      <p class="error-msg" id="errorMsg"></p>

      <button type="submit" class="btn-login" id="loginBtn">Login</button>

    </form>
  </div>

  <script>
    const form     = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorMsg.textContent = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorMsg.textContent = 'Please enter both username and password.';
        return;
      }

      loginBtn.disabled    = true;
      loginBtn.textContent = 'Logging in…';

      try {
        const res = await fetch('/api/serviceadmin/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password })
        });

        if (res.ok) {
          localStorage.setItem('serviceAdminLoggedIn', 'true');
          window.location.href = '/serviceadminhome';
        } else {
          const data = await res.json().catch(() => ({}));
          errorMsg.textContent = data.message || 'Invalid username or password.';
        }
      } catch (err) {
        errorMsg.textContent = 'Unable to connect. Please try again.';
      } finally {
        loginBtn.disabled    = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
