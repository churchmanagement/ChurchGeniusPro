<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
  <title>Church Genius Pro – Service Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px 0;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-box { width: 200px; margin-bottom: 8px; }
    .logo-box img { width: 100%; height: auto; display: block; }

    .admin-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #fff;
      background: #3a5a9b;
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 28px;
    }

    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .field label {
      font-size: 13px;
      font-weight: 500;
      color: #555;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
      font-family: inherit;
    }

    .field input::placeholder { color: #bbb; }
    .field input:focus { border-color: #673147; }

    .error-msg {
      font-size: 13px;
      color: #e53935;
      text-align: center;
      min-height: 18px;
    }
    .success-msg { color: #2e7d32; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background-color: #3a5a9b;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      font-family: inherit;
    }

    .btn-login:hover:not(:disabled) { background-color: #3d1d2b; }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    .link-row {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
    }
    .link-row a { color: #3a5a9b; font-weight: 600; text-decoration: none; cursor: pointer; }
    .link-row a:hover { text-decoration: underline; }

    /* Password requirements checklist */
    .pwd-reqs {
      background: #f8f9fc;
      border: 1px solid #e4e7f0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12.5px;
      line-height: 1.9;
      color: #777;
    }
    .pwd-reqs .req-title { font-weight: 700; color: #555; margin-bottom: 2px; }
    .pwd-reqs li { list-style: none; }
    .pwd-reqs li::before { content: '✕ '; color: #c62828; font-weight: 700; }
    .pwd-reqs li.ok { color: #2e7d32; }
    .pwd-reqs li.ok::before { content: '✓ '; color: #2e7d32; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-box">
      <img src="/logo.png" alt="Church Genius Pro" onerror="this.style.display='none'" />
    </div>
    <span class="admin-badge">Service Admin</span>

    <!-- ── Login form ─────────────────────────────────────────────────── -->
    <form class="form" id="loginForm" novalidate>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" />
      </div>

      <p class="error-msg" id="errorMsg"></p>

      <button type="submit" class="btn-login" id="loginBtn">Login</button>

      <div class="link-row"><a id="showChangePwd">Change Password</a></div>

    </form>

    <!-- ── Change Password form ───────────────────────────────────────── -->
    <form class="form" id="changeForm" style="display:none;" novalidate>

      <div class="field">
        <label for="cpUsername">Username</label>
        <input id="cpUsername" type="text" placeholder="Enter username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="cpCurrent">Current Password</label>
        <input id="cpCurrent" type="password" placeholder="Enter current password" autocomplete="current-password" />
      </div>

      <div class="field">
        <label for="cpNew">New Password</label>
        <input id="cpNew" type="password" placeholder="Enter new password" autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="cpConfirm">Confirm New Password</label>
        <input id="cpConfirm" type="password" placeholder="Re-enter new password" autocomplete="new-password" />
      </div>

      <ul class="pwd-reqs" id="cpReqs">
        <div class="req-title">New password must contain:</div>
        <li data-req="len">At least 8 characters</li>
        <li data-req="lower">A lowercase letter (a-z)</li>
        <li data-req="upper">An uppercase letter (A-Z)</li>
        <li data-req="digit">A number (0-9)</li>
        <li data-req="special">A special character (e.g. !@#$%^&amp;*()_+-=)</li>
      </ul>

      <p class="error-msg" id="cpMsg"></p>

      <button type="submit" class="btn-login" id="cpBtn">Change Password</button>

      <div class="link-row"><a id="backToLogin">← Back to Login</a></div>

    </form>
  </div>

  <script>
    const form     = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorMsg.textContent = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorMsg.textContent = 'Please enter both username and password.';
        return;
      }

      loginBtn.disabled    = true;
      loginBtn.textContent = 'Logging in…';

      try {
        const res = await fetch('/api/serviceadmin/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password })
        });

        if (res.ok) {
          localStorage.setItem('serviceAdminLoggedIn', 'true');
          window.location.href = '/serviceadminhome';
        } else {
          const data = await res.json().catch(() => ({}));
          errorMsg.textContent = data.message || 'Invalid username or password.';
        }
      } catch (err) {
        errorMsg.textContent = 'Unable to connect. Please try again.';
      } finally {
        loginBtn.disabled    = false;
        loginBtn.textContent = 'Login';
      }
    });

    /* ── Change Password ─────────────────────────────────────────────── */
    const changeForm = document.getElementById('changeForm');
    const cpBtn      = document.getElementById('cpBtn');
    const cpMsg      = document.getElementById('cpMsg');

    document.getElementById('showChangePwd').addEventListener('click', () => {
      form.style.display = 'none';
      changeForm.style.display = '';
      document.getElementById('cpUsername').value = document.getElementById('username').value.trim();
      cpMsg.textContent = '';
    });
    document.getElementById('backToLogin').addEventListener('click', () => {
      changeForm.style.display = 'none';
      form.style.display = '';
      errorMsg.textContent = '';
    });

    // Same policy as the server: 8+ chars, lower, upper, digit, special.
    function pwdChecks(pw) {
      return {
        len:     pw.length >= 8,
        lower:   /[a-z]/.test(pw),
        upper:   /[A-Z]/.test(pw),
        digit:   /[0-9]/.test(pw),
        special: /[^A-Za-z0-9]/.test(pw)
      };
    }
    function pwdOk(pw) {
      const c = pwdChecks(pw);
      return c.len && c.lower && c.upper && c.digit && c.special;
    }

    // Live checklist while typing
    document.getElementById('cpNew').addEventListener('input', function () {
      const checks = pwdChecks(this.value);
      document.querySelectorAll('#cpReqs li').forEach(li => {
        li.classList.toggle('ok', !!checks[li.dataset.req]);
      });
    });

    changeForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      cpMsg.className = 'error-msg';
      cpMsg.textContent = '';

      const username        = document.getElementById('cpUsername').value.trim();
      const currentPassword = document.getElementById('cpCurrent').value;
      const newPassword     = document.getElementById('cpNew').value;
      const confirm         = document.getElementById('cpConfirm').value;

      if (!username || !currentPassword || !newPassword || !confirm) {
        cpMsg.textContent = 'All fields are required.';
        return;
      }
      if (!pwdOk(newPassword)) {
        cpMsg.textContent = 'New password does not meet all the requirements listed above.';
        return;
      }
      if (newPassword !== confirm) {
        cpMsg.textContent = 'New password and confirmation do not match.';
        return;
      }

      cpBtn.disabled    = true;
      cpBtn.textContent = 'Changing…';

      try {
        const res  = await fetch('/api/serviceadmin/change-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, currentPassword, newPassword })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          cpMsg.className = 'error-msg success-msg';
          cpMsg.textContent = data.message || 'Password changed successfully.';
          changeForm.reset();
          document.querySelectorAll('#cpReqs li').forEach(li => li.classList.remove('ok'));
          setTimeout(() => {
            changeForm.style.display = 'none';
            form.style.display = '';
            errorMsg.textContent = '';
          }, 2500);
        } else {
          cpMsg.textContent = data.message || 'Could not change password.';
        }
      } catch (err) {
        cpMsg.textContent = 'Unable to connect. Please try again.';
      } finally {
        cpBtn.disabled    = false;
        cpBtn.textContent = 'Change Password';
      }
    });
  </script>
</body>
</html>
