<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
    <link rel="stylesheet" href="/shell.css" />
  <title>Church Genius Pro – Expense</title>
  <style>
    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: #f5f6fa; color: #333; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }

    /* ── App Shell ──────────────────────────────────────── */
    

    /* ── Sidebar ────────────────────────────────────────── */
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    

    /* ── Main area ──────────────────────────────────────── */
    

    /* ── Top-bar ────────────────────────────────────────── */
    
    
    
    
    .search-wrap {
      display: flex; align-items: center; gap: 8px;
      background: #f5f6fa; border: 1px solid #e8e8e8;
      border-radius: 20px; padding: 7px 16px;
    }
    .search-wrap input { border: none; background: none; outline: none; font-size: 13px; color: #333; width: 185px; }
    .search-wrap input::placeholder { color: #bbb; }
    .search-icon { color: #bbb; font-size: 14px; }
    .tb-link    { font-size: 13px; color: #555; }
    .tb-link:hover { color: #673147; }
    .tb-dropdown { font-size: 13px; color: #673147; font-weight: 600; display: flex; align-items: center; gap: 3px; }
    .btn-admin-settings { font-size: 13px; background: transparent; color: #673147; border: 1px solid #c5a0b5; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 600; transition: background .15s, color .15s, border-color .15s; }
    .btn-admin-settings:hover { background: #673147; color: #fff; border-color: #673147; }
    
    

    /* ── Page content ───────────────────────────────────── */
    

    /* ── Page header ─────────────────────────────────────── */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-title  { font-size: 22px; font-weight: 700; color: #673147; }
    .page-subtitle { font-size: 13px; color: #aaa; margin-top: 3px; }
    .date-badge {
      background: #e8eaf6; border: 1px solid #c5cae9; border-radius: 20px;
      padding: 7px 16px; font-size: 13px; font-weight: 600; color: #673147;
      white-space: nowrap;
    }

    /* ── Feedback ───────────────────────────────────────── */
    .feedback {
      padding: 12px 20px; border-radius: 7px;
      font-size: 13px; font-weight: 500; margin-bottom: 18px; display: none;
    }
    .feedback.error   { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; display: block; }
    .feedback.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }

    /* ── Form card ───────────────────────────────────────── */
    .form-card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      padding: 24px; margin-bottom: 24px;
    }
    .form-card-title {
      font-size: 13px; font-weight: 700; color: #673147;
      text-transform: uppercase; letter-spacing: .6px;
      margin-bottom: 18px; padding-bottom: 10px;
      border-bottom: 1px solid #e8eaf6;
    }

    /* ── Form grid ───────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 20px;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.span-2 { grid-column: span 2; }
    .form-group.full   { grid-column: 1 / -1; }
    .form-group label {
      font-size: 13px; font-weight: 600; color: #666;
      text-transform: uppercase; letter-spacing: .4px;
    }
    .required-star { color: #e53935; margin-left: 2px; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid #e0e0e0; border-radius: 7px;
      font-size: 14px; color: #333; outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff; font-family: inherit;
    }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: #bbb; }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: #673147; box-shadow: 0 0 0 3px rgba(103,49,71,.1); }
    .form-group input.invalid,
    .form-group select.invalid,
    .form-group textarea.invalid { border-color: #e53935; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .field-hint { font-size: 11px; color: #e53935; min-height: 14px; }

    /* ── Searchable combobox ──────────────────────────────── */
    .combo-wrap { position: relative; }
    .combo-input {
      width: 100%; padding: 10px 36px 10px 13px;
      border: 1.5px solid #e0e0e0; border-radius: 7px;
      font-size: 14px; color: #333; outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff; font-family: inherit;
    }
    .combo-input::placeholder { color: #bbb; }
    .combo-input:focus { border-color: #673147; box-shadow: 0 0 0 3px rgba(103,49,71,.1); }
    .combo-input.invalid { border-color: #e53935; }
    .combo-icon {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: #bbb; font-size: 14px; pointer-events: none;
    }
    .combo-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1.5px solid #e0e0e0; border-radius: 7px;
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
      max-height: 200px; overflow-y: auto; z-index: 200; display: none;
    }
    .combo-dropdown.open { display: block; }
    .combo-option {
      padding: 9px 13px; font-size: 14px; color: #333; cursor: pointer;
    }
    .combo-option:hover { background: #e8eaf6; color: #673147; }
    .combo-empty { padding: 9px 13px; font-size: 13px; color: #aaa; font-style: italic; }

    /* ── Form actions ─────────────────────────────────────── */
    .form-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
    .btn-save {
      padding: 10px 32px; border-radius: 7px;
      font-size: 14px; font-weight: 600; color: #673147;
      background: transparent; border: 1px solid #c5a0b5; cursor: pointer; transition: background .18s, color .18s, border-color .18s;
    }
    .btn-save:hover:not(:disabled) { background: #673147; color: #fff; border-color: #673147; }
    .btn-save:disabled { opacity: .65; cursor: not-allowed; }
    .btn-clear {
      padding: 10px 24px; border-radius: 7px;
      font-size: 14px; font-weight: 500; color: #666;
      border: 1.5px solid #e0e0e0; cursor: pointer; transition: background .18s;
    }
    .btn-clear:hover { background: #f5f6fa; }

    /* ── Table card ──────────────────────────────────────── */
    .table-card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07); overflow: hidden;
    }
    .table-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid #f0f0f0;
    }
    .table-toolbar-title {
      font-size: 13px; font-weight: 700; color: #673147;
      text-transform: uppercase; letter-spacing: .6px;
    }
    .rows-select-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; }
    .rows-select-wrap select {
      padding: 4px 8px; border: 1.5px solid #e0e0e0; border-radius: 6px;
      font-size: 13px; outline: none; background: #fff;
    }
    .table-wrap { overflow-x: auto; }
    .expense-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .expense-table th {
      text-align: left; padding: 11px 14px;
      font-size: 11px; font-weight: 700; color: #888;
      text-transform: uppercase; letter-spacing: .5px;
      border-bottom: 2px solid #f0f0f0; white-space: nowrap;
    }
    .expense-table td {
      padding: 12px 14px; border-bottom: 1px solid #f5f5f5;
      color: #333; vertical-align: middle;
    }
    .expense-table tr:last-child td { border-bottom: none; }
    .expense-table tr:hover td { background: #fafbff; }
    .row-num { font-size: 13px; color: #ccc; }
    .cell-purpose { font-weight: 600; color: #673147; }
    .cell-amount  { font-weight: 600; color: #2e7d32; font-size: 14px; }

    /* ── Row actions ─────────────────────────────────────── */
    .actions { display: flex; gap: 6px; }
    .btn-action {
      padding: 4px 10px; border-radius: 6px; font-size: 16px; line-height: 1;
      font-weight: 500; cursor: pointer;
      transition: background .18s, color .18s;
      border: 1.5px solid transparent; white-space: nowrap;
    }
    .btn-edit    { background: transparent; color: #673147; border-color: #c5a0b5; }
    .btn-edit:hover    { background: #673147; color: #fff; border-color: #673147; }
    .btn-delete  { background: transparent; color: #673147; border-color: #c5a0b5; }
    .btn-delete:hover  { background: #673147; color: #fff; border-color: #673147; }

    /* ── Empty state ─────────────────────────────────────── */
    .empty-state { text-align: center; padding: 52px 20px; color: #bbb; }
    .empty-icon  { font-size: 44px; margin-bottom: 14px; }
    .empty-text  { font-size: 14px; }

    /* ── Scrollbar ───────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); }
    .combo-dropdown::-webkit-scrollbar { width: 4px; }
    .combo-dropdown::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

    /* ── Toggle Checkbox (matches event-register style) ─ */
    .toggle-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .toggle-checkbox {
      width: 40px; height: 22px; background: #c5cae9; border-radius: 11px;
      position: relative; transition: background .2s; flex-shrink: 0;
      cursor: pointer; -webkit-appearance: none; appearance: none;
    }
    .toggle-checkbox:checked { background: #673147; }
    .toggle-checkbox::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; background: #fff; border-radius: 50%;
      transition: left .2s; box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    .toggle-checkbox:checked::after { left: 21px; }
    .toggle-label { font-size: 13px; color: #555; user-select: none; }
  </style>
</head>
<body>
<div class="app">

  <!-- ════════════ SIDEBAR ════════════ -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- ════════════ MAIN ════════════ -->
  <div class="main-area">

    <header id="topbar" class="topbar"></header>

    <main class="page-content">

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <div class="page-title">Expense</div>
          <div class="page-subtitle">Record and manage expense transactions</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <button type="button" id="scanCheckBtn" class="btn-scan-check" onclick="CHECKSCAN.open()" title="Scan or upload a check to auto-fill this form">
            📷 Scan Check
          </button>
          <div class="date-badge" id="currentDateBadge"></div>
        </div>
      </div>

      <!-- Feedback -->
      <div class="feedback" id="feedbackMsg"></div>

      <!-- ── Expense Entry Form ─────────────────────────── -->
      <div class="form-card" id="expenseFormCard">
        <div class="form-card-title" id="formCardTitle">New Expense</div>
        <input type="hidden" id="editingId" value="" />

        <div class="form-grid">

          <!-- Expense (Purpose) — searchable combobox -->
          <div class="form-group">
            <label>Expense <span class="required-star">*</span></label>
            <div class="combo-wrap">
              <input type="text" class="combo-input" id="fExpenseInput"
                     placeholder="Search expense category…"
                     oninput="filterExpenses()"
                     onfocus="openExpenseDropdown()"
                     onblur="closeExpenseDropdownDelay()" />
              <span class="combo-icon">🔍</span>
              <div class="combo-dropdown" id="expenseDropdown"></div>
            </div>
            <input type="hidden" id="fExpense" />
            <span class="field-hint" id="fExpenseHint"></span>
          </div>

          <!-- Fund (Main Source) -->
          <div class="form-group">
            <label>Fund (eg:Tithe) <span class="required-star">*</span></label>
            <select id="fFund">
              <option value="">— Select Fund —</option>
            </select>
            <span class="field-hint" id="fFundHint"></span>
          </div>

          <!-- Date -->
          <div class="form-group">
            <label>Date <span class="required-star">*</span></label>
            <input type="date" id="fDate" />
            <span class="field-hint" id="fDateHint"></span>
          </div>

          <!-- Method -->
          <div class="form-group">
            <label>Method (eg:Cash) <span class="required-star">*</span></label>
            <select id="fMethod">
              <option value="">— Select Method —</option>
            </select>
            <span class="field-hint" id="fMethodHint"></span>
          </div>

          <!-- Ref No -->
          <div class="form-group">
            <label>Ref No</label>
            <input type="text" id="fRefNo" placeholder="Reference / cheque number" />
          </div>

          <!-- Amount -->
          <div class="form-group">
            <label>Amount <span class="required-star">*</span></label>
            <input type="number" id="fAmount" placeholder="0.00" min="0.01" step="0.01" />
            <span class="field-hint" id="fAmountHint"></span>
          </div>

          <!-- Notes -->
          <div class="form-group full">
            <label>Notes</label>
            <input type="text" id="fNote" placeholder="Short note…" />
          </div>

        </div><!-- /.form-grid -->

        <!-- Recurring toggle -->
        <div style="display:flex;align-items:center;gap:10px;margin-top:16px;
                    padding:12px 14px;background:#f0f2ff;border:1px solid #c5cae9;
                    border-radius:8px;">
          <label class="toggle-row" title="Mark as recurring">
            <input type="checkbox" class="toggle-checkbox" id="fQuickAdd" />
            <span style="font-size:13px;color:#673147;font-weight:500;user-select:none;">
              🔁 Recurring
              <span style="font-size:13px;color:#777;font-weight:400;margin-left:4px;">
                — show this as a template in the Accountant dashboard Recurring Expense panel
              </span>
            </span>
          </label>
        </div>

        <div class="form-actions">
          <button class="btn-save" id="saveBtn" onclick="submitForm()">Save</button>
          <button class="btn-clear" onclick="clearForm()">✕ Clear</button>
        </div>
      </div>

      <!-- ── Transactions Table ─────────────────────────── -->
      <div class="table-card">
        <div class="table-toolbar">
          <div class="table-toolbar-title">Recent Expenses</div>
        </div>
        <div class="table-wrap">
          <table class="expense-table">
            <thead>
              <tr>
                <th style="width:44px;">#</th>
                <th>Expense</th>
                <th>Fund</th>
                <th>Date</th>
                <th>Method</th>
                <th>Ref No</th>
                <th>Amount</th>
                <th>Note</th>
                <th style="width:120px;">Actions</th>
              </tr>
            </thead>
            <tbody id="expenseTableBody"></tbody>
          </table>
        </div>
        <div id="loadMoreExpenseWrap" style="display:none;text-align:center;padding:14px 0 10px;">
          <button id="loadMoreExpenseBtn" onclick="loadMoreExpenses()"
            style="padding:7px 28px;border-radius:8px;border:1px solid #c5cae9;background:#fff;
                   color:#673147;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.3px;">
            Load More ↓
          </button>
        </div>
      </div>

    </main>
    <footer id="app-footer" class="app-footer"></footer>
  </div>
</div>

<script>
  /* ════════════════════════════════════
     MENU
  ════════════════════════════════════ */
  

  /* ════════════════════════════════════
     STATE
  ════════════════════════════════════ */
  let allExpenses       = [];
  let allPurposes       = [];   // { id, purposeName }
  let allFunds          = [];   // { id, sourceName }
  const expenseMap      = {};   // id → expense object for safe onclick lookups
  let visibleExpenseCount = 10; // rows shown; Load More increments by 10

  /* ════════════════════════════════════
     DATE HELPERS
  ════════════════════════════════════ */
  function todayString() {
    const d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  function setCurrentDate() {
    const d = new Date();
    document.getElementById('currentDateBadge').textContent =
      d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('fDate').value = todayString();
  }

  /* ════════════════════════════════════
     LOAD DROPDOWNS
  ════════════════════════════════════ */
  async function loadPurposes() {
    try {
      const res = await fetch('/api/expense/purposes');
      if (!res.ok) throw new Error();
      allPurposes = await res.json();
    } catch { allPurposes = []; }
    populateExpenseDropdown('');
  }

  async function loadFunds() {
    try {
      const res = await fetch('/api/expense/funds');
      if (!res.ok) throw new Error();
      allFunds = await res.json();
    } catch { allFunds = []; }

    const sel = document.getElementById('fFund');
    sel.innerHTML = '<option value="">— Select Fund —</option>';
    allFunds.forEach(f => {
      const opt = document.createElement('option');
      opt.value       = f.id;
      opt.textContent = f.sourceName;
      sel.appendChild(opt);
    });
  }

  async function loadTransactionTypes() {
    try {
      const res  = await fetch('/api/transaction-types');
      if (!res.ok) throw new Error();
      const data = await res.json();
      const sel  = document.getElementById('fMethod');
      data.forEach(tt => {
        const opt = document.createElement('option');
        opt.value       = tt.id;
        opt.textContent = tt.typeName;
        sel.appendChild(opt);
      });
    } catch { /* silent — field stays empty */ }
  }

  /* ════════════════════════════════════
     EXPENSE COMBOBOX
  ════════════════════════════════════ */
  function populateExpenseDropdown(filter) {
    const dd     = document.getElementById('expenseDropdown');
    const term   = filter.toLowerCase().trim();
    const items  = term
      ? allPurposes.filter(p => p.purposeName.toLowerCase().includes(term))
      : allPurposes;

    if (items.length === 0) {
      dd.innerHTML = `<div class="combo-empty">No matches found</div>`;
    } else {
      dd.innerHTML = items.map(p =>
        `<div class="combo-option"
              onmousedown="selectExpense(${p.id}, this.textContent.trim())">${escHtml(p.purposeName)}</div>`
      ).join('');
    }
  }

  function filterExpenses() {
    populateExpenseDropdown(document.getElementById('fExpenseInput').value);
    document.getElementById('expenseDropdown').classList.add('open');
    // Clear selection if user edits the text
    document.getElementById('fExpense').value = '';
  }

  function openExpenseDropdown() {
    populateExpenseDropdown(document.getElementById('fExpenseInput').value);
    document.getElementById('expenseDropdown').classList.add('open');
  }

  function closeExpenseDropdownDelay() {
    setTimeout(() => {
      document.getElementById('expenseDropdown').classList.remove('open');
    }, 200);
  }

  function selectExpense(id, name) {
    document.getElementById('fExpense').value      = id;
    document.getElementById('fExpenseInput').value = name;
    document.getElementById('fExpenseHint').textContent = '';
    document.getElementById('fExpenseInput').classList.remove('invalid');
    document.getElementById('expenseDropdown').classList.remove('open');
    autoFillFromLastExpense(id);
  }

  /* ════════════════════════════════════
     AUTO-FILL FROM LAST EXPENSE
  ════════════════════════════════════ */
  async function autoFillFromLastExpense(purposeId) {
    try {
      const res = await fetch(`/api/expense/purpose/${purposeId}/last`);
      if (!res.ok) return;
      const data = await res.json();
      if (!data || Object.keys(data).length === 0) return;

      // Only auto-fill if not currently editing an existing record
      if (document.getElementById('editingId').value) return;

      if (data.mainSourceId) document.getElementById('fFund').value   = data.mainSourceId;
      if (data.transactionTypeId) document.getElementById('fMethod').value = data.transactionTypeId;
      if (data.refNo)        document.getElementById('fRefNo').value  = data.refNo;
      if (data.amount)       document.getElementById('fAmount').value = data.amount;
      if (data.note)         document.getElementById('fNote').value   = data.note;
      // Date stays as today
    } catch { /* silent */ }
  }

  /* ════════════════════════════════════
     LOAD EXPENSES (TABLE)
  ════════════════════════════════════ */
  async function loadExpenses() {
    try {
      const res = await fetch('/api/expense');
      if (!res.ok) throw new Error();
      allExpenses = await res.json();
    } catch {
      allExpenses = [];
      showFeedback('❌ Failed to load expenses from the server.', 'error');
    }
    Object.keys(expenseMap).forEach(k => delete expenseMap[k]);
    allExpenses.forEach(e => { expenseMap[e.id] = e; });
    visibleExpenseCount = 10;   // reset Load More on every fresh load
    renderTable();
  }

  /* ════════════════════════════════════
     RENDER TABLE
  ════════════════════════════════════ */
  function loadMoreExpenses() {
    visibleExpenseCount += 10;
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('expenseTableBody');
    const rows  = allExpenses.slice(0, visibleExpenseCount);
    /* show/hide Load More button */
    const wrap = document.getElementById('loadMoreExpenseWrap');
    if (wrap) wrap.style.display = allExpenses.length > visibleExpenseCount ? 'block' : 'none';

    if (rows.length === 0) {
      tbody.innerHTML = `
        <tr><td colspan="9">
          <div class="empty-state">
            <div class="empty-icon">💸</div>
            <div class="empty-text">No expense records yet. Add one above to get started.</div>
          </div>
        </td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map((e, idx) => `
      <tr>
        <td class="row-num">${idx + 1}${e.quickAdd ? ' <span title="Recurring" style="font-size:11px;">🔁</span>' : ''}</td>
        <td><span class="cell-purpose">${escHtml(e.purposeName)}</span></td>
        <td>${escHtml(e.mainSourceName)}</td>
        <td>${formatDate(e.expenseDate)}</td>
        <td>${escHtml(e.method)}</td>
        <td>${escHtml(e.refNo || '—')}</td>
        <td><span class="cell-amount">$${parseFloat(e.amount).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}</span></td>
        <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"
            title="${escHtml(e.note || '')}">${escHtml(e.note || '—')}</td>
        <td>
          <div class="actions">
            ${window.CGP_PERMS && window.CGP_PERMS['accounting.expense.edit'] === false ? '' :
              `<button class="btn-action btn-edit" onclick="editExpense(${e.id})" title="Edit">📝</button>`}
            ${window.CGP_PERMS && window.CGP_PERMS['accounting.expense.delete'] === false ? '' :
              `<button class="btn-action btn-delete" onclick="deleteExpense(${e.id})" title="Delete">🗑</button>`}
          </div>
        </td>
      </tr>`).join('');
  }

  /* ════════════════════════════════════
     SUBMIT FORM (CREATE / UPDATE)
  ════════════════════════════════════ */
  async function submitForm() {
    if (!validateForm()) return;

    const editingId   = document.getElementById('editingId').value;
    const isEdit      = !!editingId;
    if (!isEdit && !confirm('Do you want to add this expense?')) return;
    const url         = isEdit ? `/api/expense/${editingId}` : '/api/expense';
    const method      = isEdit ? 'PUT' : 'POST';

    const payload = {
      purposeId:    parseInt(document.getElementById('fExpense').value),
      mainSourceId: parseInt(document.getElementById('fFund').value),
      expenseDate:  document.getElementById('fDate').value,
      transactionTypeId: document.getElementById('fMethod').value ? parseInt(document.getElementById('fMethod').value, 10) : null,
      refNo:        document.getElementById('fRefNo').value.trim() || null,
      amount:       parseFloat(document.getElementById('fAmount').value),
      note:         document.getElementById('fNote').value.trim() || null,
      quickAdd:     document.getElementById('fQuickAdd').checked
    };

    const btn = document.getElementById('saveBtn');
    btn.disabled    = true;
    btn.textContent = isEdit ? '⏳ Updating…' : '⏳ Saving…';

    try {
      const res  = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok) {
        showFeedback(`✅ ${data.message}`, 'success');
        if (window.CHECKSCAN && data && data.id) {
          try { await CHECKSCAN.afterSave(data.id); } catch (e) { /* image is best-effort */ }
        }
        clearForm();
        await loadExpenses();
      } else {
        showFeedback(`❌ ${data.error || 'Failed to save expense.'}`, 'error');
      }
    } catch {
      showFeedback('❌ Network error — could not reach the server.', 'error');
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Save';
    }
  }

  /* ════════════════════════════════════
     VALIDATE
  ════════════════════════════════════ */
  function validateForm() {
    let ok = true;

    const expenseId = document.getElementById('fExpense').value;
    const expenseInput = document.getElementById('fExpenseInput');
    if (!expenseId) {
      document.getElementById('fExpenseHint').textContent = 'Expense category is required.';
      expenseInput.classList.add('invalid');
      ok = false;
    } else {
      document.getElementById('fExpenseHint').textContent = '';
      expenseInput.classList.remove('invalid');
    }

    const fund = document.getElementById('fFund');
    if (!fund.value) {
      document.getElementById('fFundHint').textContent = 'Fund is required.';
      fund.classList.add('invalid');
      ok = false;
    } else {
      document.getElementById('fFundHint').textContent = '';
      fund.classList.remove('invalid');
    }

    const date = document.getElementById('fDate');
    if (!date.value) {
      document.getElementById('fDateHint').textContent = 'Date is required.';
      date.classList.add('invalid');
      ok = false;
    } else {
      document.getElementById('fDateHint').textContent = '';
      date.classList.remove('invalid');
    }

    const methodSel = document.getElementById('fMethod');
    if (!methodSel.value) {
      document.getElementById('fMethodHint').textContent = 'Method is required.';
      methodSel.classList.add('invalid');
      ok = false;
    } else {
      document.getElementById('fMethodHint').textContent = '';
      methodSel.classList.remove('invalid');
    }

    const amount = document.getElementById('fAmount');
    if (!amount.value || parseFloat(amount.value) <= 0) {
      document.getElementById('fAmountHint').textContent = 'A positive amount is required.';
      amount.classList.add('invalid');
      ok = false;
    } else {
      document.getElementById('fAmountHint').textContent = '';
      amount.classList.remove('invalid');
    }

    return ok;
  }

  /* ════════════════════════════════════
     EDIT
  ════════════════════════════════════ */
  function editExpense(id) {
    const e = expenseMap[id];
    if (!e) return;

    document.getElementById('editingId').value        = id;
    document.getElementById('formCardTitle').textContent = 'Edit Expense';
    document.getElementById('saveBtn').textContent    = '💾 Update Expense';

    // Expense combobox
    document.getElementById('fExpense').value      = e.purposeId;
    document.getElementById('fExpenseInput').value = e.purposeName;
    document.getElementById('fExpenseHint').textContent = '';
    document.getElementById('fExpenseInput').classList.remove('invalid');

    document.getElementById('fFund').value   = e.mainSourceId;
    document.getElementById('fDate').value   = e.expenseDate;
    document.getElementById('fMethod').value    = e.transactionTypeId || '';
    document.getElementById('fRefNo').value     = e.refNo || '';
    document.getElementById('fAmount').value    = e.amount;
    document.getElementById('fNote').value      = e.note || '';
    document.getElementById('fQuickAdd').checked = !!e.quickAdd;

    // Clear hints
    ['fFund','fDate','fMethod','fAmount'].forEach(id => {
      document.getElementById(id).classList.remove('invalid');
    });
    ['fFundHint','fDateHint','fMethodHint','fAmountHint'].forEach(id => {
      document.getElementById(id).textContent = '';
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ════════════════════════════════════
     DELETE
  ════════════════════════════════════ */
  async function deleteExpense(id) {
    const e    = expenseMap[id];
    const name = e ? e.purposeName : String(id);
    if (!confirm('Are you sure you want to delete this record?')) return;

    try {
      const res  = await fetch(`/api/expense/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok) {
        showFeedback(`"${escHtml(name)}" expense has been deleted.`, 'success');
        if (document.getElementById('editingId').value === String(id)) clearForm();
        await loadExpenses();
      } else {
        showFeedback(`❌ ${data.error || 'Failed to delete expense.'}`, 'error');
      }
    } catch {
      showFeedback('❌ Network error — could not delete expense.', 'error');
    }
  }

  /* ════════════════════════════════════
     CLEAR FORM
  ════════════════════════════════════ */
  function clearForm() {
    document.getElementById('editingId').value        = '';
    document.getElementById('formCardTitle').textContent = 'New Expense';
    document.getElementById('saveBtn').textContent    = 'Save';

    document.getElementById('fExpense').value      = '';
    document.getElementById('fExpenseInput').value = '';
    document.getElementById('fFund').value         = '';
    document.getElementById('fDate').value         = todayString();
    document.getElementById('fMethod').value        = '';
    document.getElementById('fRefNo').value         = '';
    document.getElementById('fAmount').value        = '';
    document.getElementById('fNote').value          = '';
    document.getElementById('fQuickAdd').checked    = false;

    // Clear validation states
    ['fExpenseInput','fFund','fDate','fMethod','fAmount'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.remove('invalid');
    });
    ['fExpenseHint','fFundHint','fDateHint','fMethodHint','fAmountHint'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = '';
    });
  }

  /* ════════════════════════════════════
     FEEDBACK
  ════════════════════════════════════ */
  function showFeedback(msg, type) {
    const el = document.getElementById('feedbackMsg');
    el.textContent = msg;
    el.className   = `feedback ${type}`;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    setTimeout(() => { if (el.textContent === msg) el.className = 'feedback'; }, 5000);
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    const [y, m, d] = dateStr.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(m,10)-1]} ${parseInt(d,10)}, ${y}`;
  }

  function escHtml(str) {
    return (str == null ? '' : String(str))
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ════════════════════════════════════
     INIT
  ════════════════════════════════════ */
  (async function init() {
    setCurrentDate();
    await Promise.all([loadPurposes(), loadFunds(), loadTransactionTypes(), loadExpenses()]);

    // Support ?edit=ID (dashboard) and ?editId=ID (reports) links
    const params    = new URLSearchParams(window.location.search);
    const editParam = params.get('editId') || params.get('edit');
    if (editParam) {
      const id = parseInt(editParam, 10);
      if (!isNaN(id) && expenseMap[id]) editExpense(id);
    }
  })();
</script>

<input type="file" id="csCamera" accept="image/*" capture="environment" style="display:none" onchange="CHECKSCAN.onFile(this)">
<input type="file" id="csUpload" accept="image/jpeg,image/png,image/heic,image/heif,application/pdf,.jpg,.jpeg,.png,.heic,.heif,.pdf" style="display:none" onchange="CHECKSCAN.onFile(this)">

<script>
/* ════════════════════════════════════════════════════════════════════
   CHECKSCAN (Expense) — capture/upload a check, OCR/extract, review &
   edit, populate the Expense form, store the image on save. PDFs parse
   server-side; photos use the vision model (when configured) else
   in-browser Tesseract.js with graceful fallback to manual entry.
   ════════════════════════════════════════════════════════════════════ */
window.CHECKSCAN = (function () {
  'use strict';
  var overlay, body;
  var state = { file:null, data:null, stream:null, _capCanvas:null };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function open(){
    overlay = $('csOverlay'); body = $('csBody');
    state = { file:null, data:null, stream:null, _capCanvas:null };
    renderChooser();
    overlay.classList.add('open');
  }
  function close(){ stopWebcam(); state._capCanvas = null; if (overlay) overlay.classList.remove('open'); }

  function renderChooser(msg){
    body.innerHTML =
      (msg ? '<div class="cs-err">'+esc(msg)+'</div>' : '') +
      '<div class="cs-drop">'+
        '<div style="font-size:30px;">🧾</div>'+
        '<div style="font-weight:600;color:#5a4a52;margin-top:6px;">Take a photo of a check or upload an image / PDF</div>'+
        '<div class="cs-opts">'+
          '<button class="cs-opt" onclick="CHECKSCAN.pick(\'camera\')">📸 Take Photo</button>'+
          '<button class="cs-opt" onclick="CHECKSCAN.pick(\'upload\')">📂 Upload Image / PDF</button>'+
        '</div>'+
        '<div class="cs-note">Supported: JPG, JPEG, PNG, HEIC, PDF (single check).</div>'+
      '</div>';
  }

  function isMobile(){
    if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') return navigator.userAgentData.mobile;
    return /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent || '');
  }
  function pick(which){
    if (which === 'upload'){ $('csUpload').click(); return; }
    if (isMobile()){ $('csCamera').click(); return; }
    openWebcam();
  }

  // ── Desktop webcam capture ──
  function openWebcam(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      renderChooser('Your browser doesn’t support webcam capture. Please upload an image instead.'); return;
    }
    body.innerHTML =
      '<div style="text-align:center;">'+
        '<video id="csVideo" autoplay playsinline muted style="width:100%;max-width:520px;border-radius:10px;background:#000;"></video>'+
        '<div class="cs-note">Position the whole check in view, then capture.</div>'+
        '<div class="cs-actions" style="justify-content:center;">'+
          '<button class="cs-btn ghost" onclick="CHECKSCAN.closeWebcam()">Cancel</button>'+
          '<button class="cs-btn solid" onclick="CHECKSCAN.capture()">📸 Capture</button>'+
        '</div>'+
      '</div>';
    navigator.mediaDevices.getUserMedia({ video:{ width:{ ideal:1600 }, height:{ ideal:1200 } }, audio:false })
      .then(function(stream){ state.stream = stream; var v = $('csVideo'); if (v){ v.srcObject = stream; var p = v.play && v.play(); if (p && p.catch) p.catch(function(){}); } })
      .catch(function(err){
        stopWebcam();
        var name = err && err.name;
        if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError'){ renderChooser('Camera access is required to take a photo. Please allow camera permissions and try again.'); }
        else if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || name === 'OverconstrainedError'){ renderChooser('No camera detected. Please upload an image instead.'); }
        else { renderChooser('Could not open the webcam (' + (name || 'error') + '). Please upload an image instead.'); }
      });
  }
  function capture(){
    var v = $('csVideo'); if (!v || !v.videoWidth){ return; }
    var canvas = document.createElement('canvas'); canvas.width = v.videoWidth; canvas.height = v.videoHeight;
    canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height); stopWebcam(); state._capCanvas = canvas;
    body.innerHTML =
      '<div style="text-align:center;">'+
        '<img src="'+canvas.toDataURL('image/jpeg', 0.92)+'" style="width:100%;max-width:520px;border-radius:10px;" alt="Captured check">'+
        '<div class="cs-note">Make sure the whole check is sharp and readable.</div>'+
        '<div class="cs-actions" style="justify-content:center;">'+
          '<button class="cs-btn ghost" onclick="CHECKSCAN.pick(\'camera\')">↺ Retake</button>'+
          '<button class="cs-btn solid" onclick="CHECKSCAN.useCaptured()">Use This Photo</button>'+
        '</div>'+
      '</div>';
  }
  function useCaptured(){
    var canvas = state._capCanvas; if (!canvas){ openWebcam(); return; }
    canvas.toBlob(function(blob){
      if (!blob){ renderChooser('Could not capture the photo. Please try again.'); return; }
      var file; try { file = new File([blob], 'webcam-check.jpg', { type:'image/jpeg' }); } catch(e){ file = blob; file.name = 'webcam-check.jpg'; }
      state.file = file; state._capCanvas = null; scan(file);
    }, 'image/jpeg', 0.92);
  }
  function stopWebcam(){ if (state.stream){ try { state.stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){} state.stream = null; } }
  function closeWebcam(){ stopWebcam(); state._capCanvas = null; renderChooser(); }

  function onFile(input){ var f = input.files && input.files[0]; input.value = ''; if (!f) return; state.file = f; scan(f); }

  function spinner(text, pct){ body.innerHTML = '<div class="cs-spin">'+esc(text)+(pct!=null ? '<div class="cs-bar"><i style="width:'+pct+'%"></i></div>' : '')+'</div>'; }

  function scan(file){
    spinner('Reading the check…');
    var fd = new FormData(); fd.append('file', file);
    fetch('/api/expense/check-scan', { method:'POST', body:fd })
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if (!res.ok){ renderChooser(res.j.error || 'Could not read the file.'); return; }
        var d = res.j;
        if (d.readable === false && d.method === 'image-needs-ocr'){ return browserOcr(file); }
        state.data = d; renderReview(d);
      })
      .catch(function(){ renderChooser('Upload failed. Please try again.'); });
  }

  function browserOcr(file){
    spinner('Preparing image…', 1);
    loadTesseract().then(function(T){
      if (!T){ showUnreadable('OCR could not load (offline?). You can enter the values manually.'); return; }
      loadImage(file).then(function(img){
        var angles = [0, 90, 270, 180], best = null;
        (function next(i){
          if (i >= angles.length){ finish(); return; }
          var canvas = preprocess(img, angles[i]);
          spinner('Scanning (orientation ' + (i+1) + ' of ' + angles.length + ')…', 0);
          T.recognize(canvas, 'eng', { logger:function(m){ if (m.status === 'recognizing text'){ spinner('Scanning (orientation ' + (i+1) + ' of ' + angles.length + ')…', Math.round((m.progress||0)*100)); } }})
            .then(function(out){
              var text = (out && out.data && out.data.text) || '', conf = (out && out.data && out.data.confidence) || 0, hints = fieldHints(text), score = conf + hints * 15;
              if (!best || score > best.score) best = { angle:angles[i], text:text, conf:conf, score:score, hints:hints };
              if (hints >= 3 && conf >= 55){ finish(); return; }
              next(i + 1);
            }).catch(function(){ next(i + 1); });
        })(0);
        function finish(){
          if (!best || !best.text.trim()){ showUnreadable(); return; }
          spinner('Reading check details…');
          fetch('/api/expense/check-parse', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text:best.text, ocrConfidence:best.conf }) })
            .then(function(r){ return r.json(); })
            .then(function(d){ if (d && d.fields && Object.keys(d.fields).length > 0){ state.data = d; renderReview(d); } else { showUnreadable(); } })
            .catch(function(){ showUnreadable(); });
        }
      }).catch(function(){ showUnreadable(); });
    });
  }

  function loadImage(file){ return new Promise(function(resolve, reject){ var img = new Image(); img.onload = function(){ resolve(img); }; img.onerror = reject; img.src = URL.createObjectURL(file); }); }

  // Rotate, scale, grayscale + Otsu binarize (drops the busy security-pattern background).
  function preprocess(img, angle){
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    var target = 1800, scale = target / Math.max(w, h); if (scale > 2) scale = 2;
    var sw = Math.max(1, Math.round(w * scale)), sh = Math.max(1, Math.round(h * scale));
    var rot = (angle % 180) !== 0;
    var canvas = document.createElement('canvas'); canvas.width = rot ? sh : sw; canvas.height = rot ? sw : sh;
    var ctx = canvas.getContext('2d');
    ctx.save(); ctx.translate(canvas.width / 2, canvas.height / 2); ctx.rotate(angle * Math.PI / 180); ctx.drawImage(img, -sw / 2, -sh / 2, sw, sh); ctx.restore();
    try {
      var d = ctx.getImageData(0, 0, canvas.width, canvas.height), p = d.data, i, g, n = p.length >> 2;
      var gray = new Uint8Array(n), hist = new Array(256); for (i = 0; i < 256; i++) hist[i] = 0;
      for (i = 0; i < n; i++){ g = (p[i*4]*0.299 + p[i*4+1]*0.587 + p[i*4+2]*0.114) | 0; if (g > 255) g = 255; gray[i] = g; hist[g]++; }
      var sum = 0; for (i = 0; i < 256; i++) sum += i * hist[i];
      var sumB = 0, wB = 0, max = 0, threshold = 128, mB, mF, between;
      for (i = 0; i < 256; i++){ wB += hist[i]; if (wB === 0) continue; var wF = n - wB; if (wF === 0) break; sumB += i * hist[i]; mB = sumB / wB; mF = (sum - sumB) / wF; between = wB * wF * (mB - mF) * (mB - mF); if (between > max){ max = between; threshold = i; } }
      var t = threshold + 4;
      for (i = 0; i < n; i++){ var v = gray[i] <= t ? 0 : 255; p[i*4] = p[i*4+1] = p[i*4+2] = v; }
      ctx.putImageData(d, 0, 0);
    } catch(e){ }
    return canvas;
  }

  function fieldHints(text){
    var t = text || '', n = 0;
    if (/\b\d{1,2}[\/\-.|]\d{1,2}[\/\-.|]\d{2,4}\b/.test(t)) n++;
    if (/\$|\b\d+[.\-]\d{2}\b/.test(t)) n++;
    if (/\bone\b|\bhundred\b|\/100|dollar/i.test(t)) n++;
    if (/\b\d{3,6}\b/.test(t)) n++;
    if (/tithe|offering|donation|memo|\bfor\b/i.test(t)) n++;
    return n;
  }

  var _tess = null;
  function loadTesseract(){
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (_tess) return _tess;
    var urls = ['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'];
    _tess = new Promise(function(resolve){
      var settled = false; function done(v){ if (!settled){ settled = true; resolve(v); } }
      (function tryNext(i){
        if (window.Tesseract) return done(window.Tesseract);
        if (i >= urls.length) return done(null);
        var s = document.createElement('script'); s.src = urls[i];
        s.onload = function(){ window.Tesseract ? done(window.Tesseract) : tryNext(i + 1); };
        s.onerror = function(){ tryNext(i + 1); };
        document.head.appendChild(s);
      })(0);
      setTimeout(function(){ done(window.Tesseract || null); }, 20000);
    });
    return _tess;
  }

  function showUnreadable(msg){
    body.innerHTML =
      '<div class="cs-err">'+ esc(msg || 'Unable to confidently read this check.') +'<br>Please retake the photo or enter the values manually.</div>'+
      '<div class="cs-actions">'+
        '<button class="cs-btn" onclick="CHECKSCAN.pick(\'camera\')">Retake Photo</button>'+
        '<button class="cs-btn" onclick="CHECKSCAN.pick(\'upload\')">Upload Another Image</button>'+
        '<button class="cs-btn solid" onclick="CHECKSCAN.manual()">Enter Values Manually</button>'+
      '</div>';
  }
  function manual(){ state.data = { fields:{}, confidence:{} }; renderReview(state.data); }

  function confBadge(pct){ if (pct == null) return ''; var cls = pct >= 90 ? 'hi' : (pct >= 70 ? 'mid' : 'lo'); return '<span class="cs-conf '+cls+'">'+pct+'%</span>'; }
  function lowClass(pct){ return (pct != null && pct < 70) ? ' low' : ''; }

  function renderReview(d){
    var f = d.fields || {}, c = d.confidence || {};
    var warn = d.amountMismatch ? '<div class="cs-warn">⚠️ The numeric amount and the written amount don’t match. Please confirm the correct amount.</div>' : '';
    var lowAny = ['amount','date','checkNo'].some(function(k){ return c[k]!=null && c[k]<70; });
    var lowMsg = lowAny ? '<div class="cs-warn">Some fields have low confidence (highlighted). Please review them.</div>' : '';
    body.innerHTML =
      warn + lowMsg +
      '<div class="cs-grid">'+
        field('Amount', 'csAmount', f.amount, c.amount, false) +
        field('Date', 'csDate', f.dateDisplay || f.date, c.date, false) +
        field('Ref No / Check No', 'csCheckNo', f.checkNo, c.checkNo, false) +
        '<div class="cs-field"><label>Method</label><input id="csMethod" value="Check" readonly></div>'+
        field('Notes / Memo', 'csMemo', f.memo, c.memo, true) +
        (f.bank ? '<div class="cs-field full"><label>Bank (detected)</label><input id="csBank" value="'+esc(f.bank)+'" readonly></div>' : '') +
      '</div>'+
      '<div class="cs-note" style="text-align:left;">Pick the Expense category and Fund after applying — a check doesn’t specify those.</div>'+
      '<div class="cs-actions">'+
        '<button class="cs-btn ghost" onclick="CHECKSCAN.pick(\'upload\')">Upload Another</button>'+
        '<button class="cs-btn ghost" onclick="CHECKSCAN.pick(\'camera\')">Retake</button>'+
        '<button class="cs-btn solid" onclick="CHECKSCAN.apply()">Use These Values</button>'+
      '</div>';
  }
  function field(label, id, val, conf, full){
    return '<div class="cs-field'+(full?' full':'')+lowClass(conf)+'">'+
      '<label>'+esc(label)+' '+confBadge(conf)+'</label>'+
      '<input id="'+id+'" value="'+esc(val||'')+'"></div>';
  }

  // Apply ONLY the scanned values to the Expense form.
  function apply(){
    var amount = ($('csAmount') ? $('csAmount').value : '').trim();
    var dateD  = ($('csDate')   ? $('csDate').value   : '').trim();
    var checkNo= ($('csCheckNo')? $('csCheckNo').value: '').trim();
    var memo   = ($('csMemo')   ? $('csMemo').value   : '').trim();

    document.getElementById('fAmount').value = '';
    document.getElementById('fRefNo').value  = '';
    document.getElementById('fNote').value   = '';

    if (amount){ var a = parseFloat(amount.replace(/[^0-9.]/g,'')); if (!isNaN(a)) document.getElementById('fAmount').value = a.toFixed(2); }
    var iso = toIso(dateD) || (state.data && state.data.fields && state.data.fields.date) || '';
    if (iso) document.getElementById('fDate').value = iso;
    if (checkNo) document.getElementById('fRefNo').value = checkNo;
    if (memo)    document.getElementById('fNote').value  = memo;
    setMethodCheck();
    close();
    if (typeof showFeedback === 'function') showFeedback('🧾 Check details applied. Pick the Expense category & Fund, then Save.', 'success');
    try { document.getElementById('expenseFormCard').scrollIntoView({behavior:'smooth', block:'start'}); } catch(e){}
  }

  function setMethodCheck(){
    var sel = document.getElementById('fMethod'); if (!sel) return;
    for (var i=0;i<sel.options.length;i++){ if (/check|cheque/i.test(sel.options[i].textContent)){ sel.selectedIndex = i; return; } }
  }

  function toIso(s){
    if (!s) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m){ var mo=+m[1],da=+m[2],y=m[3]; var yr=+y; if (y.length===2) yr=(yr>70?1900:2000)+yr;
      return yr.toString().padStart(4,'0')+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0'); }
    var d = new Date(s); if (!isNaN(d.getTime())) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return '';
  }

  // Store the captured image with the saved expense.
  function afterSave(expenseId){
    if (!state.file || !expenseId) { state.file = null; return Promise.resolve(); }
    var fd = new FormData(); fd.append('file', state.file);
    return fetch('/api/expense/'+expenseId+'/check-image', { method:'POST', body:fd })
      .catch(function(){ })
      .then(function(){ state.file = null; });
  }

  return { open:open, close:close, pick:pick, onFile:onFile, manual:manual, apply:apply, afterSave:afterSave,
           capture:capture, useCaptured:useCaptured, closeWebcam:closeWebcam };
})();
</script>
