<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Denied – Church Genius Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fdecea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      color: #673147;
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .meta-box {
      width: 100%;
      background: #fdf5f7;
      border: 1px solid #e8eaf6;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 28px;
      text-align: left;
    }

    .meta-row {
      display: flex;
      gap: 8px;
      font-size: 13px;
      color: #555;
      padding: 4px 0;
    }

    .meta-row:first-child { padding-top: 0; }
    .meta-row:last-child  { padding-bottom: 0; }

    .meta-label {
      font-weight: 600;
      color: #888;
      min-width: 80px;
      flex-shrink: 0;
    }

    .meta-value {
      color: #333;
      word-break: break-all;
    }

    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 120px;
      padding: 11px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background .15s, opacity .15s;
      text-decoration: none;
      text-align: center;
    }

    .btn-primary {
      background: #673147;
      color: #fff;
    }
    .btn-primary:hover { background: #4f2538; }

    .btn-outline {
      background: #fff;
      color: #673147;
      border: 1.5px solid #673147;
    }
    .btn-outline:hover { background: #f0f2ff; }

    .btn-danger {
      background: #fff;
      color: #e53935;
      border: 1.5px solid #e53935;
    }
    .btn-danger:hover { background: #fff5f5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">🔒</div>
    <div class="brand">Church Genius Pro</div>
    <h1>Access Denied</h1>
    <p class="subtitle">
      You do not have permission to access this page.<br>
      Please log in with a different user.
    </p>

    <div class="meta-box">
      <div class="meta-row">
        <span class="meta-label">User</span>
        <span class="meta-value" id="metaUsername">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Role</span>
        <span class="meta-value" id="metaRole">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Page</span>
        <span class="meta-value" id="metaPage">—</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-outline" id="btnBack" onclick="history.back()">← Go Back</button>
      <a class="btn btn-primary"  id="btnHome" href="/home">Home</a>
      <button class="btn btn-danger" onclick="logout()">Log Out</button>
    </div>
  </div>

  <script>
    // Populate meta info from session
    (async () => {
      try {
        const res  = await fetch('/api/session');
        const data = await res.json();
        if (data.authenticated) {
          document.getElementById('metaUsername').textContent =
            data.username || (data.memberId ? 'Member' : '—');
          document.getElementById('metaRole').textContent =
            data.church ? 'Church' : (data.role || '—');
          // Member portal users should go to memberHome, not /home
          if (data.role === 'Member' && data.memberId) {
            document.getElementById('btnHome').href = '/memberHome';
            document.getElementById('btnHome').textContent = 'Member Home';
          }
        } else {
          document.getElementById('metaUsername').textContent = 'Not logged in';
          document.getElementById('metaRole').textContent = '—';
          // Not authenticated at all — redirect to login
          window.location.replace('/login');
        }
      } catch (e) {
        // ignore — meta stays as dashes
      }
      // Show the page that was attempted (preserved by forward)
      document.getElementById('metaPage').textContent = window.location.pathname;
    })();

    async function logout() {
      try { await fetch('/api/logout', { method: 'POST' }); } catch (e) { /* ignore */ }
      window.location.href = '/login';
    }
  </script>
</body>
</html>
