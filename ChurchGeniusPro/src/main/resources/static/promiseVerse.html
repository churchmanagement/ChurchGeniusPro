<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
    <link rel="stylesheet" href="/shell.css" />
  <title>Promise Verses — Church Genius Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: #f5f6fa; color: #333; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    

    /* ── Sidebar (same as home.html) ── */
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    

    /* ── Main area ── */
    
    
    
    
    
    
    .btn-admin-settings { font-size: 13px; background: transparent; color: #673147; border: 1px solid #c5a0b5; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 600; transition: background .15s, color .15s, border-color .15s; }
    .btn-admin-settings:hover { background: #673147; color: #fff; border-color: #673147; }
    
    
    .tb-username { font-size: 13px; color: #555; }
    
    .page-header { background: #673147; color: #fff; padding: 18px 28px; display: flex; align-items: center; gap: 14px; }
    .page-header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .page-body { max-width: 1000px; margin: 28px auto; padding: 0 20px 60px; }

    /* ── Controls ── */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .search-input { padding: 9px 14px; border: 1.5px solid #dde0ec; border-radius: 7px; font-size: 13px; font-family: inherit; color: #673147; width: 200px; outline: none; }
    .search-input:focus { border-color: #673147; }
    .btn { padding: 9px 18px; border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary   { background: #673147; color: #fff; }
    .btn-secondary { background: #7986cb; color: #fff; }
    .btn-danger    { background: #e53935; color: #fff; }
    .btn-sm        { padding: 5px 12px; font-size: 13px; }

    /* ── Stats bar ── */
    .stats-bar { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); padding: 14px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .stat-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
    .stat-num  { font-size: 20px; font-weight: 800; color: #673147; }

    /* ── Verse table ── */
    .table-wrap { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f0f2fb; color: #673147; font-size: 13px; font-weight: 700; padding: 10px 16px; text-align: left; letter-spacing: .4px; text-transform: uppercase; }
    td { padding: 11px 16px; font-size: 13px; color: #673147; border-top: 1px solid #f0f2fb; }
    tr:hover td { background: #f8f9fe; }
    .day-badge { display: inline-block; background: #e8eaf6; color: #673147; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 12px; }
    .verse-text-cell { max-width: 420px; }
    .verse-text-cell p { margin: 0; white-space: pre-wrap; word-break: break-word; }
    .empty-row td { text-align: center; color: #aaa; padding: 40px; }

    /* ── Modal ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.18); width: 540px; max-width: 96vw; padding: 28px 28px 20px; animation: popIn .18s ease; }
    @keyframes popIn { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; color: #673147; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #6070a0; margin-bottom: 5px; }
    .field input, .field textarea, .field select { width: 100%; box-sizing: border-box; border: 1.5px solid #dde0ec; border-radius: 7px; padding: 9px 11px; font-size: 14px; font-family: inherit; color: #673147; background: #fff; transition: border-color .15s; }
    .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: #673147; }
    .field textarea { min-height: 120px; resize: vertical; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .feedback { font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; display: none; }
    .feedback.error   { display: block; background: #ffebee; color: #c62828; }
    .feedback.success { display: block; background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header id="topbar" class="topbar"></header>

    <main class="page-content">
      <div class="page-header">
        <span style="font-size:26px;">📖</span>
        <h1>Promise Verses</h1>
      </div>

      <div class="page-body">

        <div class="stats-bar">
          <div class="stat-item"><span class="stat-num" id="totalCount">0</span> of 365 days filled</div>
          <div class="stat-item" style="margin-left:auto;">
            <button class="btn btn-primary" onclick="openModal()">+ Add Verse</button>
          </div>
        </div>

        <div class="toolbar">
          <input class="search-input" id="searchInput" type="text" placeholder="Search day, reference or text…" oninput="renderTable()" />
        </div>

        <div class="table-wrap">
          <table id="verseTable">
            <thead>
              <tr>
                <th>Day</th>
                <th>Reference</th>
                <th class="verse-text-cell">Verse</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="verseBody"></tbody>
          </table>
        </div>

      </div>
    </main>
    <footer id="app-footer" class="app-footer"></footer>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="verseModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Add Promise Verse</div>
    <div class="feedback" id="verseFeedback"></div>
    <div class="field">
      <label>Day Number (1–365) <span style="color:#e53935">*</span></label>
      <input type="number" id="vDay" min="1" max="365" placeholder="e.g. 1" />
    </div>
    <div class="field">
      <label>Scripture Reference <span style="color:#e53935">*</span></label>
      <input type="text" id="vRef" placeholder="e.g. John 3:16" maxlength="200" />
    </div>
    <div class="field">
      <label>Verse Text <span style="color:#e53935">*</span></label>
      <textarea id="vText" placeholder="Enter the full verse text…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary"   onclick="saveVerse()">Save</button>
    </div>
  </div>
</div>

<script>
/* ── Page logic ── */
let verses = [];
let editingId = null;

async function loadVerses() {
  try {
    const res = await fetch('/api/promise-verses');
    if (res.ok) verses = await res.json();
  } catch(e) { console.error(e); }
  renderTable();
}

function renderTable() {
  const q    = (document.getElementById('searchInput').value || '').toLowerCase();
  const rows = verses.filter(v =>
    !q ||
    String(v.dayNumber).includes(q) ||
    (v.reference || '').toLowerCase().includes(q) ||
    (v.verseText  || '').toLowerCase().includes(q)
  );
  document.getElementById('totalCount').textContent = verses.length;
  const tbody = document.getElementById('verseBody');
  if (rows.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="4">No verses found.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(v => `
    <tr>
      <td><span class="day-badge">Day ${v.dayNumber}</span></td>
      <td>${esc(v.reference)}</td>
      <td class="verse-text-cell"><p>${esc(v.verseText)}</p></td>
      <td style="white-space:nowrap;">
        <button class="btn btn-sm btn-secondary" onclick="openModal(${v.id})" style="margin-right:6px;">Edit</button>
        <button class="btn btn-sm btn-danger"    onclick="deleteVerse(${v.id})">Delete</button>
      </td>
    </tr>`).join('');
}

function openModal(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? 'Edit Promise Verse' : 'Add Promise Verse';
  clearFb();
  if (id) {
    const v = verses.find(v => v.id === id);
    document.getElementById('vDay').value  = v?.dayNumber  || '';
    document.getElementById('vRef').value  = v?.reference  || '';
    document.getElementById('vText').value = v?.verseText  || '';
  } else {
    document.getElementById('vDay').value  = '';
    document.getElementById('vRef').value  = '';
    document.getElementById('vText').value = '';
  }
  document.getElementById('verseModal').classList.add('open');
  setTimeout(() => document.getElementById('vDay').focus(), 50);
}

function closeModal() {
  document.getElementById('verseModal').classList.remove('open');
  editingId = null;
}

async function saveVerse() {
  const day  = parseInt(document.getElementById('vDay').value,  10);
  const ref  = document.getElementById('vRef').value.trim();
  const text = document.getElementById('vText').value.trim();
  if (!day || day < 1 || day > 365) { showFb('Day number must be between 1 and 365.'); return; }
  if (!ref)  { showFb('Scripture reference is required.'); return; }
  if (!text) { showFb('Verse text is required.'); return; }

  const url    = editingId ? `/api/promise-verses/${editingId}` : '/api/promise-verses';
  const method = editingId ? 'PUT' : 'POST';
  try {
    const res  = await fetch(url, {
      method, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dayNumber: day, reference: ref, verseText: text })
    });
    const data = await res.json();
    if (!res.ok) { showFb(data.error || 'Save failed.'); return; }
    if (editingId) {
      const idx = verses.findIndex(v => v.id === editingId);
      if (idx !== -1) verses[idx] = data;
    } else {
      verses.push(data);
      verses.sort((a,b) => a.dayNumber - b.dayNumber);
    }
    closeModal(); renderTable();
  } catch(e) { showFb('Network error.'); }
}

async function deleteVerse(id) {
  const v = verses.find(v => v.id === id);
  if (!confirm('Are you sure you want to delete this verse?')) return;
  try {
    const res = await fetch(`/api/promise-verses/${id}`, { method: 'DELETE' });
    if (res.ok) { verses = verses.filter(v => v.id !== id); renderTable(); }
  } catch(e) { alert('Delete failed.'); }
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function showFb(msg) {
  const el = document.getElementById('verseFeedback');
  el.textContent = msg; el.className = 'feedback error';
}
function clearFb() {
  const el = document.getElementById('verseFeedback');
  el.textContent = ''; el.className = 'feedback';
}

document.getElementById('verseModal').addEventListener('click', e => {
  if (e.target === document.getElementById('verseModal')) closeModal();
});

loadVerses();
</script>
<script src="/session.js" defer></script>
<script>
window.CGP_PAGE = { activePage: 'admin-settings/promise-verse', pageTitle: 'Daily Verse', openSection: 'admin-settings' };
</script>
<script src="/shell.js"></script>
</body>
</html>
