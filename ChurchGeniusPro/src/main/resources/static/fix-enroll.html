<!DOCTYPE html>
<html>
<head><title>Fix Enroll</title></head>
<body>
<p>Enrolling Christina Thomas...</p>
<pre id="out">Calling endpoint...</pre>
<script>
fetch('/api/admin/ss/fix-enroll-christina', {method:'POST'})
  .then(r => r.json())
  .then(d => { document.getElementById('out').textContent = JSON.stringify(d, null, 2); })
  .catch(e => { document.getElementById('out').textContent = 'ERROR: ' + e; });
</script>
</body>
</html>
