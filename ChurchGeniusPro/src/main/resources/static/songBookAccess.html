<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#673147" />
  <link rel="stylesheet" href="/mobile.css" />
  <link rel="stylesheet" href="/shell.css" />
  <title>Song Book Access – Church Genius Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #333; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    .page-header { margin-bottom: 14px; }
    .page-title { font-size: 22px; font-weight: 700; color: #673147; }
    .page-subtitle { font-size: 13px; color: #aaa; margin-top: 3px; }
    .tabs { display: flex; gap: 8px; margin: 12px 0; }
    .tab { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
           background: #fff; color: #673147; border: 1.5px solid #e6d9e0; cursor: pointer; }
    .tab.active { background: #673147; color: #fff; border-color: #673147; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.07); padding: 16px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .search { flex: 1; min-width: 200px; padding: 8px 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; }
    .search:focus { border-color: #673147; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 10px; font-size: 14px; border-bottom: 1px solid #f0eef1; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: #999; font-weight: 700; }
    .member-name { font-weight: 600; color: #222; }
    .member-sub { font-size: 12px; color: #aaa; }
    .seg { display: inline-flex; border: 1.5px solid #e6d9e0; border-radius: 8px; overflow: hidden; }
    .seg button { padding: 6px 12px; font-size: 12px; font-weight: 700; background: #fff; color: #777; border: none; cursor: pointer; }
    .seg button + button { border-left: 1px solid #efe7ec; }
    .seg button.on-none.active { background: #9e9e9e; color: #fff; }
    .seg button.on-view.active { background: #1565c0; color: #fff; }
    .seg button.on-full.active { background: #2e7d32; color: #fff; }
    .empty { text-align: center; color: #bbb; padding: 40px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .b-none { background: #f0f0f0; color: #888; }
    .b-view { background: #e3f0fb; color: #1565c0; }
    .b-full { background: #e6f4e6; color: #2e7d32; }
    .audit-row { padding: 9px 4px; border-bottom: 1px solid #f3f0f4; font-size: 13px; display: flex; gap: 10px; }
    .audit-act { font-weight: 700; color: #673147; min-width: 110px; }
    .audit-meta { color: #999; font-size: 12px; }
    .cgp-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2e7d32; color: #fff;
                 padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .25s; z-index: 9999; }
    .cgp-toast.show { opacity: 1; }
    .cgp-toast.err { background: #c62828; }
    .more-wrap { text-align: center; padding: 14px 0 4px; }
    .more-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 22px; border-radius: 8px;
                font-size: 13px; font-weight: 700; background: #fff; color: #673147; border: 1.5px solid #e6d9e0; }
    .more-btn:hover:not(:disabled) { background: #faf5f8; border-color: #673147; }
    .more-btn:disabled { opacity: .65; cursor: default; }
    .more-btn.err { color: #c62828; border-color: #f2c4c4; }
    .spin { width: 14px; height: 14px; border: 2px solid #e6d9e0; border-top-color: #673147; border-radius: 50%;
            animation: sbspin .7s linear infinite; display: none; }
    .more-btn.loading .spin { display: inline-block; }
    @keyframes sbspin { to { transform: rotate(360deg); } }
    .list-status { text-align: center; color: #999; font-size: 13px; padding: 24px; }
    @media (max-width: 640px) {
      .audit-row { flex-wrap: wrap; }
      .audit-act { min-width: 0; }
      .audit-meta { width: 100%; }
      .more-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <header id="topbar" class="topbar"></header>
    <main class="page-content">

      <div class="page-header">
        <div class="page-title">Song Book Access</div>
        <div class="page-subtitle">Grant members View Only or Full Access to the Member Portal Song Book</div>
      </div>

      <div class="tabs">
        <button class="tab active" id="tabMembers" onclick="showTab('members')">Members</button>
        <button class="tab" id="tabActivity" onclick="showTab('activity')">Activity Log</button>
      </div>

      <!-- Members -->
      <div class="card" id="paneMembers">
        <div class="toolbar">
          <input class="search" id="search" placeholder="Search members by name or email…" oninput="onSearchInput()" />
          <span class="member-sub" id="countLbl"></span>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr><th>Member</th><th>Role</th><th>Current</th><th style="text-align:right;">Access Level</th></tr>
            </thead>
            <tbody id="memberRows"></tbody>
          </table>
        </div>
        <div class="list-status" id="membersStatus" style="display:none;"></div>
        <div class="empty" id="membersEmpty" style="display:none;">No portal members found.</div>
        <div class="more-wrap" id="membersMoreWrap" style="display:none;">
          <button type="button" class="more-btn" id="membersMoreBtn" onclick="loadMoreMembers()">
            <span class="spin" aria-hidden="true"></span><span class="lbl">Load More</span>
          </button>
        </div>
      </div>

      <!-- Activity -->
      <div class="card" id="paneActivity" style="display:none;">
        <div id="auditList"></div>
        <div class="list-status" id="auditStatus" style="display:none;"></div>
        <div class="empty" id="auditEmpty" style="display:none;">No activity yet.</div>
        <div class="more-wrap" id="auditMoreWrap" style="display:none;">
          <button type="button" class="more-btn" id="auditMoreBtn" onclick="loadMoreAudit()">
            <span class="spin" aria-hidden="true"></span><span class="lbl">Load More</span>
          </button>
        </div>
      </div>

    </main>
    <footer id="app-footer" class="app-footer"></footer>
  </div>
</div>

<div class="cgp-toast" id="toast"></div>

<script>
/* Song Book Access — members and activity are fetched from the server 10 at a time.
   "Load More" appends the next batch in place (no page reload, tab and scroll kept). */
const PAGE_SIZE = 10;
const LEVELS = ['NONE','VIEW','FULL'];

// Members tab state
const MEM = { rows: [], offset: 0, hasMore: false, total: null, loading: false, query: '', seq: 0 };
// Activity tab state (keyset cursor = createdAt + id of the last row shown)
const AUD = { rows: [], hasMore: false, loading: false, loaded: false, stale: false, seq: 0 };

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='cgp-toast show'+(err?' err':''); setTimeout(()=>t.className='cgp-toast',2600); }

function showTab(which){
  document.getElementById('tabMembers').classList.toggle('active', which==='members');
  document.getElementById('tabActivity').classList.toggle('active', which==='activity');
  document.getElementById('paneMembers').style.display = which==='members' ? '' : 'none';
  document.getElementById('paneActivity').style.display = which==='activity' ? '' : 'none';
  // Fetch the activity log only the first time it is opened, or when an access change
  // since then has added newer entries; otherwise keep what is already loaded.
  if (which==='activity' && (!AUD.loaded || AUD.stale) && !AUD.loading) loadAudit(true);
}

/* Load More button: state = 'idle' | 'loading' | 'error' | 'hidden' */
function setMore(prefix, state){
  const wrap = document.getElementById(prefix+'MoreWrap');
  const btn  = document.getElementById(prefix+'MoreBtn');
  wrap.style.display = state==='hidden' ? 'none' : '';
  btn.disabled = state==='loading';
  btn.classList.toggle('loading', state==='loading');
  btn.classList.toggle('err', state==='error');
  btn.setAttribute('aria-busy', state==='loading' ? 'true' : 'false');
  btn.querySelector('.lbl').textContent =
    state==='loading' ? 'Loading…' : (state==='error' ? 'Couldn’t load — Retry' : 'Load More');
}
function setStatus(id, text){
  const el = document.getElementById(id);
  el.textContent = text || '';
  el.style.display = text ? '' : 'none';
}

/* ───────────── Members ───────────── */

function fullName(m){ return [m.firstName, m.lastName].filter(Boolean).join(' ') || '(unnamed)'; }
function levelBadge(l){ const c = l==='FULL'?'b-full':(l==='VIEW'?'b-view':'b-none'); const t = l==='FULL'?'Full Access':(l==='VIEW'?'View Only':'No Access'); return `<span class="badge ${c}">${t}</span>`; }
function levelText(l){ return l==='FULL'?'Full Access':(l==='VIEW'?'View Only':'No Access'); }

function memberRowHtml(m){
  const lvl = m.level || 'NONE';
  return `<tr id="mrow-${m.memberId}">
      <td><div class="member-name">${esc(fullName(m))}</div><div class="member-sub">${esc(m.email||'')}</div></td>
      <td><span class="member-sub">${esc(m.role||'')}</span></td>
      <td id="cur-${m.memberId}">${levelBadge(lvl)}</td>
      <td style="text-align:right;">
        <span class="seg">
          <button class="on-none ${lvl==='NONE'?'active':''}" onclick="setLevel(${m.memberId},'NONE')">None</button>
          <button class="on-view ${lvl==='VIEW'?'active':''}" onclick="setLevel(${m.memberId},'VIEW')">View Only</button>
          <button class="on-full ${lvl==='FULL'?'active':''}" onclick="setLevel(${m.memberId},'FULL')">Full</button>
        </span>
      </td>
    </tr>`;
}

function updateMemberCount(){
  const shown = MEM.rows.length;
  const total = MEM.total == null ? shown : MEM.total;
  document.getElementById('countLbl').textContent = shown < total
    ? `Showing ${shown} of ${total} members`
    : `${total} member${total===1?'':'s'}`;
}

/* reset=true starts a fresh list (first load or a new search); otherwise appends the next 10. */
async function fetchMembers(reset){
  if (MEM.loading && !reset) return;           // ignore repeated clicks while a batch is in flight
  const seq = ++MEM.seq;                          // newer requests win over stale responses
  MEM.loading = true;
  const offset = reset ? 0 : MEM.offset;
  if (reset) setStatus('membersStatus', MEM.rows.length ? '' : 'Loading members…');
  setMore('members', reset ? 'hidden' : 'loading');
  try {
    const url = `/api/songbook/admin/members?offset=${offset}&limit=${PAGE_SIZE}&q=${encodeURIComponent(MEM.query)}`;
    const r = await fetch(url);
    if (seq !== MEM.seq) return;
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    if (seq !== MEM.seq) return;
    const tbody = document.getElementById('memberRows');
    if (reset) { MEM.rows = []; tbody.innerHTML = ''; }
    const seen = new Set(MEM.rows.map(m => m.memberId));
    const fresh = rows.filter(m => !seen.has(m.memberId));
    MEM.rows = MEM.rows.concat(fresh);
    MEM.offset = offset + rows.length;
    MEM.hasMore = r.headers.get('X-Has-More') === 'true';
    const total = r.headers.get('X-Total-Count');
    if (total != null) MEM.total = parseInt(total, 10);
    tbody.insertAdjacentHTML('beforeend', fresh.map(memberRowHtml).join(''));
    setStatus('membersStatus', '');
    document.getElementById('membersEmpty').style.display = MEM.rows.length ? 'none' : 'block';
    document.getElementById('membersEmpty').textContent = MEM.query ? 'No members match your search.' : 'No portal members found.';
    updateMemberCount();
    setMore('members', MEM.hasMore ? 'idle' : 'hidden');
  } catch(e){
    if (seq !== MEM.seq) return;
    setStatus('membersStatus', '');
    if (reset) {                                  // first batch / new search failed:
      MEM.retryReset = true;                      // Retry starts that list over
      if (!MEM.rows.length) document.getElementById('membersEmpty').style.display = 'none';
    }
    setMore('members', 'error');
    toast('Could not load members.', true);
  } finally {
    if (seq === MEM.seq) MEM.loading = false;
  }
}

function loadMembers(){ return fetchMembers(true); }
function loadMoreMembers(){
  if (MEM.retryReset) { MEM.retryReset = false; return fetchMembers(true); }
  return fetchMembers(false);
}

let searchTimer = null;
function onSearchInput(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = (document.getElementById('search').value || '').trim();
    if (q === MEM.query) return;
    MEM.query = q; MEM.total = null; MEM.retryReset = false;
    fetchMembers(true);
  }, 300);
}

async function setLevel(memberId, level){
  try {
    const r = await fetch('/api/songbook/admin/access', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ memberId, level })
    });
    if (!r.ok){ toast('Could not update access.', true); return; }
    const m = MEM.rows.find(x=>x.memberId===memberId);
    if (m) {
      m.level = level;
      const row = document.getElementById('mrow-' + memberId);
      if (row) row.outerHTML = memberRowHtml(m);   // update just this row, keep the rest
    }
    AUD.stale = true;                               // a new ACCESS_GRANT entry now exists
    toast(`${m ? fullName(m) : 'Member'} → ${levelText(level)}`);
  } catch(e){ toast('Could not update access.', true); }
}

/* ───────────── Activity Log ───────────── */

function auditRowHtml(a){
  const when = a.createdAt ? new Date(a.createdAt).toLocaleString() : '';
  const what = [a.songTitle, a.detail].filter(Boolean).join(' — ');
  return `<div class="audit-row"><span class="audit-act">${esc(a.action)}</span>
        <span style="flex:1;">${esc(what)}</span>
        <span class="audit-meta">${esc(a.actor||'')} · ${esc(when)}</span></div>`;
}

async function fetchAudit(reset){
  if (AUD.loading) return;
  const seq = ++AUD.seq;
  AUD.loading = true;
  let url = `/api/songbook/admin/audit?limit=${PAGE_SIZE}`;
  const last = AUD.rows[AUD.rows.length - 1];
  if (!reset && last && last.createdAt && last.id != null) {
    url += `&beforeTs=${encodeURIComponent(last.createdAt)}&beforeId=${encodeURIComponent(last.id)}`;
  }
  if (reset) setStatus('auditStatus', 'Loading activity…');
  setMore('audit', reset ? 'hidden' : 'loading');
  try {
    const r = await fetch(url);
    if (seq !== AUD.seq) return;
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    if (seq !== AUD.seq) return;
    const list = document.getElementById('auditList');
    if (reset) { AUD.rows = []; list.innerHTML = ''; }
    const seen = new Set(AUD.rows.map(a => a.id));
    const fresh = rows.filter(a => a.id == null || !seen.has(a.id));
    AUD.rows = AUD.rows.concat(fresh);
    AUD.hasMore = r.headers.get('X-Has-More') === 'true';
    AUD.loaded = true; AUD.stale = false; AUD.retryReset = false;
    list.insertAdjacentHTML('beforeend', fresh.map(auditRowHtml).join(''));
    setStatus('auditStatus', '');
    document.getElementById('auditEmpty').style.display = AUD.rows.length ? 'none' : 'block';
    setMore('audit', AUD.hasMore ? 'idle' : 'hidden');
  } catch(e){
    if (seq !== AUD.seq) return;
    setStatus('auditStatus', '');
    if (reset) AUD.retryReset = true;
    setMore('audit', 'error');
    toast('Could not load activity.', true);
  } finally {
    if (seq === AUD.seq) AUD.loading = false;
  }
}

function loadAudit(reset){ return fetchAudit(reset !== false); }
function loadMoreAudit(){
  if (AUD.retryReset) { AUD.retryReset = false; return fetchAudit(true); }
  return fetchAudit(false);
}

loadMembers();
</script>

<script>
window.CGP_PAGE = { activePage: 'more/songbook-access', openSection: 'more', pageTitle: 'Song Book Access' };
</script>
<script src="/shell.js"></script>
<script src="/session.js"></script>
</body>
</html>
