<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <title>Prayer Request</title>
  <style>
    :root { --brand:#673147; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:#f3eef1; color:#222; }
    .wrap { max-width:520px; margin:0 auto; min-height:100vh; background:#fff; }
    .hero { background:var(--brand); color:#fff; text-align:center; padding:26px 20px; }
    .logo { width:72px; height:72px; border-radius:50%; object-fit:cover; background:#fff; border:3px solid rgba(255,255,255,.85); margin:0 auto 10px; display:block; }
    .hero h1 { font-size:21px; margin:0; font-weight:800; } .hero p { font-size:13px; opacity:.95; margin:6px 0 0; }
    .body { padding:20px 16px 30px; }
    label { display:block; font-size:12.5px; font-weight:600; color:#555; margin:12px 0 5px; }
    .req::after { content:' *'; color:#c0392b; }
    input,textarea { width:100%; padding:11px 12px; border:1.5px solid #e0d5db; border-radius:9px; font-size:15px; outline:none; font-family:inherit; }
    input:focus,textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(103,49,71,.1); }
    .row { display:flex; gap:10px; } .row > div { flex:1; }
    .share { display:flex; align-items:flex-start; gap:9px; margin-top:16px; font-size:14px; color:#444; }
    .share input { width:auto; margin-top:2px; }
    .btn { width:100%; margin-top:22px; padding:13px; border:none; border-radius:11px; background:var(--brand); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
    .btn[disabled]{ opacity:.6; }
    .msg { margin-top:14px; font-size:13px; border-radius:8px; padding:10px 12px; display:none; }
    .msg.err { background:#fdecee; color:#c0392b; display:block; }
    .done { text-align:center; padding:60px 24px; } .done .ic { font-size:54px; } .done h2 { color:var(--brand); }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="hero" id="hero"><h1>🙏 Prayer Request</h1></div>
    <div class="body">
      <form id="f" autocomplete="on">
        <div class="row"><div><label class="req">First Name</label><input id="firstName" /></div><div><label class="req">Last Name</label><input id="lastName" /></div></div>
        <label class="req">Email Address</label><input id="email" type="email" />
        <label>Phone Number</label><input id="phone" type="tel" />
        <label class="req">Prayer Request or Praise Report</label>
        <textarea id="requestText" rows="5" placeholder="Share your prayer request or praise…"></textarea>
        <label class="share"><input type="checkbox" id="shareWithTeam"> Can we share this request with the Prayer Team?</label>
        <button class="btn" type="submit" id="submitBtn">Submit Prayer Request</button>
        <div id="msg" class="msg"></div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      function esc(s){ return String(s==null?'':s); }
      var params = new URLSearchParams(location.search);
      var cid = params.get('c') || params.get('cid') || '';
      var source = (params.get('src') || 'PUBLIC').toUpperCase();
      var wrap = document.getElementById('wrap');
      function show(t,k){ var m=document.getElementById('msg'); m.textContent=t; m.className='msg '+k; }

      if (cid) fetch('/api/public/engage-info?cid=' + encodeURIComponent(cid)).then(r=>r.json()).then(function (d) {
        if (d.themeColor) document.documentElement.style.setProperty('--brand', d.themeColor);
        document.getElementById('hero').innerHTML =
          (d.logo ? '<img class="logo" src="'+esc(d.logo)+'" alt="" />' : '')
          + '<h1>🙏 Prayer Request</h1><p>'+esc(d.churchName||'')+'</p>';
      }).catch(function(){});

      document.getElementById('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var fn=document.getElementById('firstName').value.trim(), ln=document.getElementById('lastName').value.trim();
        var em=document.getElementById('email').value.trim(), tx=document.getElementById('requestText').value.trim();
        if (!fn || !ln) { show('First and last name are required.', 'err'); return; }
        if (!em) { show('Email is required.', 'err'); return; }
        if (!tx) { show('Please enter your prayer request.', 'err'); return; }
        var body = { cid: cid, source: source, firstName: fn, lastName: ln, email: em,
                     phone: document.getElementById('phone').value.trim(),
                     requestText: tx, shareWithTeam: document.getElementById('shareWithTeam').checked };
        var btn = document.getElementById('submitBtn'); btn.disabled = true; btn.textContent = 'Submitting…';
        fetch('/api/public/prayer-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
          .then(function (r) { return r.json().then(j=>({ok:r.ok,j})); })
          .then(function (res) {
            if (res.ok) {
              wrap.innerHTML = '<div class="done"><div class="ic">🙏</div><h2>Thank you!</h2>'
                + '<p style="color:#555;">Your prayer request has been received. Our prayer team will be praying for you.</p></div>';
            } else { show((res.j && res.j.error) || 'Could not submit. Please try again.', 'err'); btn.disabled=false; btn.textContent='Submit Prayer Request'; }
          }).catch(function(){ show('Network error. Please try again.', 'err'); btn.disabled=false; btn.textContent='Submit Prayer Request'; });
      });
    })();
  </script>
</body>
</html>
