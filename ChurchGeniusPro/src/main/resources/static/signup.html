<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="stylesheet" href="/mobile.css" />
  <title>Church Genius Pro – Sign Up</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── Card ─────────────────────────────────────────── */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-box { width: 180px; margin-bottom: 24px; }
    .logo-box img { width: 100%; height: auto; display: block; }

    /* ── Steps ────────────────────────────────────────── */
    .step { width: 100%; display: none; flex-direction: column; align-items: center; }
    .step.active { display: flex; }

    /* ── Validating spinner ───────────────────────────── */
    .spinner-ring {
      width: 48px; height: 48px;
      border: 4px solid #e8eaf6;
      border-top-color: #673147;
      border-radius: 50%;
      animation: spin .9s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .step-label {
      font-size: 14px;
      color: #888;
      text-align: center;
      line-height: 1.6;
    }

    /* ── Invalid state ────────────────────────────────── */
    .big-icon { font-size: 48px; margin-bottom: 14px; }

    .step-title {
      font-size: 19px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
      text-align: center;
    }

    .step-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.65;
      text-align: center;
    }

    /* ── Welcome banner ───────────────────────────────── */
    .welcome-banner {
      width: 100%;
      background: #f5eaef;
      border: 1px solid #d4a0b0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #673147;
      text-align: center;
      margin-bottom: 20px;
    }

    /* ── Form ─────────────────────────────────────────── */
    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 4px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }

    .field label {
      font-size: 13px;
      font-weight: 500;
      color: #555;
    }

    .field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff;
      font-family: inherit;
    }
    .field input::placeholder { color: #bbb; }
    .field input:focus {
      border-color: #673147;
      box-shadow: 0 0 0 3px rgba(103,49,71, .1);
    }
    .field input.invalid { border-color: #e53935; }

    .field-hint { font-size: 11px; color: #e53935; min-height: 14px; }

    /* ── Buttons ──────────────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #673147;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s;
      font-family: inherit;
    }
    .btn-primary:hover:not(:disabled) { background: #3d1d2b; }
    .btn-primary:disabled { opacity: .65; cursor: not-allowed; }

    .btn-outline {
      width: 100%;
      padding: 11px;
      background: #fff;
      border: 1.5px solid #673147;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #673147;
      cursor: pointer;
      transition: background .2s;
      font-family: inherit;
    }
    .btn-outline:hover { background: #f5eaef; }

    /* ── Error message ────────────────────────────────── */
    .error-msg {
      font-size: 13px;
      color: #e53935;
      text-align: center;
      min-height: 16px;
      width: 100%;
    }

    /* ── OTP boxes ────────────────────────────────────── */
    .otp-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      margin-top: 6px;
    }

    .otp-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .otp-box {
      width: 48px;
      height: 56px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff;
      font-family: monospace;
      caret-color: transparent;
    }
    .otp-box:focus {
      border-color: #673147;
      box-shadow: 0 0 0 3px rgba(103,49,71, .12);
    }
    .otp-box.invalid { border-color: #e53935; }
    .otp-box.filled  { border-color: #673147; background: #f0f3ff; }

    /* ── Resend row ───────────────────────────────────── */
    .resend-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      font-size: 13px;
      color: #888;
      min-height: 24px;
    }

    .btn-resend {
      background: none;
      border: none;
      color: #673147;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      display: none;
    }
    .btn-resend:hover { text-decoration: underline; }

    /* ── Divider ──────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      color: #aaa;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #e0e0e0;
    }

    /* ── Success ──────────────────────────────────────── */
    .success-icon { font-size: 52px; margin-bottom: 16px; }

    @media (max-width: 440px) {
      .card { padding: 28px 20px; }
      .otp-box { width: 40px; height: 50px; font-size: 20px; }
      .otp-row  { gap: 7px; }
    }
  </style>
</head>
<body>
<div class="card">

  <div class="logo-box">
    <img src="/logo.png" alt="Church Genius Pro" onerror="this.style.display='none'" />
  </div>

  <!-- ═════════════════════════════════════════
       STEP 1 · Validating (shown by default)
  ════════════════════════════════════════════ -->
  <div class="step active" id="stepValidating">
    <div class="spinner-ring"></div>
    <p class="step-label">Verifying your invitation link…</p>
  </div>

  <!-- ═════════════════════════════════════════
       STEP 2 · Invalid link
  ════════════════════════════════════════════ -->
  <div class="step" id="stepInvalid">
    <div class="big-icon">⛔</div>
    <h3 class="step-title">Invalid Invitation Link</h3>
    <p class="step-desc" id="invalidMsg">
      This link is invalid or has expired.<br/>Please contact your administrator.
    </p>
  </div>

  <!-- ═════════════════════════════════════════
       STEP 3 · Credentials
  ════════════════════════════════════════════ -->
  <div class="step" id="stepCredentials">

    <div class="welcome-banner" id="welcomeBanner" style="display:none;"></div>

    <form class="form" id="credentialsForm" novalidate>

      <div class="field">
        <label for="username">Username <span style="color:#e53935">*</span></label>
        <input type="text" id="username" placeholder="Choose a username"
               autocomplete="username" />
        <span class="field-hint" id="usernameHint"></span>
      </div>

      <div class="field">
        <label for="password">Password <span style="color:#e53935">*</span></label>
        <input type="password" id="password"
               placeholder="Create a password (min 8 chars)"
               autocomplete="new-password" />
        <span class="field-hint" id="passwordHint"></span>
      </div>

      <div class="field">
        <label for="confirmPassword">
          Confirm Password <span style="color:#e53935">*</span>
        </label>
        <input type="password" id="confirmPassword"
               placeholder="Re-enter your password"
               autocomplete="new-password" />
        <span class="field-hint" id="confirmHint"></span>
      </div>

      <p class="error-msg" id="credentialsError"></p>

      <button type="submit" class="btn-primary" id="btnSendCode">
        Next — Send Verification Code
      </button>

      <div class="divider">or</div>

      <button type="button" class="btn-outline"
              onclick="window.location.href='/login'">
        Already have an account? Login
      </button>

    </form>
  </div>

  <!-- ═════════════════════════════════════════
       STEP 4 · OTP entry
  ════════════════════════════════════════════ -->
  <div class="step" id="stepOtp">

    <div class="big-icon">✉️</div>
    <h3 class="step-title">Enter Verification Code</h3>
    <p class="step-desc" style="margin-bottom:24px;">
      A 6-digit code was sent to<br/>
      <strong id="maskedEmailDisplay"></strong>
    </p>

    <div class="otp-wrapper">
      <div class="otp-row" id="otpRow">
        <input type="text" class="otp-box" maxlength="1"
               inputmode="numeric" autocomplete="one-time-code" />
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" />
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" />
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" />
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" />
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" />
      </div>

      <p class="error-msg" id="otpError"></p>

      <button class="btn-primary" id="btnVerify">Verify &amp; Create Account</button>

      <div class="resend-row">
        <span id="resendTimer"></span>
        <button type="button" class="btn-resend" id="btnResend">Resend Code</button>
      </div>
    </div>
  </div>

  <!-- ═════════════════════════════════════════
       STEP 5 · Success
  ════════════════════════════════════════════ -->
  <div class="step" id="stepSuccess">
    <div class="success-icon">✅</div>
    <h3 class="step-title">Account Created!</h3>
    <p class="step-desc">
      Your account has been created successfully.<br/>
      Redirecting to login…
    </p>
  </div>

</div><!-- .card -->

<script>
/* ══════════════════════════════════════════════
   Shared state
══════════════════════════════════════════════ */
const S = {
  type:              '',
  decryptedClientId: '',
  maskedEmail:       '',
  username:          '',
  password:          '',
  resendTimer:       null
};

const STEPS = ['stepValidating','stepInvalid','stepCredentials','stepOtp','stepSuccess'];

function showStep(id) {
  STEPS.forEach(s => document.getElementById(s).classList.toggle('active', s === id));
}

/* ══════════════════════════════════════════════
   STEP 1 · Validate link on page load
══════════════════════════════════════════════ */
(async function init() {
  const params = new URLSearchParams(window.location.search);

  // Type is no longer in the URL — the backend infers it from the token prefix:
  //   CG... → church,  US... (USR...) → user
  const enc = params.get('clientId');
  if (!enc) { showInvalid('Missing clientId in the invitation link.'); return; }
  const qs = 'clientId=' + encodeURIComponent(enc);

  try {
    const res  = await fetch('/api/signup/validate?' + qs);
    const data = await res.json().catch(() => ({}));

    if (res.ok && data.status === 'valid') {
      S.decryptedClientId = data.decryptedClientId || '';
      S.maskedEmail       = data.maskedEmail        || '';
      S.type              = data.type               || '';

      // Welcome banner removed per request — greeting is no longer shown.
      const banner = document.getElementById('welcomeBanner');
      if (banner) banner.style.display = 'none';
      showStep('stepCredentials');

    } else {
      showInvalid(data.message || 'This invitation link is invalid or has expired.');
    }
  } catch {
    showInvalid('Unable to verify the link. Please check your connection and try again.');
  }
})();

function showInvalid(msg) {
  document.getElementById('invalidMsg').textContent = msg;
  showStep('stepInvalid');
}

/* ══════════════════════════════════════════════
   STEP 2 · Credentials → send OTP
══════════════════════════════════════════════ */
document.getElementById('credentialsForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const errEl = document.getElementById('credentialsError');
  errEl.textContent = '';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirmPassword').value;
  let   valid    = true;

  if (!username)           { setErr('username','usernameHint','Username is required.');           valid = false; }
  else                       clearErr('username','usernameHint');

  if (!password)           { setErr('password','passwordHint','Password is required.');           valid = false; }
  else if (password.length < 8) { setErr('password','passwordHint','Minimum 8 characters required.'); valid = false; }
  else                       clearErr('password','passwordHint');

  if (!confirm)            { setErr('confirmPassword','confirmHint','Please confirm your password.'); valid = false; }
  else if (confirm !== password) { setErr('confirmPassword','confirmHint','Passwords do not match.'); valid = false; }
  else                       clearErr('confirmPassword','confirmHint');

  if (!valid) return;

  const btn       = document.getElementById('btnSendCode');
  btn.disabled    = true;
  btn.textContent = 'Sending code…';

  try {
    const res  = await fetch('/api/signup/send-code', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ clientId: S.decryptedClientId, type: S.type, username, password })
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      S.username    = username;
      S.password    = password;
      S.maskedEmail = data.maskedEmail || S.maskedEmail;
      document.getElementById('maskedEmailDisplay').textContent = S.maskedEmail;
      clearOtp();
      showStep('stepOtp');
      document.querySelector('.otp-box').focus();
      startResendCooldown(60);
    } else {
      errEl.textContent = data.message || 'Failed to send verification code. Please try again.';
    }
  } catch {
    errEl.textContent = 'Unable to connect. Please try again.';
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Next — Send Verification Code';
  }
});

/* ══════════════════════════════════════════════
   OTP box interactions
══════════════════════════════════════════════ */
const otpBoxes = Array.from(document.querySelectorAll('.otp-box'));

otpBoxes.forEach((box, i) => {
  box.addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 1);
    this.classList.toggle('filled', this.value !== '');
    if (this.value && i < otpBoxes.length - 1) otpBoxes[i + 1].focus();
  });

  box.addEventListener('keydown', function (e) {
    if (e.key === 'Backspace') {
      if (this.value) {
        this.value = '';
        this.classList.remove('filled');
      } else if (i > 0) {
        otpBoxes[i - 1].value = '';
        otpBoxes[i - 1].classList.remove('filled');
        otpBoxes[i - 1].focus();
      }
      e.preventDefault();
    } else if (e.key === 'ArrowLeft'  && i > 0)                   otpBoxes[i - 1].focus();
      else if (e.key === 'ArrowRight' && i < otpBoxes.length - 1) otpBoxes[i + 1].focus();
  });

  box.addEventListener('paste', function (e) {
    e.preventDefault();
    const digits = (e.clipboardData || window.clipboardData)
                   .getData('text').replace(/\D/g, '').slice(0, 6);
    [...digits].forEach((ch, j) => {
      if (otpBoxes[i + j]) { otpBoxes[i + j].value = ch; otpBoxes[i + j].classList.add('filled'); }
    });
    otpBoxes[Math.min(i + digits.length, otpBoxes.length - 1)].focus();
  });
});

function getOtpCode()  { return otpBoxes.map(b => b.value).join(''); }
function clearOtp()    { otpBoxes.forEach(b => { b.value = ''; b.classList.remove('invalid','filled'); }); }

/* ══════════════════════════════════════════════
   STEP 3 · Verify OTP
══════════════════════════════════════════════ */
document.getElementById('btnVerify').addEventListener('click', async function () {
  const code   = getOtpCode();
  const otpErr = document.getElementById('otpError');
  otpErr.textContent = '';

  if (code.length !== 6) {
    otpErr.textContent = 'Please enter all 6 digits.';
    otpBoxes.forEach(b => b.classList.add('invalid'));
    return;
  }
  otpBoxes.forEach(b => b.classList.remove('invalid'));

  this.disabled    = true;
  this.textContent = 'Verifying…';

  try {
    const res  = await fetch('/api/signup/verify', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        clientId: S.decryptedClientId,
        type:     S.type,
        username: S.username,
        password: S.password,
        code
      })
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      clearInterval(S.resendTimer);
      showStep('stepSuccess');
      setTimeout(() => window.location.href = '/login', 2500);
    } else {
      otpErr.textContent = data.message || 'Invalid code. Please try again.';
      clearOtp();
      otpBoxes[0].focus();
    }
  } catch {
    otpErr.textContent = 'Unable to connect. Please try again.';
  } finally {
    this.disabled    = false;
    this.textContent = 'Verify & Create Account';
  }
});

/* ══════════════════════════════════════════════
   Resend code (60-second cooldown)
══════════════════════════════════════════════ */
function startResendCooldown(secs) {
  const timerEl   = document.getElementById('resendTimer');
  const resendBtn = document.getElementById('btnResend');
  resendBtn.style.display = 'none';
  clearInterval(S.resendTimer);
  let rem = secs;
  timerEl.textContent = 'Resend code in ' + rem + 's';
  S.resendTimer = setInterval(() => {
    rem--;
    if (rem <= 0) {
      clearInterval(S.resendTimer);
      timerEl.textContent     = '';
      resendBtn.style.display = '';
    } else {
      timerEl.textContent = 'Resend code in ' + rem + 's';
    }
  }, 1000);
}

document.getElementById('btnResend').addEventListener('click', async function () {
  this.disabled = true;
  document.getElementById('otpError').textContent = '';
  try {
    const res = await fetch('/api/signup/send-code', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        clientId: S.decryptedClientId,
        type:     S.type,
        username: S.username,
        password: S.password
      })
    });
    if (res.ok) {
      clearOtp();
      otpBoxes[0].focus();
      startResendCooldown(60);
    } else {
      const d = await res.json().catch(() => ({}));
      document.getElementById('otpError').textContent = d.message || 'Failed to resend.';
    }
  } catch {
    document.getElementById('otpError').textContent = 'Unable to connect. Please try again.';
  } finally {
    this.disabled = false;
  }
});

/* ══════════════════════════════════════════════
   Field helpers
══════════════════════════════════════════════ */
function setErr(id, hintId, msg) {
  const el = document.getElementById(id); if (el) el.classList.add('invalid');
  const h  = document.getElementById(hintId); if (h) h.textContent = msg;
}
function clearErr(id, hintId) {
  const el = document.getElementById(id); if (el) el.classList.remove('invalid');
  const h  = document.getElementById(hintId); if (h) h.textContent = '';
}

document.getElementById('username').addEventListener('blur', function () {
  this.value.trim() ? clearErr('username','usernameHint') : setErr('username','usernameHint','Username is required.');
});
document.getElementById('password').addEventListener('blur', function () {
  if (!this.value)           setErr('password','passwordHint','Password is required.');
  else if (this.value.length < 8) setErr('password','passwordHint','Minimum 8 characters required.');
  else                       clearErr('password','passwordHint');
});
document.getElementById('confirmPassword').addEventListener('blur', function () {
  const pwd = document.getElementById('password').value;
  (this.value === pwd) ? clearErr('confirmPassword','confirmHint') : setErr('confirmPassword','confirmHint','Passwords do not match.');
});
</script>
<script src="/pwa.js" async></script>
</body>
</html>
