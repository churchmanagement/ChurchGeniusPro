<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
    <title>Church Genius Pro – Sign Up</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        background-color: #f5f6fa;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 40px 36px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-box {
        width: 72px;
        height: 72px;
        background-color: #e8eaf6;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
      }

      .logo-box span {
        color: #673147;
        font-size: 15px;
        font-weight: 600;
      }

      .app-title {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 6px;
      }

      .app-subtitle {
        font-size: 13px;
        color: #999;
        margin-bottom: 28px;
      }

      .form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 13px;
        font-weight: 500;
        color: #555;
      }

      .field input {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        color: #333;
        outline: none;
        transition: border-color 0.2s;
        background: #fff;
      }

      .field input::placeholder { color: #bbb; }
      .field input:focus        { border-color: #673147; }
      .field input.invalid      { border-color: #e53935; }

      .field-hint {
        font-size: 11px;
        color: #e53935;
        min-height: 15px;
      }

      .error-msg {
        font-size: 13px;
        color: #e53935;
        text-align: center;
        min-height: 18px;
      }

      .success-msg {
        font-size: 13px;
        color: #388e3c;
        text-align: center;
        min-height: 18px;
      }

      .btn-signup {
        width: 100%;
        padding: 13px;
        background-color: #3a5a9b;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
        font-family: inherit;
      }

      .btn-signup:hover:not(:disabled) { background-color: #3d1d2b; }
      .btn-signup:disabled { opacity: 0.7; cursor: not-allowed; }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        color: #aaa;
        font-size: 13px;
      }

      .divider::before, .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e0e0e0;
      }

      .btn-google {
        width: 100%;
        padding: 12px;
        background: #fff;
        border: 1.5px solid #e0e0e0;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 500;
        color: #333;
        cursor: pointer;
        transition: background-color 0.2s;
        font-family: inherit;
      }

      .btn-google:hover { background-color: #f7f7f7; }

      .login-link {
        font-size: 13px;
        color: #888;
        text-align: center;
      }

      .login-link a {
        color: #3a5a9b;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }

      .login-link a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">

      <div class="logo-box">
        <span>Logo</span>
      </div>

      <h1 class="app-title">Sign Up</h1>
      <p class="app-subtitle">Create your Church Genius account</p>

      <!-- Maps to Organization.java: clientId (hidden), username, password, confirmPassword -->
      <form class="form" id="orgForm" novalidate>

        <!-- clientId — hidden, managed by backend -->
        <input type="hidden" id="clientId" name="clientId" />

        <div class="field">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
          />
          <span class="field-hint" id="usernameHint"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
          />
          <span class="field-hint" id="passwordHint"></span>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Re-enter your password"
            autocomplete="new-password"
          />
          <span class="field-hint" id="confirmHint"></span>
        </div>

        <p class="error-msg"   id="errorMsg"></p>
        <p class="success-msg" id="successMsg"></p>

        <button type="submit" class="btn-signup" id="signupBtn">Sign Up</button>

        <div class="divider">or</div>

        <button type="button" class="btn-google" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign Up with Google
        </button>

        <p class="login-link">
          Already have an account? <a onclick="window.location.href='/login'">Log in</a>
        </p>

      </form>
    </div>

    <script>
      /**
       * Maps directly to Organization.java fields:
       *   clientId       (Integer  — hidden)
       *   username       (String)
       *   password       (String)
       *   confirmPassword(String)
       */

      const form           = document.getElementById('orgForm');
      const signupBtn      = document.getElementById('signupBtn');
      const errorMsg       = document.getElementById('errorMsg');
      const successMsg     = document.getElementById('successMsg');

      const usernameInput  = document.getElementById('username');
      const passwordInput  = document.getElementById('password');
      const confirmInput   = document.getElementById('confirmPassword');

      const usernameHint   = document.getElementById('usernameHint');
      const passwordHint   = document.getElementById('passwordHint');
      const confirmHint    = document.getElementById('confirmHint');

      /* ── Inline validation helpers ─────────────────── */
      usernameInput.addEventListener('blur', function () {
        const val = usernameInput.value.trim();
        if (!val) {
          usernameHint.textContent = 'Username is required.';
          usernameInput.classList.add('invalid');
        } else if (val.length < 3) {
          usernameHint.textContent = 'At least 3 characters required.';
          usernameInput.classList.add('invalid');
        } else {
          usernameHint.textContent = '';
          usernameInput.classList.remove('invalid');
        }
      });

      passwordInput.addEventListener('blur', function () {
        const val = passwordInput.value;
        if (!val) {
          passwordHint.textContent = 'Password is required.';
          passwordInput.classList.add('invalid');
        } else if (val.length < 6) {
          passwordHint.textContent = 'At least 6 characters required.';
          passwordInput.classList.add('invalid');
        } else {
          passwordHint.textContent = '';
          passwordInput.classList.remove('invalid');
        }
      });

      confirmInput.addEventListener('blur', function () {
        if (confirmInput.value !== passwordInput.value) {
          confirmHint.textContent = 'Passwords do not match.';
          confirmInput.classList.add('invalid');
        } else {
          confirmHint.textContent = '';
          confirmInput.classList.remove('invalid');
        }
      });

      /* ── Form submit ────────────────────────────────── */
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorMsg.textContent   = '';
        successMsg.textContent = '';

        /** @type {string} */
        const username        = usernameInput.value.trim();
        /** @type {string} */
        const password        = passwordInput.value;
        /** @type {string} */
        const confirmPassword = confirmInput.value;

        /* Client-side validation */
        let valid = true;

        if (!username || username.length < 3) {
          usernameHint.textContent = 'At least 3 characters required.';
          usernameInput.classList.add('invalid');
          valid = false;
        }
        if (!password || password.length < 6) {
          passwordHint.textContent = 'At least 6 characters required.';
          passwordInput.classList.add('invalid');
          valid = false;
        }
        if (password !== confirmPassword) {
          confirmHint.textContent = 'Passwords do not match.';
          confirmInput.classList.add('invalid');
          valid = false;
        }

        if (!valid) return;

        signupBtn.disabled    = true;
        signupBtn.textContent = 'Creating account…';

        try {
          const response = await fetch('/api/organization', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username:        username,
              password:        password,
              confirmPassword: confirmPassword
            })
          });

          if (response.ok) {
            successMsg.textContent = 'Account created successfully! Redirecting…';
            form.reset();
            setTimeout(() => window.location.href = '/login', 1500);
          } else {
            const data = await response.json().catch(() => ({}));
            errorMsg.textContent = data.message || 'Sign up failed. Please try again.';
          }
        } catch (err) {
          errorMsg.textContent = 'Unable to connect. Please try again.';
        } finally {
          signupBtn.disabled    = false;
          signupBtn.textContent = 'Sign Up';
        }
      });

      /* ── Google sign-up (placeholder) ──────────────── */
      document.getElementById('googleBtn').addEventListener('click', function () {
        errorMsg.textContent = 'Google Sign Up is not yet configured.';
      });
    </script>
  </body>
</html>
