<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
    <link rel="stylesheet" href="/shell.css" />
  <title>Membership Requests – Church Genius Pro</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f6fa;color:#333;}
    a{text-decoration:none;color:inherit;}button{cursor:pointer;font-family:inherit;border:none;background:none;}
    
    /* ── Sidebar ── */
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    /* ── Main ── */
    
    
    
    
    
    
    .btn-admin-settings { font-size: 13px; background: transparent; color: #673147; border: 1px solid #c5a0b5; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 600; transition: background .15s, color .15s, border-color .15s; }
    .btn-admin-settings:hover { background: #673147; color: #fff; border-color: #673147; }
    
    
    
    /* ── Header ── */
    .page-header{margin-bottom:20px;}
    .page-title{font-size:22px;font-weight:700;color:#1e2139;}
    .page-sub{font-size:13px;color:#888;margin-top:2px;}
    /* ── Feedback ── */
    .feedback{padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;}
    .feedback.success{display:block;background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;}
    .feedback.error{display:block;background:#ffebee;color:#c62828;border:1px solid #ef9a9a;}
    /* ── List card ── */
    .card{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden;margin-bottom:20px;}
    .card-header{padding:14px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px;background:#fafbfd;}
    .card-header h3{font-size:14px;font-weight:700;color:#1e2139;}
    .table-wrap{overflow-x:auto;}
    table.req-tbl{width:100%;border-collapse:collapse;font-size:13px;}
    table.req-tbl thead th{background:#f5f6fa;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888;padding:10px 14px;text-align:left;border-bottom:2px solid #e8eaf0;white-space:nowrap;}
    table.req-tbl tbody td{padding:11px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;}
    table.req-tbl tbody tr:last-child td{border-bottom:none;}
    table.req-tbl tbody tr:hover td{background:#fafbff;cursor:pointer;}
    .empty-row{text-align:center;color:#bbb;padding:32px!important;}
    /* ── Detail panel ── */
    .detail-panel{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:20px;display:none;}
    .detail-panel.open{display:block;}
    .detail-header{padding:14px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;background:#fafbfd;}
    .detail-header h3{font-size:14px;font-weight:700;color:#1e2139;}
    .btn-close-detail{font-size:18px;color:#999;padding:2px 6px;}
    .btn-close-detail:hover{color:#333;}
    .detail-body{padding:20px 24px;}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-bottom:16px;}
    @media(max-width:600px){.detail-grid{grid-template-columns:1fr;}}
    .detail-field label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px;}
    .detail-field span{font-size:13px;color:#333;}
    /* ── Members sub-table ── */
    table.mem-tbl{width:100%;border-collapse:collapse;font-size: 13px;margin-top:4px;}
    table.mem-tbl thead th{background:#e8eaf6;color:#673147;font-size:11px;font-weight:700;padding:7px 10px;text-align:left;border-bottom:1px solid #c5cae9;}
    table.mem-tbl tbody td{padding:7px 10px;border-bottom:1px solid #f0f0f0;vertical-align:top;}
    table.mem-tbl tbody tr:last-child td{border-bottom:none;}
    .role-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
    .role-primary{background:#e8eaf6;color:#673147;} .role-wife{background:#fce4ec;color:#c2185b;}
    .role-son{background:#e3f2fd;color:#1565c0;} .role-daughter{background:#f3e5f5;color:#7b1fa2;}
    .role-other{background:#fff3e0;color:#e65100;}
    /* ── Status / changes (V15) ── */
    .st-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;}
    .st-pending_review{background:#fff8e1;color:#b26a00;} .st-approved{background:#e3f2fd;color:#1565c0;} .st-updated{background:#e8f5e9;color:#2e7d32;}
    .link-review{color:#673147;font-weight:600;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font:inherit;}
    .filter-bar{display:flex;gap:10px;align-items:center;margin-left:auto;font-size:13px;}
    .filter-bar select{padding:5px 8px;border:1px solid #d6d8e4;border-radius:6px;font-size:13px;}
    .chg-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
    .chg-tbl th{background:#fff3e0;color:#e65100;font-size:11px;text-align:left;padding:5px 8px;}
    .chg-tbl td{padding:5px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top;}
    .chg-old{color:#9e9e9e;text-decoration:line-through;} .chg-new{color:#2e7d32;font-weight:600;}
    .chg-box{border:1px solid #ffe0b2;background:#fffaf3;border-radius:8px;padding:10px 12px;margin-top:10px;}
    .chg-none{border:1px solid #c8e6c9;background:#f1f8e9;border-radius:8px;padding:10px 12px;margin-top:10px;color:#2e7d32;font-weight:600;}
    .chg-new-member{border:1px dashed #90caf9;background:#f3f9ff;border-radius:8px;padding:8px 12px;margin-top:10px;color:#1565c0;font-weight:600;}
    .photo-pair{display:flex;gap:16px;align-items:center;margin-top:8px;} .photo-pair img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #eee;}
    .photo-pair .arrow{font-size:20px;color:#888;}
    .btn-update{background:#2e7d32;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;}
    .btn-update:disabled{opacity:.6;cursor:default;}
    .btn-delete{background:#fff;color:#c62828;border:1px solid #ef9a9a;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;}
    .btn-status{background:#fff;color:#555;border:1px solid #ccc;border-radius:8px;padding:9px 12px;cursor:pointer;}
    .audit-line{font-size:12px;color:#777;margin-top:10px;}
    /* ── Actions ── */
    .detail-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}
    .mem-cards{display:grid;gap:12px;}
    .mem-card{border:1px solid #ececf2;border-radius:10px;padding:14px 16px;background:#fcfcfe;}
    .mem-card-head{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
    .mem-card-name{font-size:14px;font-weight:700;color:#1e2139;margin-bottom:4px;}
    .mem-nick{font-size:12px;font-weight:500;color:#777;}
    .mem-type{font-size:11px;color:#666;margin-left:6px;}
    .mem-photo{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #e0e0e0;flex-shrink:0;}
    .mem-photo-empty{display:flex;align-items:center;justify-content:center;background:#f0f0f4;color:#bbb;font-size:24px;}
    .priv-badge{font-size:10px;color:#b26a00;background:#fff4e0;border:1px solid #ffe0a3;border-radius:8px;padding:1px 6px;margin-left:4px;white-space:nowrap;}
    .btn-approve{padding:9px 22px;background:#2e7d32;color:#fff;border-radius:7px;font-size:13px;font-weight:700;transition:background .15s;}
    .btn-approve:hover{background:#1b5e20;}
    .btn-approve:disabled{opacity:.55;cursor:not-allowed;}
    .btn-approve-signup{padding:9px 22px;background:#673147;color:#fff;border-radius:7px;font-size:13px;font-weight:700;transition:background .15s;}
    .btn-approve-signup:hover{background:#4f2538;}
    .btn-approve-signup:disabled{opacity:.55;cursor:not-allowed;}
    .signup-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:600;}
    .signup-badge.pending{background:#fff3e0;color:#e65100;}
    .signup-badge.approved{background:#e8f5e9;color:#2e7d32;}
    .btn-back{padding:9px 16px;background:#fff;border:1px solid #ddd;border-radius:7px;font-size:13px;color:#555;}
    .btn-back:hover{border-color:#673147;color:#673147;}
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#d0d0d0;border-radius:3px;}
    .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header id="topbar" class="topbar"></header>

    <main class="page-content">
      <div class="page-header">
        <div class="page-title">📝 Membership Requests</div>
        <div class="page-sub">Review families who applied via the public Membership Form — Approve records the decision; Approve and Update applies the submitted changes</div>
      </div>

      <div class="feedback" id="feedbackMsg"></div>

      <!-- Detail panel (hidden until a row is clicked) -->
      <div class="detail-panel" id="detailPanel">
        <div class="detail-header">
          <h3 id="detailTitle">Family Details</h3>
          <button class="btn-close-detail" onclick="closeDetail()" title="Close">✕</button>
        </div>
        <div class="detail-body" id="detailBody"></div>
      </div>

      <!-- List card -->
      <div class="card">
        <div class="card-header">
          <span>📋</span>
          <h3>Membership Requests</h3>
          <div class="filter-bar">
            <label for="statusFilter">Show</label>
            <select id="statusFilter" onchange="renderTable(allRequests)">
              <option value="open" selected>Pending Review + Approved</option>
              <option value="PENDING_REVIEW">Pending Review</option>
              <option value="APPROVED">Approved</option>
              <option value="UPDATED">Updated</option>
              <option value="all">All</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="req-tbl">
            <thead>
              <tr>
                <th>#</th>
                <th>Family Name</th>
                <th>Submitted Form</th>
                <th>Type</th>
                <th>Submitted</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="reqTableBody">
              <tr><td class="empty-row" colspan="6">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <footer id="app-footer" class="app-footer"></footer>
  </div>
</div>

<script>
/* ════ HELPERS ════ */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(s) {
  if (!s) return '—';
  var d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}
/* Formats a phone number for display; always returns escaped HTML. Used by the
   request detail's member table — it was called there but never defined, so
   opening any request with members failed with "Network error". */
function formatPhone(p) {
  if (!p) return '—';
  var d = String(p).replace(/\D/g, '');
  if (d.length === 10) return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
  if (d.length === 11 && d[0] === '1') return '+1 (' + d.slice(1,4) + ') ' + d.slice(4,7) + '-' + d.slice(7);
  return esc(p);
}
function roleClass(role) {
  if (!role) return '';
  var r = role.toLowerCase().replace(/\s+/g, '-');
  return 'role-' + r;
}
function showFeedback(msg, type) {
  var el = document.getElementById('feedbackMsg');
  if (!el) return;
  el.textContent = msg;
  el.className = 'feedback ' + (type || '');
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (type === 'success') setTimeout(function(){ el.className = 'feedback'; el.textContent = ''; }, 5000);
}

/* ════ DATA ════ */
let allRequests = [];

/* ════ INIT ════ */
(async function init() {
  await loadRequests();
})();

async function loadRequests() {
  try {
    const res = await fetch('/api/membership-requests');
    if (!res.ok) { showFeedback('❌ Could not load requests.', 'error'); return; }
    allRequests = await res.json();
    renderTable(allRequests);
  } catch { showFeedback('❌ Network error loading requests.', 'error'); }
}

function statusBadge(st) {
  const key = (st || 'PENDING_REVIEW').toLowerCase();
  const label = { pending_review: 'Pending Review', approved: 'Approved', updated: 'Updated' }[key] || st;
  return `<span class="st-badge st-${key}">${esc(label)}</span>`;
}
function visibleRows(rows) {
  const f = (document.getElementById('statusFilter') || {}).value || 'open';
  if (f === 'all') return rows;
  if (f === 'open') return rows.filter(r => (r.status || 'PENDING_REVIEW') !== 'UPDATED');
  return rows.filter(r => (r.status || 'PENDING_REVIEW') === f);
}
function renderTable(rows) {
  const tbody = document.getElementById('reqTableBody');
  const shown = visibleRows(rows || []);
  if (!shown.length) {
    tbody.innerHTML = `<tr><td class="empty-row" colspan="6">${rows && rows.length ? 'No requests match this filter.' : 'No membership requests yet.'}</td></tr>`;
    return;
  }
  tbody.innerHTML = shown.map((r, i) => {
    const n = r.memberCount != null ? r.memberCount : 0;
    return `
    <tr onclick="openDetail(${r.id})">
      <td>${i + 1}</td>
      <td style="font-weight:600;">${esc(r.familyName||'')}</td>
      <td><button type="button" class="link-review" onclick="event.stopPropagation(); openDetail(${r.id})" title="Open the submitted membership form">Review Submitted Form (${n} member${n === 1 ? '' : 's'})</button></td>
      <td>${r.hasExistingFamily
            ? '<span style="background:#e3f2fd;color:#1565c0;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;">Renewal / Update</span>'
            : '<span style="background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;">New Member</span>'}</td>
      <td>${fmtDate(r.createdDate)}</td>
      <td>${statusBadge(r.status)}</td>
    </tr>`; }).join('');
}

/* ════ DETAIL ════ */
async function openDetail(id) {
  try {
    const res  = await fetch(`/api/membership-requests/${id}`);
    if (!res.ok) { showFeedback('❌ Could not load details.', 'error'); return; }
    const data = await res.json();
    renderDetail(data);
    document.getElementById('detailPanel').classList.add('open');
    document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch { showFeedback('❌ Network error.', 'error'); }
}

function renderDetail(d) {
  document.getElementById('detailTitle').textContent = d.familyName || 'Family Details';
  const members = d.members || [];
  const head = members.find(m => /^head/i.test(m.role || '')) || members[0] || {};
  const dash = '<span style="color:#aaa;">—</span>';
  function val(v) { return (v === null || v === undefined || String(v).trim() === '') ? dash : esc(String(v)); }
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function mdy(mo, da, yr) {
    if (!mo && !da && !yr) return dash;
    const mm = mo ? (MONTHS[Number(mo) - 1] || mo) : '?';
    return esc([mm, da ? String(da) : null].filter(Boolean).join(' ') + (yr ? ', ' + yr : ''));
  }
  function addrOf(o) { return [o.address1, o.address2, o.city, o.state, o.country, o.pinCode].filter(x => x && String(x).trim()).join(', '); }
  function priv(flag) { return flag ? ' <span class="priv-badge" title="The applicant asked to keep this private">🔒 private</span>' : ''; }
  const familyAddr = addrOf({ address1: d.familyAddress1, address2: d.familyAddress2, city: d.familyCity, state: d.familyState, country: d.familyCountry, pinCode: d.familyPinCode });
  function field(label, html) { return `<div class="detail-field"><label>${label}</label><span>${html}</span></div>`; }

  // One card per member: everything the applicant submitted, blanks shown as "—".
  const memCards = members.length
    ? members.map((m, i) => {
        const name = [m.firstName, m.middleName, m.lastName].filter(x => x && String(x).trim()).join(' ');
        const own = m.sameAsFamilyAddress === false;
        const addrHtml = own
          ? (addrOf(m) ? esc(addrOf(m)) : dash) + ' <span style="font-size:11px;color:#888;">(own address)</span>'
          : '<span style="color:#555;">Same as family address</span>' + (familyAddr ? ' — ' + esc(familyAddr) : '');
        const photo = m.hasPhoto && m.photoData && /^data:image\//.test(m.photoData)
          ? `<img src="${m.photoData}" alt="Photo" class="mem-photo" />`
          : m.photoUnsupported
            ? `<div class="mem-photo mem-photo-empty" title="A ${esc(m.photoUnsupported)} photo was submitted, which cannot be displayed or saved. Ask the applicant for a JPG or PNG.">⚠️</div>`
            : `<div class="mem-photo mem-photo-empty" title="No photo submitted">👤</div>`;
        return `
        <div class="mem-card">
          <div class="mem-card-head">
            ${photo}
            <div>
              <div class="mem-card-name">${esc(name || '(no name)')}${m.otherName ? ' <span class="mem-nick">“' + esc(m.otherName) + '”</span>' : ''}</div>
              <div><span class="role-badge ${roleClass(m.role)}">${esc(m.role || '—')}</span>
                   <span class="mem-type">${esc(m.memberType || 'Guest')}</span></div>
            </div>
          </div>
          <div class="detail-grid" style="margin-bottom:0;">
            ${field('Gender', val(m.gender))}
            ${field('Date of Birth', mdy(m.birthdayMonth, m.birthdayDay, m.birthdayYear))}
            ${field('Wedding Anniversary', mdy(m.anniversaryMonth, m.anniversaryDay, m.anniversaryYear))}
            ${field('Nickname / Other Name', val(m.otherName))}
            ${field('Phone', (m.phone ? esc(formatPhone(m.phone)) : dash) + priv(m.phonePrivate))}
            ${field('Email', val(m.email) + priv(m.emailPrivate))}
            <div class="detail-field" style="grid-column:1 / -1;"><label>Address</label><span>${addrHtml}${priv(m.addressPrivate)}</span></div>
            ${m.comments ? `<div class="detail-field" style="grid-column:1 / -1;"><label>Comments</label><span>${esc(m.comments)}</span></div>` : ''}
          </div>
        </div>`;
      }).join('')
    : `<div style="text-align:center;color:#bbb;padding:12px;">No members found.</div>`;

  // Build signup account section if signup exists
  const signupSection = d.signupId ? `
    <div style="background:#f5f6fa;border:1px solid #e0e0e0;border-radius:8px;padding:14px 16px;margin-top:12px;">
      <div style="font-size:13px;font-weight:700;color:#673147;margin-bottom:10px;">🔐 Login Account Request</div>
      <div class="detail-grid" style="margin-bottom:0;">
        <div class="detail-field"><label>Username</label><span>${esc(d.signupUsername||'—')}</span></div>
        <div class="detail-field"><label>Account Status</label>
          <span>
            ${d.signupActive
              ? '<span class="signup-badge approved">✅ Approved / Active</span>'
              : '<span class="signup-badge pending">⏳ Pending Approval</span>'}
          </span>
        </div>
      </div>
    </div>` : '';

  const canApprove = !(window.CGP_PERMS && window.CGP_PERMS['admin.membership'] === false);
  const canDelete  = canApprove && !(window.CGP_PERMS && window.CGP_PERMS['admin.membership.delete'] === false);
  const isExisting = !!d.hasExistingFamily;
  const status = d.status || 'PENDING_REVIEW';
  const isUpdated = status === 'UPDATED';
  currentDetail = d;

  // What "Approve and Update" would change — computed by the server with the same
  // matching rules the update uses, so this is exactly what will happen.
  const changesSection = renderChanges(d);

  const approveBtn = canApprove && status === 'PENDING_REVIEW'
    ? `<button class="btn-approve" id="approveBtn_${d.id}" onclick="approveMembership(${d.id}, this)" title="Mark as approved. The family record is not changed — update it on the Family page if needed.">✅ Approve</button>` : '';
  const updateBtn = canApprove && !isUpdated
    ? `<button class="btn-update" id="updateBtn_${d.id}" onclick="applyMembership(${d.id}, this)" title="${isExisting ? 'Apply the submitted changes to the existing family record' : 'Create the family and its members'}">${isExisting ? '✅ Approve and Update' : '✅ Approve and Add as Member'}</button>` : '';
  const statusBtn = canApprove && status !== 'PENDING_REVIEW'
    ? `<button class="btn-status" onclick="changeStatus(${d.id}, 'PENDING_REVIEW', this)" title="Set the request back to Pending Review (keeps any changes already applied)">↩ Back to Pending Review</button>`
      + (isUpdated ? ` <button class="btn-status" onclick="changeStatus(${d.id}, 'APPROVED', this)" title="Record the status as Approved (keeps the changes already applied)">↩ Set to Approved</button>` : '')
    : '';
  const deleteBtn = canDelete ? `<button class="btn-delete" onclick="deleteRequest(${d.id}, this)">🗑 Delete Request</button>` : '';
  const audit = [
    d.statusChangedBy ? `${statusBadge(status)} by ${esc(d.statusChangedBy)} on ${fmtDate(d.statusChangedAt)}` : statusBadge(status),
    d.appliedAt ? `Applied by ${esc(d.appliedBy || '—')} on ${fmtDate(d.appliedAt)}${d.appliedFamilyId ? ' (family #' + d.appliedFamilyId + ')' : ''}` : ''
  ].filter(Boolean).join(' · ');

  const approveSignupBtn = canApprove && d.signupId && !d.signupActive && isExisting
    ? `<button class="btn-approve-signup" id="approveSignupBtn_${d.id}" onclick="approveSignup(${d.id}, this)">
         🔐 Approve Login Account
       </button>`
    : '';

  document.getElementById('detailBody').innerHTML = `
    <div class="detail-grid">
      ${field('Family Name', val(d.familyName))}
      ${field('Request Type', isExisting
        ? '<span style="background:#e3f2fd;color:#1565c0;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;">Renewal / Update</span>'
        : '<span style="background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;">New Member</span>')}
      <div class="detail-field" style="grid-column:1 / -1;"><label>Family Address</label><span>${familyAddr ? esc(familyAddr) : dash}${priv(head.addressPrivate)}</span></div>
      ${field('Family Phone', (d.familyPhone ? esc(formatPhone(d.familyPhone)) : dash) + priv(head.phonePrivate))}
      ${field('Family Email', val(d.familyEmail) + priv(head.emailPrivate))}
      ${field('Submitted', fmtDate(d.createdDate))}
      ${field('Declaration', d.declarationAccepted ? '✅ Accepted' : dash)}
      ${field('Status', statusBadge(status))}
    </div>
    ${changesSection}
    <h4 style="font-size:13px;font-weight:700;color:#673147;margin:16px 0 8px;">Family Members (${members.length})</h4>
    <p style="font-size:12px;color:#888;margin:0 0 10px;">Everything submitted on the membership form is shown below; “—” means the applicant left it blank.</p>
    <div class="mem-cards">${memCards}</div>
    ${signupSection}
    <div class="detail-actions">
      ${approveBtn}
      ${updateBtn}
      ${approveSignupBtn}
      ${statusBtn}
      ${deleteBtn}
      <button class="btn-back" onclick="closeDetail()">← Back to List</button>
    </div>
    <div class="audit-line">${audit}</div>`;
}

/* The server's preview: per submitted member, the matched existing member and the field changes. */
function renderChanges(d) {
  const p = d.preview;
  if (!p || !p.isExisting) return '';
  if (p.familyMissing) return `<div class="chg-box">⚠ The family this request refers to no longer exists in your church. Approve and Update is not possible; approve or delete the request.</div>`;
  const rows = p.members || [];
  if (!p.hasChanges) return `<div class="chg-none">✔ Renewal without profile changes — the submitted form matches the family record.</div>`;
  const dash = '<span style="color:#aaa;">—</span>';
  function fmtVal(v) { return (v === null || v === undefined || String(v).trim() === '') ? dash : esc(String(v)); }
  const parts = rows.map(m => {
    if (m.matchType === 'NEW') return `<div class="chg-new-member">＋ New member: ${esc(m.name || '(no name)')} — will be added to the family</div>`;
    const ch = m.changes || [];
    const sub = (d.members || []).find(x => x.id === m.requestMemberId) || {};
    if (!ch.length && !m.photoChanged && !sub.photoUnsupported) return '';
    const tbl = ch.length ? `<table class="chg-tbl"><thead><tr><th>Field</th><th>Current</th><th>Submitted</th></tr></thead><tbody>${
      ch.map(c => `<tr><td>${esc(c.label)}</td><td class="chg-old">${fmtVal(c.oldValue)}</td><td class="chg-new">${fmtVal(c.newValue)}</td></tr>`).join('')}</tbody></table>` : '';
    // Shown only when the server found a usable new photo AND the page has it to display.
    const photo = m.photoChanged && sub.photoData ? `<div class="photo-pair">
        ${m.existingPhotoData ? `<img src="${m.existingPhotoData}" alt="Current photo" />` : '<div class="mem-photo mem-photo-empty" title="No current photo">👤</div>'}
        <span class="arrow">→</span>
        <img src="${sub.photoData}" alt="New photo" />
        <span style="font-size:12px;color:#555;">${m.existingPhotoData ? 'Profile photo will be replaced' : 'Profile photo will be added'}</span></div>` : '';
    const who = m.existingName && m.existingName !== m.name ? ` <span style="font-size:12px;color:#888;">(matches ${esc(m.existingName)}${m.matchType === 'ROLE' ? ' by role' : ''})</span>` : '';
    const unsupported = sub.photoUnsupported ? `<div style="font-size:12px;color:#b26a00;margin-top:6px;">⚠️ A ${esc(sub.photoUnsupported)} photo was submitted but cannot be displayed or saved (not a JPG/PNG) — the current photo is kept.</div>` : '';
    return `<div style="margin-top:8px;"><strong>${esc(m.name || '(no name)')}</strong>${who}${tbl}${photo}${unsupported}</div>`;
  }).filter(Boolean).join('');
  return `<div class="chg-box"><div style="font-weight:700;color:#e65100;">Changes to the existing family record</div>
    <div style="font-size:12px;color:#777;">Only these fields change when you click Approve and Update. Blank submitted fields never clear existing values.</div>${parts}</div>`;
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
}

/* ════ ACTIONS ════ */
let currentDetail = null;

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  let data = {}; try { data = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, data };
}

/* Approve = status only. Nothing on the family record changes. */
async function approveMembership(id, btn) {
  const d = currentDetail || {};
  const msg = d.hasExistingFamily
    ? 'Mark this request as Approved?\n\nThe existing family/member record will NOT be changed and the renewal date will not be updated. You can apply the submitted changes manually on the Family page, or use "Approve and Update" to apply them automatically.'
    : 'Mark this request as Approved?\n\nNo family record will be created yet. Use "Approve and Add as Member" to add the family, or add them manually on the Family page.';
  if (!confirm(msg)) return;
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Processing…';
  try {
    const r = await post(`/api/membership-requests/${id}/approve`);
    if (r.ok) { showFeedback('✅ Request approved. The family record was not changed.', 'success'); await loadRequests(); await openDetail(id); }
    else { showFeedback('❌ ' + (r.data.error || 'Approval failed.'), 'error'); btn.disabled = false; btn.textContent = label; }
  } catch { showFeedback('❌ Network error.', 'error'); btn.disabled = false; btn.textContent = label; }
}

/* Approve and Update = apply the submitted changes in one transaction, then status → Updated. */
async function applyMembership(id, btn) {
  const d = currentDetail || {};
  const p = d.preview || {};
  let msg;
  if (!d.hasExistingFamily) {
    msg = 'This will create a new family with the submitted members (Member Type "Member") and set its membership renewal date. Do you want to continue?';
  } else if (p.hasChanges === false) {
    msg = 'No profile changes were submitted. This action will update the membership renewal date. Do you want to continue?';
  } else {
    msg = 'This will update the existing family/member record with the requested changes and update the membership renewal date. Do you want to continue?';
  }
  if (!confirm(msg)) return;
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Updating…';
  try {
    const r = await post(`/api/membership-requests/${id}/apply`);
    if (r.ok) {
      const a = r.data;
      const what = a.isExisting
        ? (a.hadChanges ? `✅ Family record updated (${a.updated} member${a.updated === 1 ? '' : 's'} changed, ${a.created} added) and the renewal date set.`
                        : '✅ Renewal recorded — no profile changes; the renewal date was updated.')
        : `✅ Family added with ${a.created} member${a.created === 1 ? '' : 's'}.`;
      showFeedback(what, 'success'); await loadRequests(); await openDetail(id);
    } else {
      showFeedback('❌ ' + (r.data.error || 'The update could not be completed; nothing was changed.'), 'error');
      btn.disabled = false; btn.textContent = label;
    }
  } catch { showFeedback('❌ Network error. Nothing was changed.', 'error'); btn.disabled = false; btn.textContent = label; }
}

async function changeStatus(id, to, btn) {
  const d = currentDetail || {};
  const warn = (d.status === 'UPDATED')
    ? 'Changing the status does NOT undo the changes already applied to the family record. Continue?'
    : `Set this request to ${to === 'PENDING_REVIEW' ? 'Pending Review' : 'Approved'}?`;
  if (!confirm(warn)) return;
  btn.disabled = true;
  try {
    const r = await post(`/api/membership-requests/${id}/status`, { status: to });
    if (r.ok) { showFeedback('✅ Status updated.', 'success'); await loadRequests(); await openDetail(id); }
    else { showFeedback('❌ ' + (r.data.error || 'Could not change the status.'), 'error'); btn.disabled = false; }
  } catch { showFeedback('❌ Network error.', 'error'); btn.disabled = false; }
}

async function deleteRequest(id, btn) {
  if (!confirm('Are you sure you want to delete this membership request? This action will remove the request from the Membership Requests page but will not delete the associated family or member record.')) return;
  btn.disabled = true;
  try {
    const res = await fetch(`/api/membership-requests/${id}`, { method: 'DELETE' });
    let data = {}; try { data = await res.json(); } catch {}
    if (res.ok) { closeDetail(); showFeedback('✅ Request deleted. The family record was not changed.', 'success'); await loadRequests(); }
    else { showFeedback('❌ ' + (data.error || 'Could not delete the request.'), 'error'); btn.disabled = false; }
  } catch { showFeedback('❌ Network error.', 'error'); btn.disabled = false; }
}

/* ▄▄▄▄ APPROVE SIGNUP ▄▄▄▄ */
async function approveSignup(id, btn) {
  if (!confirm("Activate this member's login account? They will be able to log in immediately.")) return;
  btn.disabled = true; btn.textContent = 'Processing…';
  try {
    const res  = await fetch(`/api/membership-requests/${id}/approve-signup`, { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
      closeDetail();
      showFeedback('✅ Login account activated! The member can now log in.', 'success');
      await loadRequests();
    } else {
      showFeedback('❌ ' + (data.error || 'Could not activate account.'), 'error');
      btn.disabled = false; btn.textContent = '🔐 Approve Login Account';
    }
  } catch {
    showFeedback('❌ Network error.', 'error');
    btn.disabled = false; btn.textContent = '🔐 Approve Login Account';
  }
}
