<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/mobile.css" />
  <link rel="stylesheet" href="/shell.css" />
  <title>Connect Submissions — Church Genius Pro</title>
  <style>
    *,*::before,*::after { box-sizing:border-box; }
    button { cursor:pointer; font-family:inherit; border:none; background:none; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f6fa; color:#333; }
    .page-title { font-size:20px; font-weight:800; color:#1e2139; }
    .page-subtitle { font-size:13px; color:#9fa8c4; margin:2px 0 16px; }
    .card { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,.07); overflow:hidden; }
    .card-header { display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid #eef0f6; background:#fafbfe; flex-wrap:wrap; }
    .card-header h2 { font-size:14px; font-weight:700; color:#1e2139; flex:1; }
    .tabs { display:flex; gap:6px; flex-wrap:wrap; }
    .tab { padding:6px 13px; border-radius:18px; font-size:12px; font-weight:600; border:1.5px solid #dde0ec; color:#666; background:#fff; }
    .tab.active { background:#673147; color:#fff; border-color:#673147; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:12.5px; }
    th { background:#f5f6fb; font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:#9fa8c4; padding:9px 10px; text-align:left; border-bottom:2px solid #eef0f8; white-space:nowrap; }
    td { padding:9px 10px; border-bottom:1px solid #f3f4f9; vertical-align:top; }
    select, input[type=text], input[type=date], textarea { border:1.5px solid #dde0ec; border-radius:7px; padding:5px 7px; font-size:12px; background:#fff; font-family:inherit; }
    .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700; white-space:nowrap; }
    .st-New { background:#e3f2fd; color:#1565c0; } .st-Assigned { background:#ede7f6; color:#5e35b1; }
    .st-InProgress { background:#fff8e1; color:#b28704; } .st-Contacted { background:#e8f5e9; color:#2e7d32; }
    .st-Closed { background:#eceff1; color:#607d8b; }
    .btn-sec { background:#f0f2f8; color:#555; border-radius:7px; padding:5px 9px; font-size:11.5px; font-weight:600; }
    .btn-primary { background:#673147; color:#fff; border-radius:7px; padding:6px 12px; font-size:12px; font-weight:600; }
    .btn-danger { color:#c62828; border:1.5px solid #f3c2c2; background:#fff; border-radius:7px; padding:4px 9px; font-size:11.5px; }
    .feedback { padding:10px 16px; border-radius:9px; font-size:13px; margin-bottom:14px; display:none; }
    .feedback.ok { display:block; background:#e8f5e9; color:#2e7d32; } .feedback.err { display:block; background:#ffebee; color:#c62828; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:1000; }
    .modal-overlay.open { display:flex; }
    .modal { background:#fff; border-radius:14px; width:560px; max-width:94vw; max-height:88vh; overflow:auto; }
    .modal-h { display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid #eef0f6; }
    .modal-h h3 { flex:1; font-size:15px; margin:0; } .modal-b { padding:18px; }
    .detail-grid { display:grid; grid-template-columns:130px 1fr; gap:5px 12px; font-size:13px; margin-bottom:14px; }
    .detail-grid .k { color:#9fa8c4; font-size:11px; text-transform:uppercase; letter-spacing:.3px; padding-top:2px; }
    .fu { border-left:3px solid #673147; background:#faf7f9; padding:8px 10px; border-radius:6px; margin-bottom:8px; font-size:12.5px; }
    .fu .meta { font-size:11px; color:#999; margin-top:3px; }
    .fu .st { font-weight:700; font-size:10.5px; }
    .fu .st.PENDING { color:#b28704; } .fu .st.COMPLETED { color:#2e7d32; } .fu .st.MISSED { color:#c62828; }
    .sect-label { font-size:11px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:#673147; margin:14px 0 8px; }
    @media (max-width:640px){ .detail-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <header id="topbar" class="topbar"></header>
    <main class="page-content">
      <div class="page-title">🤝 Connect Submissions</div>
      <div class="page-subtitle">People who reached out through the public "Connect With Us" page</div>
      <div id="fb" class="feedback"></div>

      <div class="card">
        <div class="card-header">
          <h2>Submissions</h2>
          <div class="tabs" id="statusTabs"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Name</th><th>Contact</th><th>Submitted</th><th>Status</th>
              <th>Assigned To</th><th>Confirmation</th><th>Actions</th>
            </tr></thead>
            <tbody id="rows"><tr><td colspan="7" style="text-align:center;color:#999;padding:22px;">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Detail / manage modal -->
<div class="modal-overlay" id="dModal" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-h"><h3 id="dTitle">Submission</h3><button class="btn-sec" onclick="closeDetail()">✕</button></div>
    <div class="modal-b">
      <div class="detail-grid" id="dGrid"></div>

      <div class="sect-label">Assignment</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <select id="assigneeSel" style="min-width:220px;"><option value="">— Select volunteer / staff —</option></select>
        <button class="btn-primary" onclick="saveAssign()">Assign</button>
        <button class="btn-sec" onclick="saveAssign(true)">Unassign</button>
      </div>

      <div class="sect-label">Status</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="statusSel">
          <option>New</option><option>Assigned</option><option>InProgress</option>
          <option>Contacted</option><option>Closed</option>
        </select>
        <button class="btn-primary" onclick="saveStatus()">Update Status</button>
      </div>

      <div class="sect-label">Follow-Ups</div>
      <div id="fuList" style="max-height:220px;overflow-y:auto;"><span style="color:#999;font-size:12px;">Loading…</span></div>
      <div style="margin-top:10px;display:grid;gap:6px;">
        <input type="text" id="fuTitle" placeholder="Follow-up title (e.g. Call to welcome)" />
        <textarea id="fuNotes" rows="2" placeholder="Notes…"></textarea>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <label style="font-size:12px;color:#666;">Due</label><input type="date" id="fuDue" />
          <select id="fuPriority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>URGENT</option></select>
          <button class="btn-primary" onclick="addFollowUp()">+ Add Follow-Up</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
window.CGP_PAGE = { activePage: 'admin/connect-submissions', pageTitle: 'Connect Submissions', openSection: 'admin' };
</script>
<script src="/shell.js"></script>
<script src="/session.js"></script>
<script>
(function(){
  var all = [], filter = 'ALL', current = null, assignees = [];
  var STATUSES = ['ALL','New','Assigned','InProgress','Contacted','Closed'];

  function esc(s){ var d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
  function fb(msg, ok){ var el=document.getElementById('fb'); el.textContent=msg; el.className='feedback '+(ok?'ok':'err');
    setTimeout(function(){ el.className='feedback'; }, 4000); }
  function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }

  function renderTabs(){
    document.getElementById('statusTabs').innerHTML = STATUSES.map(function(s){
      var n = s==='ALL' ? all.length : all.filter(function(x){return x.status===s;}).length;
      return '<button class="tab'+(filter===s?' active':'')+'" onclick="setFilter(\''+s+'\')">'+s+' ('+n+')</button>';
    }).join('');
  }
  window.setFilter = function(s){ filter=s; renderTabs(); renderRows(); };

  function renderRows(){
    var rows = filter==='ALL' ? all : all.filter(function(x){return x.status===filter;});
    var tb = document.getElementById('rows');
    if (!rows.length){ tb.innerHTML='<tr><td colspan="7" style="text-align:center;color:#999;padding:22px;">No submissions.</td></tr>'; return; }
    tb.innerHTML = rows.map(function(s){
      var name = ((s.firstName||'')+' '+(s.lastName||'')).trim() || '(no name)';
      var contact = [s.email, s.phone].filter(Boolean).map(esc).join('<br>') || '—';
      return '<tr>'
        +'<td><b>'+esc(name)+'</b></td>'
        +'<td>'+contact+'</td>'
        +'<td style="white-space:nowrap;">'+esc(fmtDate(s.createdAt))+'</td>'
        +'<td><span class="pill st-'+esc(s.status)+'">'+esc(s.status)+'</span></td>'
        +'<td>'+esc(s.assignedTo||'—')+'</td>'
        +'<td style="font-size:11px;color:#888;">'+esc(s.confirmationSent||'—')+'</td>'
        +'<td style="white-space:nowrap;">'
          +'<button class="btn-sec" onclick="openDetail('+s.id+')">Manage</button> '
          +'<button class="btn-danger" onclick="del('+s.id+')">Delete</button>'
        +'</td></tr>';
    }).join('');
  }

  function load(){
    fetch('/api/connect-admin').then(function(r){return r.json();}).then(function(d){
      all = Array.isArray(d) ? d : [];
      renderTabs(); renderRows();
    }).catch(function(){ fb('Failed to load submissions.', false); });
  }

  function loadAssignees(){
    fetch('/api/followups/assignees').then(function(r){return r.json();}).then(function(d){
      assignees = Array.isArray(d) ? d : (d.assignees || []);
      var sel = document.getElementById('assigneeSel');
      sel.innerHTML = '<option value="">— Select volunteer / staff —</option>' + assignees.map(function(a){
        return '<option value="'+a.id+'" data-name="'+esc(a.name)+'">'+esc(a.name)+(a.type?' ('+esc(a.type)+')':'')+'</option>';
      }).join('');
    }).catch(function(){});
  }

  window.openDetail = function(id){
    current = all.find(function(x){return x.id===id;});
    if (!current) return;
    var name = ((current.firstName||'')+' '+(current.lastName||'')).trim() || '(no name)';
    document.getElementById('dTitle').textContent = name;
    var g = [
      ['Submitted', fmtDate(current.createdAt)], ['Status', current.status],
      ['Email', current.email], ['Phone', current.phone], ['Address', current.address],
      ['Gender', current.gender], ['Marital Status', current.maritalStatus],
      ['Birth Date', current.birthDate], ['Contact Prefs', current.contactPreferences],
      ['How They Heard', current.howHeard], ['Assigned To', current.assignedTo],
      ['Confirmation', current.confirmationSent]
    ];
    document.getElementById('dGrid').innerHTML = g.map(function(p){
      return '<div class="k">'+esc(p[0])+'</div><div>'+esc(p[1]||'—')+'</div>';
    }).join('');
    document.getElementById('statusSel').value = current.status || 'New';
    var sel = document.getElementById('assigneeSel');
    sel.value = current.assignedMemberId != null ? String(current.assignedMemberId) : '';
    document.getElementById('dModal').classList.add('open');
    loadFollowUps();
  };
  window.closeDetail = function(){ document.getElementById('dModal').classList.remove('open'); current=null; };

  function loadFollowUps(){
    if (!current) return;
    var el = document.getElementById('fuList');
    el.innerHTML = '<span style="color:#999;font-size:12px;">Loading…</span>';
    fetch('/api/followups/linked?linkedType=CONNECT&linkedId='+current.id)
      .then(function(r){return r.json();}).then(function(d){
        var list = Array.isArray(d) ? d : (d.followUps || []);
        if (!list.length){ el.innerHTML='<span style="color:#999;font-size:12px;">No follow-ups yet.</span>'; return; }
        el.innerHTML = list.map(function(f){
          return '<div class="fu"><b>'+esc(f.title||'')+'</b>'
            +(f.description?'<div>'+esc(f.description)+'</div>':'')
            +'<div class="meta"><span class="st '+esc(f.status||'')+'">'+esc(f.status||'')+'</span>'
            +(f.dueDate?' · due '+esc(f.dueDate):'')
            +(f.assignedTo?' · '+esc(f.assignedTo):'')
            +(f.createdAt?' · '+esc(fmtDate(f.createdAt)):'')+'</div></div>';
        }).join('');
      }).catch(function(){ el.innerHTML='<span style="color:#c62828;font-size:12px;">Failed to load follow-ups.</span>'; });
  }

  window.saveAssign = function(clear){
    if (!current) return;
    var sel = document.getElementById('assigneeSel');
    var body = clear ? {} : { memberId: sel.value || null,
        memberName: sel.selectedOptions[0] ? sel.selectedOptions[0].getAttribute('data-name') : null };
    if (!clear && !sel.value){ fb('Choose a person to assign first.', false); return; }
    fetch('/api/connect-admin/'+current.id+'/assign', { method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        if (res.ok){ fb(clear?'Unassigned.':'Assigned.', true); load(); closeDetail(); }
        else fb(res.j.error||'Failed.', false);
      }).catch(function(){ fb('Network error.', false); });
  };

  window.saveStatus = function(){
    if (!current) return;
    fetch('/api/connect-admin/'+current.id+'/status', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ status: document.getElementById('statusSel').value }) })
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        if (res.ok){ fb('Status updated.', true); load(); closeDetail(); }
        else fb(res.j.error||'Failed.', false);
      }).catch(function(){ fb('Network error.', false); });
  };

  window.addFollowUp = function(){
    if (!current) return;
    var title = document.getElementById('fuTitle').value.trim();
    if (!title){ fb('Enter a follow-up title.', false); return; }
    var name = ((current.firstName||'')+' '+(current.lastName||'')).trim();
    var body = { title: title, description: document.getElementById('fuNotes').value.trim(),
      dueDate: document.getElementById('fuDue').value || null,
      priority: document.getElementById('fuPriority').value,
      assignedTo: current.assignedTo || null,
      linkedType: 'CONNECT', linkedId: current.id, linkedLabel: 'Connect: '+name };
    fetch('/api/followups', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        if (res.ok){ document.getElementById('fuTitle').value=''; document.getElementById('fuNotes').value='';
          document.getElementById('fuDue').value=''; fb('Follow-up added.', true); loadFollowUps(); }
        else fb(res.j.error||'Failed to add follow-up.', false);
      }).catch(function(){ fb('Network error.', false); });
  };

  window.del = function(id){
    if (!confirm('Delete this submission? The visitor record and follow-ups are kept.')) return;
    fetch('/api/connect-admin/'+id, { method:'DELETE' })
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        if (res.ok){ fb('Deleted.', true); load(); } else fb(res.j.error||'Failed.', false);
      }).catch(function(){ fb('Network error.', false); });
  };

  load(); loadAssignees();
})();
</script>
</body>
</html>
