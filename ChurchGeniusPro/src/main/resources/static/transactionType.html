<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cgp-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#673147" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/mobile.css" />
    <link rel="stylesheet" href="/shell.css" />
  <title>Church Genius Pro – Transaction Type</title>
  <style>
    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: #f5f6fa; color: #333; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }

    /* ── App Shell ──────────────────────────────────────── */
    

    /* ── Sidebar ────────────────────────────────────────── */
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    

    /* ── Main area ──────────────────────────────────────── */
    

    /* ── Top-bar ────────────────────────────────────────── */
    
    
    
    
    .search-wrap {
      display: flex; align-items: center; gap: 8px;
      background: #f5f6fa; border: 1px solid #e8e8e8;
      border-radius: 20px; padding: 7px 16px;
    }
    .search-wrap input { border: none; background: none; outline: none; font-size: 13px; color: #333; width: 185px; }
    .search-wrap input::placeholder { color: #bbb; }
    .search-icon { color: #bbb; font-size: 14px; }
    .tb-link    { font-size: 13px; color: #555; }
    .tb-link:hover { color: #673147; }
    .tb-dropdown { font-size: 13px; color: #673147; font-weight: 600; display: flex; align-items: center; gap: 3px; }
    .btn-admin-settings { font-size: 13px; background: transparent; color: #673147; border: 1px solid #c5a0b5; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 600; transition: background .15s, color .15s, border-color .15s; }
    .btn-admin-settings:hover { background: #673147; color: #fff; border-color: #673147; }
    
    

    /* ── Page content ───────────────────────────────────── */
    

    /* ── Page header ─────────────────────────────────────── */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-title  { font-size: 22px; font-weight: 700; color: #673147; }
    .page-subtitle { font-size: 13px; color: #aaa; margin-top: 3px; }

    /* ── Help note ───────────────────────────────────────── */
    .help-note {
      background: #e8eaf6; border: 1px solid #c5cae9; border-left: 4px solid #673147;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .help-note-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .help-note-text { font-size: 13px; color: #444; line-height: 1.6; }

    /* ── Feedback ───────────────────────────────────────── */
    .feedback {
      padding: 12px 20px; border-radius: 7px;
      font-size: 13px; font-weight: 500; margin-bottom: 18px; display: none;
    }
    .feedback.error   { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; display: block; }
    .feedback.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }

    /* ── Add card ────────────────────────────────────────── */
    .add-card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      padding: 22px 24px; margin-bottom: 20px;
    }
    .add-card-title {
      font-size: 13px; font-weight: 700; color: #673147;
      text-transform: uppercase; letter-spacing: .6px;
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 1px solid #e8eaf6;
    }
    .add-row { display: flex; align-items: flex-end; gap: 14px; }
    .add-field { flex: 1; max-width: 420px; display: flex; flex-direction: column; gap: 5px; }
    .add-field label {
      font-size: 13px; font-weight: 600; color: #666;
      text-transform: uppercase; letter-spacing: .4px;
    }
    .required-star { color: #e53935; margin-left: 2px; }
    .add-field input {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid #e0e0e0; border-radius: 7px;
      font-size: 14px; color: #333; outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff; font-family: inherit;
    }
    .add-field input::placeholder { color: #bbb; }
    .add-field input:focus { border-color: #673147; box-shadow: 0 0 0 3px rgba(103,49,71,.1); }
    .add-field input.invalid { border-color: #e53935; }
    .field-hint { font-size: 11px; color: #e53935; min-height: 14px; }
    .btn-add {
      padding: 10px 26px; border-radius: 7px;
      font-size: 14px; font-weight: 600; color: #fff;
      background: #673147; cursor: pointer; transition: background .18s;
      white-space: nowrap; flex-shrink: 0;
    }
    .btn-add:hover { background: #4a5aae; }
    .btn-add:disabled { opacity: .65; cursor: not-allowed; }

    /* ── Card / Table ────────────────────────────────────── */
    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.07); overflow: hidden; }
    .table-wrap { overflow-x: auto; }
    .tt-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tt-table th {
      text-align: left; padding: 12px 16px;
      font-size: 11px; font-weight: 700; color: #888;
      text-transform: uppercase; letter-spacing: .5px;
      border-bottom: 2px solid #f0f0f0; white-space: nowrap;
    }
    .tt-table td { padding: 13px 16px; border-bottom: 1px solid #f5f5f5; color: #333; vertical-align: middle; }
    .tt-table tr:last-child td { border-bottom: none; }
    .tt-table tr:hover td { background: #fafbff; }
    .tt-name { font-weight: 500; font-size: 14px; }
    .row-num { font-size: 13px; color: #ccc; }

    /* ── Row actions ─────────────────────────────────────── */
    .actions { display: flex; gap: 6px; }
    .btn-action {
      padding: 4px 10px; border-radius: 6px; font-size: 16px; line-height: 1;
      font-weight: 500; cursor: pointer;
      transition: background .18s, color .18s;
      border: 1.5px solid transparent; white-space: nowrap;
    }
    .btn-edit    { background: #673147; color: #fff; border-color: #673147; }
    .btn-edit:hover    { background: #3949ab; border-color: #3949ab; }
    .btn-delete  { background: #673147; color: #fff; border-color: #673147; }
    .btn-delete:hover  { background: #3949ab; border-color: #3949ab; }

    /* ── Empty state ─────────────────────────────────────── */
    .empty-state { text-align: center; padding: 52px 20px; color: #bbb; }
    .empty-icon  { font-size: 44px; margin-bottom: 14px; }
    .empty-text  { font-size: 14px; }

    /* ── Modal overlay ───────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 500;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    /* ── Modal box ───────────────────────────────────────── */
    .modal-box {
      background: #fff; border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,.22);
      width: 440px; max-width: calc(100vw - 40px);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; background: #673147; flex-shrink: 0;
    }
    .modal-title { font-size: 15px; font-weight: 700; color: #fff; }
    .modal-close {
      font-size: 20px; color: rgba(255,255,255,.8); cursor: pointer;
      line-height: 1; padding: 2px 6px; border-radius: 4px; transition: background .18s;
    }
    .modal-close:hover { background: rgba(255,255,255,.18); color: #fff; }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 14px 24px; border-top: 1px solid #f0f0f0;
      display: flex; justify-content: flex-end; gap: 12px; flex-shrink: 0;
    }

    /* ── Modal form field ────────────────────────────────── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 13px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: .4px; }
    .field input {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid #e0e0e0; border-radius: 7px;
      font-size: 14px; color: #333; outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff; font-family: inherit;
    }
    .field input::placeholder { color: #bbb; }
    .field input:focus { border-color: #673147; box-shadow: 0 0 0 3px rgba(103,49,71,.1); }
    .field input.invalid { border-color: #e53935; }

    /* ── Modal buttons ───────────────────────────────────── */
    .btn-cancel {
      padding: 10px 26px; border-radius: 7px;
      font-size: 14px; font-weight: 500; color: #666;
      border: 1.5px solid #e0e0e0; cursor: pointer; transition: background .18s;
    }
    .btn-cancel:hover { background: #f5f6fa; }
    .btn-save-modal {
      padding: 10px 32px; border-radius: 7px;
      font-size: 14px; font-weight: 600; color: #fff;
      background: #673147; cursor: pointer; transition: background .18s;
    }
    .btn-save-modal:hover:not(:disabled) { background: #4a5aae; }
    .btn-save-modal:disabled { opacity: .65; cursor: not-allowed; }

    /* ── Scrollbar ───────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); }
  </style>
</head>
<body>
<div class="app">

  <!-- ════════════ SIDEBAR ════════════ -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- ════════════ MAIN ════════════ -->
  <div class="main-area">

    <header id="topbar" class="topbar"></header>

    <main class="page-content">

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <div class="page-title">Transaction Type</div>
          <div class="page-subtitle">Define and manage transaction types</div>
        </div>
      </div>

      <!-- Feedback -->
      <div class="feedback" id="feedbackMsg"></div>

      <!-- Help note -->
      <div class="help-note">
        <div class="help-note-icon">ℹ️</div>
        <div class="help-note-text">
          The added Transaction Type will be populated in the <strong>'Method'</strong> dropdown
          on the <strong>Expense</strong> page.
        </div>
      </div>

      <!-- ── Add Transaction Type card ───────────────────── -->
      <div class="add-card">
        <div class="add-card-title">Add Transaction Type</div>
        <div class="add-row">
          <div class="add-field">
            <label for="newTypeName">Transaction Type <span class="required-star">*</span></label>
            <input type="text" id="newTypeName"
                   placeholder="e.g. Income, Expense, Transfer…"
                   onkeydown="if(event.key==='Enter') addTransactionType()" />
          </div>
          <button class="btn-add" id="addBtn" onclick="addTransactionType()">＋ Add</button>
        </div>
        <span class="field-hint" id="newTypeNameHint"></span>
      </div>

      <!-- ── Transaction Types table card ──────────────────── -->
      <div class="card">
        <div class="table-wrap">
          <table class="tt-table">
            <thead>
              <tr>
                <th style="width:52px;">#</th>
                <th>Transaction Type</th>
                <th style="width:160px;">Actions</th>
              </tr>
            </thead>
            <tbody id="ttTableBody"></tbody>
          </table>
        </div>
      </div>

    </main>
    <footer id="app-footer" class="app-footer"></footer>
  </div>
</div>

<!-- ════════════ EDIT MODAL ════════════ -->
<div class="modal-overlay" id="editModal" onclick="onOverlayClick(event)">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Edit Transaction Type</span>
      <button class="modal-close" onclick="closeModal()" title="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="editTypeName">Transaction Type <span class="required-star">*</span></label>
        <input type="text" id="editTypeName"
               placeholder="Enter transaction type"
               onkeydown="if(event.key==='Enter') saveEdit()" />
        <span class="field-hint" id="editTypeNameHint"></span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save-modal" id="modalSaveBtn" onclick="saveEdit()">Update</button>
    </div>
  </div>
</div>

<script>
  /* ════════════════════════════════════
     MENU
  ════════════════════════════════════ */
  

  /* ════════════════════════════════════
     STATE
  ════════════════════════════════════ */
  let allTypes  = [];
  const typeMap = {};   // id → type object for safe onclick lookups
  let editingId = null; // null = not editing; integer = editing this id

  /* ════════════════════════════════════
     LOAD
  ════════════════════════════════════ */
  async function loadTypes() {
    try {
      const res = await fetch('/api/transaction-types');
      if (!res.ok) throw new Error('Server error');
      allTypes = await res.json();
    } catch {
      allTypes = [];
      showFeedback('❌ Failed to load transaction types from the server.', 'error');
    }
    Object.keys(typeMap).forEach(k => delete typeMap[k]);
    allTypes.forEach(t => { typeMap[t.id] = t; });
    renderTable();
  }

  /* ════════════════════════════════════
     RENDER
  ════════════════════════════════════ */
  function renderTable() {
    const tbody = document.getElementById('ttTableBody');

    if (allTypes.length === 0) {
      tbody.innerHTML = `
        <tr><td colspan="3">
          <div class="empty-state">
            <div class="empty-icon">💳</div>
            <div class="empty-text">No transaction types yet. Add one above to get started.</div>
          </div>
        </td></tr>`;
      return;
    }

    tbody.innerHTML = allTypes.map((t, idx) => `
      <tr>
        <td class="row-num">${idx + 1}</td>
        <td><span class="tt-name">${escHtml(t.typeName)}</span></td>
        <td>
          <div class="actions">
            <button class="btn-action btn-edit"   onclick="openEditModal(${t.id})" title="Edit">📝</button>
            <button class="btn-action btn-delete" onclick="deleteType(${t.id})" title="Delete">🗑</button>
          </div>
        </td>
      </tr>`).join('');
  }

  /* ════════════════════════════════════
     ADD
  ════════════════════════════════════ */
  async function addTransactionType() {
    const input = document.getElementById('newTypeName');
    const hint  = document.getElementById('newTypeNameHint');
    const name  = input.value.trim();

    if (!name) {
      hint.textContent = 'Transaction type is required.';
      input.classList.add('invalid');
      input.focus();
      return;
    }
    hint.textContent = '';
    input.classList.remove('invalid');

    const btn = document.getElementById('addBtn');
    btn.disabled    = true;
    btn.textContent = 'Adding…';

    try {
      const res  = await fetch('/api/transaction-types', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ typeName: name })
      });
      const data = await res.json();
      if (res.ok) {
        input.value = '';
        showFeedback(`✅ Transaction type "${escHtml(name)}" added successfully.`, 'success');
        await loadTypes();
      } else {
        showFeedback(`❌ ${data.error || 'Failed to add transaction type.'}`, 'error');
      }
    } catch {
      showFeedback('❌ Network error — could not reach the server.', 'error');
    } finally {
      btn.disabled    = false;
      btn.textContent = '＋ Add';
    }
  }

  /* ════════════════════════════════════
     EDIT MODAL — open / close
  ════════════════════════════════════ */
  function openEditModal(id) {
    const t = typeMap[id];
    if (!t) return;
    editingId = id;

    const input = document.getElementById('editTypeName');
    input.value = t.typeName;
    input.classList.remove('invalid');
    document.getElementById('editTypeNameHint').textContent = '';
    document.getElementById('modalSaveBtn').textContent     = 'Update';
    document.getElementById('modalSaveBtn').disabled        = false;
    document.getElementById('editModal').classList.add('open');
    setTimeout(() => input.focus(), 80);
  }

  function closeModal() {
    document.getElementById('editModal').classList.remove('open');
    editingId = null;
  }

  function onOverlayClick(event) {
    if (event.target === document.getElementById('editModal')) closeModal();
  }

  /* ════════════════════════════════════
     SAVE EDIT
  ════════════════════════════════════ */
  async function saveEdit() {
    const input = document.getElementById('editTypeName');
    const hint  = document.getElementById('editTypeNameHint');
    const name  = input.value.trim();

    if (!name) {
      hint.textContent = 'Transaction type is required.';
      input.classList.add('invalid');
      input.focus();
      return;
    }
    hint.textContent = '';
    input.classList.remove('invalid');

    const btn = document.getElementById('modalSaveBtn');
    btn.disabled    = true;
    btn.textContent = 'Updating…';

    try {
      const res  = await fetch(`/api/transaction-types/${editingId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ typeName: name })
      });
      const data = await res.json();
      if (res.ok) {
        closeModal();
        showFeedback(`✅ Transaction type updated to "${escHtml(name)}" successfully.`, 'success');
        await loadTypes();
      } else {
        showFeedback(`❌ ${data.error || 'Failed to update transaction type.'}`, 'error');
      }
    } catch {
      showFeedback('❌ Network error — could not reach the server.', 'error');
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Update';
    }
  }

  /* ════════════════════════════════════
     DELETE
  ════════════════════════════════════ */
  async function deleteType(id) {
    const t    = typeMap[id];
    const name = t ? t.typeName : String(id);
    if (!confirm('Are you sure you want to delete this transaction type?')) return;

    try {
      const res  = await fetch(`/api/transaction-types/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok) {
        showFeedback(`"${escHtml(name)}" has been deleted.`, 'success');
        await loadTypes();
      } else {
        showFeedback(`❌ ${data.error || 'Failed to delete transaction type.'}`, 'error');
      }
    } catch {
      showFeedback('❌ Network error — could not delete transaction type.', 'error');
    }
  }

  /* ════════════════════════════════════
     FEEDBACK
  ════════════════════════════════════ */
  function showFeedback(msg, type) {
    const el = document.getElementById('feedbackMsg');
    el.textContent = msg;
    el.className   = `feedback ${type}`;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    setTimeout(() => { if (el.textContent === msg) el.className = 'feedback'; }, 5000);
  }

  function escHtml(str) {
    return (str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ════════════════════════════════════
     INIT
  ════════════════════════════════════ */
  (function init() {
    loadTypes();
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });
  })();
</script>
<script>
window.CGP_PAGE = { activePage: 'account-settings/transaction-type', pageTitle: 'Transaction Type', openSection: 'account-settings' };
</script>
<script src="/shell.js"></script>
<script src="/session.js"></script>
</body>
</html>
