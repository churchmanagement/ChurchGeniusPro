spring.application.name=ChurchGeniusPro
spring.config.import=classpath:scheduler.properties

# ── Scheduler thread pool ─────────────────────────────────────────────────────
# Spring's default scheduler has ONE thread shared by all @Scheduled jobs
# (~11 cron jobs). A single slow job (SMTP/Twilio/Plaid network call) delays
# every other job past its trigger time. Give the scheduler a small pool.
spring.task.scheduling.pool.size=4

# ── Application Base URL ──────────────────────────────────────────────────────
# Defined per profile:
#   local → application-local.properties  → http://localhost:8080
#   prod  → application-prod.properties   → https://churchgeniuspro.net

# ── Spring Mail (Titan SMTP) ──────────────────────────────────────────────────
#spring.mail.host=smtp.titan.email
#spring.mail.port=587
#spring.mail.username=contact@sharonks.org
#spring.mail.password=Sharon@2018
# Credentials via environment variables — never commit the real password:
#   MAIL_USERNAME=info@churchgeniuspro.com   MAIL_PASSWORD=...
spring.mail.host=smtp.porkbun.com
spring.mail.port=587
spring.mail.username=${CG_MAIL_USERNAME:info@churchgeniuspro.com}
spring.mail.password=${CG_MAIL_PASSWORD:}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# ── Active profile ─────────────────────────────────────────────────────────────
# Supplied by the environment, never hard-coded here (production-readiness audit
# 2026-10-07, Phase 4.2): Azure sets SPRING_PROFILES_ACTIVE=prod; local runs pass
# the profile explicitly — restart-app.bat, or
#   mvnw spring-boot:run -Dspring-boot.run.profiles=local
#   "local" → application-local.properties, "trial" → application-trial.properties
# A run with no profile has no datasource and fails fast at startup.

# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Versioned schema migrations (Flyway) — database audit H1 ──────────────────
# Flyway runs at startup BEFORE Hibernate and records, in flyway_schema_history,
# exactly which schema changes have been applied to this database — the ledger whose
# absence let three script sections dated Aug–Sep 2026 go unapplied without anyone
# knowing (findings P2, H7). ddl-auto=update is deliberately kept (see above): every
# migration is idempotent and no-ops when its target object does not exist, so a fresh
# environment is created by Hibernate and an existing one is repaired by Flyway.
#
# baseline-on-migrate: an existing database (production) has no history table; Flyway
# marks everything up to baseline-version as already present and applies only newer
# migrations. A brand-new database (a test container, a fresh trial) is empty, so Flyway
# skips the baseline and runs every migration — all guarded, so they no-op and Hibernate
# builds the schema. validate-on-migrate stays on; out-of-order stays off.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Pre-Flyway baseline (JPA entities + migrate_production.sql, 2026-09)
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
# Disable open-in-view to prevent DB connections being held for the full HTTP
# request lifecycle — this was causing request threads to hang when the
# connection pool was under pressure.
spring.jpa.open-in-view=false

# ── Logging ───────────────────────────────────────────────────────────────────
# Appenders, file names, rotation and retention are defined in logback-spring.xml
# (Spring Boot's logging.file.* / logging.pattern.* properties do not apply once a
# custom logback config is present — they are removed here rather than left to mislead).
# Levels below DO still apply: Spring sets them through the LoggingSystem at startup.
#
# Three daily files, deleted after 30 days — see LOGGING.md:
#   security-YYYY-MM-DD.log     LOGIN / LOGOUT audit trail
#   error-YYYY-MM-DD.log        ERROR only, with stack traces
#   application-YYYY-MM-DD.log  everything else
logging.level.root=WARN
logging.level.com.churchgeniuspro=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
logging.level.org.hibernate=WARN
# The audit trail is INFO-level and must never be turned down by a level change elsewhere.
logging.level.com.churchgeniuspro.security.audit=INFO

# ── Log file location and retention ──────────────────────────────────────────
# Directory resolution (LogDirectoryPropertyDefiner), in order:
#   1. CGP_LOG_DIR environment variable, if set
#   2. Azure App Service (detected via WEBSITE_INSTANCE_ID) -> $HOME/LogFiles/churchgeniuspro
#      $HOME is the persistent Azure Files share: it survives app restarts, platform
#      restarts, redeployments and instance moves, and is shared by every instance.
#   3. anything else -> ./logs
# Nothing needs to be set on App Service for this to be correct.
logging.cgp.purge-enabled=true
logging.cgp.retention-days=30
logging.cgp.purge-cron=0 40 3 * * *
# Blank = sweep exactly the directory logback writes to.
logging.cgp.directory=

# ── Geolocation for the security audit trail (MaxMind GeoLite2, local file) ──
# Resolves the login IP to city/state/country. The .mmdb file is NOT in the repo
# (MaxMind's licence forbids redistribution, and it is ~60MB) — install it with
# scripts/update-geoip.sh. If absent the app starts normally, logs one warning, and
# records city/state/country as "-". Default path: $HOME/data/GeoLite2-City.mmdb,
# which on App Service is the persistent share, so it survives redeployments.
geoip.enabled=true
geoip.database-path=${GEOIP_DB_PATH:}
geoip.cache-size=5000

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000


spring.datasource.hikari.validation-timeout=5000


# Set this to be 30-60 seconds shorter than the database's wait_timeout
# Azure typically defaults to 30 minutes; try 28 minutes.
spring.datasource.hikari.max-lifetime=1500000

# Ensure the pool tests connections before giving them to the app
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.properties.hibernate.format_sql=true

# ── Session Management ────────────────────────────────────────────────────────
# Default inactivity timeout for all sessions.
# Sessions are persisted to PostgreSQL via @EnableJdbcHttpSession (SessionConfig).
server.servlet.session.timeout=30m
# Only write session to DB when attributes actually change (not on every request).
# This prevents Spring Session from issuing a DB UPDATE on every read-only API
# call, which was causing unauthenticated public endpoints to hang when the
# session table had contention.
spring.session.jdbc.save-mode=on-set-attribute

# ── Failed-login protection (brute-force / credential-stuffing) ──────────────
# Full rationale and threat model: LOGIN_SECURITY.md
#
# Accounts are NEVER permanently locked. Every restriction is a time-boxed block
# that expires on its own, so knowing a username is not enough to deny that person
# access — the account-lockout denial-of-service is closed by design.
#
# Three independent scopes, all counted in PostgreSQL so the limits hold across
# every application instance behind the load balancer:
#   username+IP  5 failures / 15 min -> 15 min block, doubling on repeats (max 2h)
#   IP          20 failures / 15 min -> 15 min block, doubling on repeats (max 2h)
#   username    20 failures / 15 min -> 15 min block, fixed length, cleared by reset
security.login-protection.enabled=true
security.login-protection.window=15m

# Scope: username + IP — the primary control. An attacker submitting wrong passwords
# for a known username blocks only their own address; the real owner is unaffected.
security.login-protection.max-failed-attempts=5
security.login-protection.block-duration=15m
security.login-protection.max-block-duration=2h
security.login-protection.block-escalation-factor=2
security.login-protection.escalation-window=24h

# Scope: IP — one host spraying many usernames.
security.login-protection.ip-scope-enabled=true
security.login-protection.ip-max-failed-attempts=20
security.login-protection.ip-block-duration=15m

# Scope: username from any IP — distributed-attack backstop. Short and non-escalating
# because it is the only scope a third party can trip for someone else. Set
# account-scope-enabled=false for zero account-level DoS surface (a botnet spread over
# many addresses is then slowed by the delay below, but not blocked).
security.login-protection.account-scope-enabled=true
security.login-protection.account-max-failed-attempts=20
security.login-protection.account-block-duration=15m

# Progressive slow-down before the hard threshold. Keep the cap small — the delay
# occupies a servlet thread, so a large value is its own resource-exhaustion vector.
security.login-protection.progressive-delay-enabled=true
security.login-protection.progressive-delay-after-attempts=2
security.login-protection.progressive-delay-step=400ms
security.login-protection.progressive-delay-max=2s

# After this many blocks for the same key inside the escalation window, the generic
# message steers the user towards a password reset. The threshold is never disclosed.
security.login-protection.suggest-password-reset-after-blocks=2

# Minimum gap between password-reset emails for one account (inbox-flood protection).
# Cannot lock anyone out: the previously emailed link stays valid inside the cooldown.
security.login-protection.password-reset-request-cooldown=2m

# DEPLOYMENT-CRITICAL. true = read the client address from X-Forwarded-For / X-Real-IP.
# Correct behind a reverse proxy or load balancer, PROVIDED the proxy overwrites the
# header rather than appending to it. If the app is ever exposed directly to the
# internet, set this to false — otherwise the header is attacker-controlled and the
# IP-based scopes can be side-stepped by rotating it. Conversely, leaving it false
# behind a proxy makes every user share the proxy's address, and the IP scope will
# then throttle legitimate traffic.
security.login-protection.trust-forwarded-headers=true

# Retention for the login_attempt_log / login_block security audit rows, and the
# nightly purge that enforces it.
security.login-protection.retention=30d
security.login-protection.purge-cron=0 20 3 * * *

# ── File Upload ───────────────────────────────────────────────────────────────
# Raised so check / bank-statement photos (phone cameras) aren't rejected.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ── Document AI / Vision OCR (OpenAI GPT-4o) ──────────────────────────────────
# Optional. When openai.api.key is set, the check & bank-statement scanners send
# the image to GPT-4o vision (reads handwriting). When blank, they fall back to
# the in-browser Tesseract OCR automatically. Set the key via an environment
# variable in production rather than committing it:  OPENAI_API_KEY=sk-...
openai.api.key=${OPENAI_API_KEY:}
openai.vision.model=gpt-4o
openai.api.base=https://api.openai.com/v1

# ── Voice commands (OpenAI) ──────────────────────────────────────────────────
# Audio is recorded in the browser, transcribed by OpenAI, then mapped to app
# commands by a small chat model. Both model names are configurable.
openai.voice.transcribe.model=whisper-1
openai.voice.command.model=gpt-4o-mini




# ── Twilio SMS ────────────────────────────────────────────────────────────────
# Provide credentials via environment variables (never commit them):
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# Require a confirmed SMS opt-in (consent + a YES reply) before texting an event
# registrant their confirmation. Leave true for the strict TCPA reading — note that a
# church with no opt-in records will then send no registration texts at all, which is
# intended, and every skip is logged with the number and the reason. Set false to treat
# submitting the registration form as consent for that single confirmation message.
sms.event-registration.require-opt-in=${SMS_REGISTRATION_REQUIRE_OPT_IN:true}

# ── Payroll SSN encryption ────────────────────────────────────────────────────
# AES key (base64, 32 bytes: `openssl rand -base64 32`) for encrypting employee
# SSN last-4 digits at rest. When unset, a derived development key is used and
# a startup WARNING is logged — always set this in production.
payroll.ssn-enc-key=${PAYROLL_SSN_ENC_KEY:}
# Rotation-only (security audit 2026-10-07, Phase 5). Set while re-encrypting the
# stored SSN last-4 values onto a new PAYROLL_SSN_ENC_KEY: the previous base64 key,
# or the word "derived" meaning the built-in development key that was in use when
# no key was configured. Decrypt tries current then previous; the Service Admin
# rotation (GET/POST /api/serviceadmin/payroll/ssn-rotation) re-encrypts the rows.
# Remove this variable once the rotation reports pending=0.
payroll.ssn-enc-key-previous=${PAYROLL_SSN_ENC_KEY_PREVIOUS:}

# ── Plaid Bank Sync ───────────────────────────────────────────────────────────
# All values are supplied via environment variables — NEVER commit the secret or
# the token-encryption key. See PLAID_BANK_SYNC_DESIGN.md.
#   PLAID_CLIENT_ID       Plaid client id (sandbox client id set out-of-band)
#   PLAID_SECRET          Plaid secret (sandbox/production) — backend env only
#   PLAID_ENV             sandbox | production
#   PLAID_BASE_URL        https://sandbox.plaid.com | https://production.plaid.com
#   PLAID_SANDBOX_SECRET  sandbox secret (only needed when PLAID_ENV=production)
#   PLAID_WEBHOOK_URL     https://churchgeniuspro.net/api/plaid/webhook
#   PLAID_TOKEN_ENC_KEY   base64-encoded 32-byte AES key for access-token encryption
plaid.client-id=${PLAID_CLIENT_ID:}
plaid.secret=${PLAID_SECRET:}
plaid.env=${PLAID_ENV:sandbox}
plaid.base-url=${PLAID_BASE_URL:https://sandbox.plaid.com}
# Trial subscriptions are confined to the Plaid sandbox (see PlaidEnvironmentService).
# Plaid issues a DIFFERENT secret per environment - the client id is shared, the
# secret is not - so a deployment running plaid.env=production must set this for
# Trial tenants to reach the sandbox at all. Left blank on a sandbox deployment:
# plaid.secret is already the sandbox secret there.
plaid.sandbox-secret=${PLAID_SANDBOX_SECRET:}
plaid.sandbox-base-url=${PLAID_SANDBOX_BASE_URL:https://sandbox.plaid.com}
# Blank falls back to plaid.redirect-uri. Plaid keeps a SEPARATE allowed-redirect-URI
# list per environment, so the production URI must also be registered under Sandbox
# in the Plaid Dashboard - otherwise Trial link tokens are rejected with INVALID_FIELD.
plaid.sandbox-redirect-uri=${PLAID_SANDBOX_REDIRECT_URI:}
plaid.webhook-url=${PLAID_WEBHOOK_URL:https://churchgeniuspro.net/api/plaid/webhook}
# PLAID_REDIRECT_URI is OPTIONAL and only for OAuth institutions (Chase, BofA...).
# Leave it unset unless the exact URI is registered in the Plaid Dashboard
# (Developers -> API -> Allowed redirect URIs); sending an unregistered URI makes
# /link/token/create fail with INVALID_FIELD for every connection attempt.
plaid.redirect-uri=${PLAID_REDIRECT_URI:}
plaid.products=${PLAID_PRODUCTS:transactions}
plaid.country-codes=${PLAID_COUNTRY_CODES:US}
plaid.token-enc-key=${PLAID_TOKEN_ENC_KEY:}
# The OUTGOING key, set only while rotating PLAID_TOKEN_ENC_KEY. Decrypt-only.
# Rotation procedure (nothing breaks at any step):
#   1. PLAID_TOKEN_ENC_KEY_PREVIOUS = old key, PLAID_TOKEN_ENC_KEY = new key, deploy.
#   2. GET  /api/serviceadmin/plaid/token-rotation   (dry run - shows what would move)
#   3. POST /api/serviceadmin/plaid/token-rotation   (re-encrypts; safe to repeat)
#   4. Clear PLAID_TOKEN_ENC_KEY_PREVIOUS and deploy again.
# Changing PLAID_TOKEN_ENC_KEY WITHOUT this overlap orphans every stored bank
# token and forces every church to reconnect through Plaid Link.
plaid.token-enc-key-previous=${PLAID_TOKEN_ENC_KEY_PREVIOUS:}
plaid.staging-retention-days=${PLAID_STAGING_RETENTION_DAYS:90}
plaid.safety-net-sync-cron=${PLAID_SYNC_CRON:0 15 * * * *}
plaid.retention-purge-cron=${PLAID_PURGE_CRON:0 30 3 * * *}

# ── Web Push / VAPID ─────────────────────────────────────────────────────────
# VAPID key pair for browser push notifications.
# public-key     = raw uncompressed EC point (65 bytes), base64url
# public-key-raw = same as public-key (sent to browser as applicationServerKey)
# private-key    = raw private scalar (32 bytes), base64url
# Provide the private key via the PUSH_VAPID_PRIVATE_KEY environment variable.
push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:}
push.vapid.subject=mailto:admin@churchgeniuspro.com

# ── Public-form CAPTCHA (Connect With Us, Public Prayer, Trial Registration) ──
# Dormant until a secret is set. Setting both values switches the captcha on for
# every public form at once, with no redeploy - which is how it is meant to be
# used: leave it off until a form is actually being abused, then turn it on.
# Keys come from https://www.google.com/recaptcha/admin (reCAPTCHA v2 "I'm not
# a robot"). The site key is public and is served to the page; the secret is not.
public.forms.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
public.forms.recaptcha.secret=${RECAPTCHA_SECRET:}

# ── Public send limits (SMS opt-in, event RSVP, membership form, sign-up codes,
# website contact) ── the per-origin / per-contact / per-church ceilings that stop
# an anonymous caller from driving those endpoints in a loop. The numbers live in
# PublicSendLimiter (one place, per endpoint). This is the emergency switch only:
# set it to false, with no redeploy, if a legitimate event or sign-up drive is
# ever being refused, then raise the specific policy instead of leaving it off.
public.send-limits.enabled=${PUBLIC_SEND_LIMITS_ENABLED:true}

# ── Actuator ── nothing in front of /actuator/** authenticates (there is no Spring
# Security), so what is exposed over HTTP is pinned here rather than left to the
# framework default: the liveness probe only, with no details. Widen this only
# together with an authentication layer for the endpoints you add.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Platform billing: the Service Admin's OWN Stripe account (Phase 6) ──────────
# Card payments for ChurchGeniusPro invoices to client churches. Completely separate
# from the church donation integration, which keeps its keys in stripe_settings.
# Set ONLY as Azure App Service application settings; never stored in the database,
# never returned to the browser (except the publishable key, which Stripe.js needs),
# never logged. Blank = card payment unavailable (invoices can still be marked paid).
#   PLATFORM_STRIPE_SECRET_KEY       sk_live_… / sk_test_…  (restricted rk_… also accepted)
#   PLATFORM_STRIPE_PUBLISHABLE_KEY  pk_live_… / pk_test_…  (same mode as the secret key)
#   PLATFORM_STRIPE_WEBHOOK_SECRET   whsec_…  for POST /api/billing/stripe-webhook
platform.stripe.secret-key=${PLATFORM_STRIPE_SECRET_KEY:}
platform.stripe.publishable-key=${PLATFORM_STRIPE_PUBLISHABLE_KEY:}
platform.stripe.webhook-secret=${PLATFORM_STRIPE_WEBHOOK_SECRET:}
# Payment methods offered on the invoice page are managed in the Stripe Dashboard (Settings →
# Payment methods). Optionally list Stripe method types that must never be offered for platform
# invoices, comma-separated (e.g. affirm,klarna). Blank = whatever the Dashboard enables.
#   PLATFORM_STRIPE_EXCLUDED_METHODS
platform.stripe.excluded-methods=${PLATFORM_STRIPE_EXCLUDED_METHODS:}
