spring.datasource.url=${DB_URL_PROD}
spring.datasource.username=${DB_USER_PROD}
spring.datasource.password=${DB_PASSWORD_PROD}


spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ── Application Base URL (production) ────────────────────────────────────────
app.base-url=https://churchgeniuspro.net

# ── Cookie security (HTTPS in production) ────────────────────────────────────
# Ensures the remember-me cookie is only sent over HTTPS
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
