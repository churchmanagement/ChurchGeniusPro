spring.datasource.url=${DB_URL_PROD}
spring.datasource.username=${DB_USER_PROD}
spring.datasource.password=${DB_PASSWORD_PROD}


spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ── Application Base URL (production) ────────────────────────────────────────
# Used in outbound emails (RSVP links, reminders, etc.). Overridable via the
# APP_BASE_URL environment variable; defaults to the production domain so the
# app still boots when the variable isn't set.
app.base-url=${APP_BASE_URL:https://churchgeniuspro.net}

# ── Logging (production) ─────────────────────────────────────────────────────
# Application packages log at INFO in production; the base file keeps DEBUG for
# local/trial runs. security.audit stays at INFO (application.properties).
logging.level.com.churchgeniuspro=INFO

# ── Cookie security (HTTPS in production) ────────────────────────────────────
# Ensures the remember-me cookie is only sent over HTTPS
server.servlet.session.cookie.secure=true
# Lax is what production has actually been running (the code ignored this property
# until 2026-09). Strict would also block the session cookie on top-level navigations
# that start outside the site — e.g. a member clicking an event link in a reminder
# email would land on the login page. Cross-site POSTs are refused either way, and
# CsrfOriginFilter checks Origin/Referer on every state-changing /api call.
server.servlet.session.cookie.same-site=lax

# ── Plaid OAuth redirect (production) ────────────────────────────────────────
# OAuth institutions (U.S. Bank, Chase, BofA, ...) require a redirect_uri in
# /link/token/create. This EXACT URI must also be registered in the Plaid
# Dashboard -> Developers -> API -> Allowed redirect URIs, or link-token
# creation fails with INVALID_FIELD for ALL connections. The /plaid-oauth.html
# page completes the OAuth return leg and resumes Plaid Link.
plaid.redirect-uri=${PLAID_REDIRECT_URI:https://churchgeniuspro.net/plaid-oauth.html}
