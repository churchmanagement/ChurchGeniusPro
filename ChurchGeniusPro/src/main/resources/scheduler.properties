# ─────────────────────────────────────────────────────────────────────────────
# Cron expressions for ReminderSchedulerService scheduled jobs.
# Format: second minute hour dayOfMonth month dayOfWeek
# ─────────────────────────────────────────────────────────────────────────────

# Daily at 07:50 — birthday reminders
scheduler.job.birthday-reminders=0 00 04 * * *

# Daily at 05:00 — anniversary reminders
scheduler.job.anniversary-reminders=0 00 05 * * *

# Daily at 06:00 — Celebrants (Members Only): birthday/anniversary greetings to Members only
scheduler.job.celebrants-members-reminders=0 00 06 * * *

# 1st of every month at 07:50 — monthly reminders
scheduler.job.monthly-reminders=0 50 7 1 * *

# 1 Jan at 00:50 — New Year reminders
scheduler.job.new-year-reminders=0 00 0 1 1 *

# 25 Dec at 09:50 — Christmas reminders
scheduler.job.christmas-reminders=0 50 6 25 12 *

# 4 Jul at 09:50 — US Independence Day reminders
scheduler.job.independence-day-reminders=0 00 9 4 7 *

# Every 30 minutes (on the hour) — half-hourly meeting/event reminders
scheduler.job.half-hourly-reminders=0 30 * * * *
#scheduler.job.half-hourly-reminders=0 */2 * * * *
# Every Monday at 07:30 — weekly meeting reminders
scheduler.job.weekly-meeting-reminders=0 30 07 * * MON

# Hourly on the hour — event Registration Reminders (email/SMS to configured
# contacts who have not yet registered; fires N days before the event).
# Once-per-day dedupe is enforced via reminder_sent_log, so the frequency only
# affects how early in the day the reminder goes out.
scheduler.job.registration-reminders=0 0 * * * *

# Daily at 07:00 — subscription expiry notices (10/5/1 days before end_date +
# an "expired" notice on the end date; all plans incl. Trial). Dedupe via
# reminder_sent_log type SUBSCRIPTION_EXPIRY.
scheduler.job.subscription-expiry=0 0 7 * * *
