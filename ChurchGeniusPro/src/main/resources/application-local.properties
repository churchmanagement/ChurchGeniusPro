# ── Local datasource ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/churchgeniuspro
spring.datasource.username=postgres
spring.datasource.password=local
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Application Base URL (local) ──────────────────────────────────────────────
app.base-url=http://localhost:8080

# ── Live frontend reload (local dev only) ─────────────────────────────────────
# Serve static resources straight from the SOURCE folder on disk (first entry)
# instead of the compiled classpath copy, so edits to any file under
# src/main/resources/static/ show up on a plain browser refresh — no rebuild,
# no restart. The classpath entry stays as a fallback (e.g. when the app is
# started from a packaged JAR where the source folder doesn't exist).
# NOTE: the relative path assumes the app is started from the project root
# (restart-app.bat / mvnw spring-boot:run both do this).
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
# Don't let the browser cache static assets during development.
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true

# ── OpenAI (local dev) ────────────────────────────────────────────────────────
# Powers the voice commands (income/expense/home) AND the Vision scanners.
# The OPENAI_API_KEY environment variable wins when set; otherwise the local
# fallback key below is used so the feature works out-of-the-box on localhost.
# SECURITY: rotate this key and provide it via OPENAI_API_KEY in production —
# do not rely on the committed fallback for a shared/prod deployment.
openai.api.key=${OPENAI_API_KEY:}
