name: CI/CD

# Full quality gate. The `promote` job (production deploy) runs ONLY after every
# critical job succeeds, enforcing: no promotion unless all critical tests pass
# and performance thresholds are met.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  BASE_URL: http://localhost:8080

jobs:
  # ── 1. Build + fast unit/web-slice tests + multi-tenant readiness ──
  build-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build package
        run: bash scripts/build.sh
      - name: Unit + web-slice tests
        run: bash scripts/test-unit.sh
      - name: Multi-tenant readiness check
        run: bash scripts/multitenant-check.sh
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
      - name: Publish unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # ── 2. Integration tests on real PostgreSQL (Testcontainers) + coverage gate ──
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Integration tests + JaCoCo coverage gate
        run: bash scripts/test-integration.sh
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ── 3. Code quality + dead code + unused dependencies ──
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: SpotBugs + PMD (dead code, bugs, duplication)
        run: bash scripts/quality-scan.sh
      - name: Unused / undeclared dependency analysis
        run: FAIL=0 bash scripts/analyze-deps.sh

  # ── 4. Security: vulnerable dependencies (OWASP dependency-check) ──
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: OWASP dependency-check (fails on CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -Psecurity -DskipTests verify ${NVD_API_KEY:+-DnvdApiKey=$NVD_API_KEY}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ── 5. E2E (Playwright) + DAST (ZAP) + load/performance gate (k6) ──
  e2e-load:
    runs-on: ubuntu-latest
    needs: build-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/
      - name: Start application
        run: |
          java -jar target/*.jar \
            --server.port=8080 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/postgres \
            --spring.datasource.username=postgres \
            --spring.datasource.password=local \
            --spring.jpa.hibernate.ddl-auto=update \
            --openai.api.key= \
            --spring.mail.host=localhost > app.log 2>&1 &
          echo "Waiting for app to boot..."
          for i in $(seq 1 60); do
            curl -fsS "$BASE_URL/login.html" >/dev/null 2>&1 && { echo "App is up"; break; }
            sleep 3
          done
          curl -fsS "$BASE_URL/login.html" >/dev/null
      - name: Playwright E2E
        run: bash scripts/test-e2e.sh
      - name: ZAP baseline DAST
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.BASE_URL }}
          rules_file_name: security/zap-rules.tsv
          cmd_options: '-I'
      - name: k6 load test (performance gate)
        run: bash scripts/load-test.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-load-reports
          path: |
            e2e/playwright-report/
            load/summary.json
            app.log

  # ── 6. PROMOTION GATE: deploy only when every critical job passed ──
  promote:
    runs-on: ubuntu-latest
    needs: [ build-unit, integration, quality, security, e2e-load ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/
      - name: Deploy to production
        env:
          PROMOTE_OK: 'true'
          DEPLOY_ENV: production
          GIT_SHA: ${{ github.sha }}
        run: bash scripts/deploy.sh
